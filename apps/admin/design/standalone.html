  // Persist the open-tab workspace.
  React.useEffect(() => {
    try { localStorage.setItem(TABS_KEY, JSON.stringify({ tabs, activeKey })); } catch {}
  }, [tabs, activeKey]);

  // Live data: session-created loans are prepended to the seed book;
  // bridge-created allocations are merged into the allocation list.
  const data = React.useMemo(() => {
    const liveAllocs = (window.CredXBridge ? window.CredXBridge.getAllocations() : [])
      .map((a, i) => ({ ...a, _id: a.id || ('live:' + i), _src: 'live' }));
    const seedAllocs = window.CREDX_DATA.ALLOCATIONS
      .map((a, i) => ({ ...a, _id: 'seed:' + i, _src: 'seed' }));
    const bridgeRemoved = window.CredXBridge ? window.CredXBridge.getRemovedAllocs() : [];
    const isPersistRemoved = (a) => window.CredXBridge
      ? bridgeRemoved.includes(window.CredXBridge.seedAllocKey(a)) : false;
    const allAllocs = [...liveAllocs, ...seedAllocs]
      .filter(a => !removedAllocs.has(a._id) && !isPersistRemoved(a));
    return {
      ...window.CREDX_DATA,
      LOANS: [...newLoans, ...window.CREDX_DATA.LOANS],
      ALLOCATIONS: allAllocs,
    };
  }, [newLoans, activeKey, tabs, removedAllocs, bridgeVer]);

  // Publish per-loan committed capital (seed + live − removed) to the shared
  // bridge so the investor portal's "% funded" reflects the real allocation
  // book — and updates whenever an allocation is added or pulled here.
  React.useEffect(() => {
    if (!window.CredXBridge) return;
    const byLoan = {};
    data.ALLOCATIONS.forEach(a => {
      if (!a || !a.loanId) return;
      byLoan[a.loanId] = (byLoan[a.loanId] || 0) + (Number(a.amount) || 0);
    });
    window.CredXBridge.setFundingByLoan(byLoan);
  }, [data]);

  // Re-render whenever the shared bridge changes (e.g. a new allocation
  // written here, or an investor-portal submission) so allocation-driven
  // views and the investor portal's funding bars stay in sync.
  React.useEffect(() => window.CredXBridge
    ? window.CredXBridge.subscribe(() => setBridgeVer(v => v + 1)) : undefined, []);

  // Re-render when an underwriting case changes.
  React.useEffect(() => window.CredXCases
    ? window.CredXCases.subscribe(() => setCaseVer(v => v + 1)) : undefined, []);
  // Re-render the shell (sidebar alert badge) when servicing / alert stores change.
  React.useEffect(() => window.CredXServicing
    ? window.CredXServicing.subscribe(() => setBridgeVer(v => v + 1)) : undefined, []);
  React.useEffect(() => window.CredXAlerts
    ? window.CredXAlerts.subscribe(() => setBridgeVer(v => v + 1)) : undefined, []);
  const cases = React.useMemo(() => window.CredXCases ? window.CredXCases.getAll() : [], [caseVer]);

  React.useEffect(() => {
    document.documentElement.setAttribute('data-theme', theme);
    try { localStorage.setItem('credx-theme', theme); } catch {}
  }, [theme]);

  const navigate = (r) => { setRoute(r); setActiveKey(null); setMobNav(false); };
  const openTab = (tab) => {
    setTabs(prev => prev.some(t => t.key === tab.key) ? prev : [...prev, tab]);
    setActiveKey(tab.key);
  };
  const openLoan = (id) => openTab({ key: 'loan:' + id, kind: 'loan', ref: id, label: id });
  const openCase = (ref) => {
    const c = (window.CredXCases ? window.CredXCases.get(ref) : null);
    openTab({ key: 'case:' + ref, kind: 'case', ref, label: c ? c.ref : ref });
  };
  const openInvestor = (ref) => {
    const inv = data.INVESTORS.find(i => i.ref === ref);
    openTab({ key: 'inv:' + ref, kind: 'investor', ref, label: inv ? inv.name : ref });
  };
  const closeTab = (key) => {
    setTabs(prev => {
      const idx = prev.findIndex(t => t.key === key);
      const next = prev.filter(t => t.key !== key);
      if (key === activeKey) setActiveKey((next[idx] || next[idx - 1] || {}).key || null);
      return next;
    });
  };
  const toggleTheme = () => setTheme(t => t === 'light' ? 'dark' : 'light');
  const openWizard = () => setWizardOpen(true);

  // Pull an investor allocation off a deal that has not yet completed.
  // Live (bridge-created) allocations are removed from shared storage; seed
  // allocations are recorded as removed in the shared bridge (so the removal
  // persists across reloads and reaches the investor page in its own tab).
  // All are also suppressed locally so the views update immediately.
  const removeAllocation = (alloc) => {
    if (!alloc) return;
    if (alloc._src === 'live' && alloc.id && window.CredXBridge) {
      window.CredXBridge.removeAllocation(alloc.id);
    } else if (window.CredXBridge) {
      window.CredXBridge.removeSeedAllocation(alloc);
    }
    setRemovedAllocs(prev => {
      const next = new Set(prev);
      next.add(alloc._id);
      return next;
    });
  };

  // Add an investor allocation to a loan. Persisted to the shared bridge so
  // it shows across tabs AND drives the investor portal's "deal funded" bar.
  const addAllocation = (alloc) => {
    if (window.CredXBridge) window.CredXBridge.addAllocation(alloc);
    setBridgeVer(v => v + 1);
  };

  // Called by the wizard on “Generate DIP” - record the loan and land on the register.
  const addLoan = (loan) => {
    setNewLoans(prev => [loan, ...prev]);
    setWizardOpen(false);
    setActiveKey(null);
    setRoute('loans');
    setHighlightId(loan.id);
    setTimeout(() => setHighlightId(null), 4500);
  };

  const registerTitles = { dashboard: 'Dashboard', alerts: 'Alerts', crm: 'Relationships', loans: 'Loan register', underwriting: 'Underwriting', investors: 'Investor register', allocations: 'Allocations', maturity: 'Maturity tracker', monthly: 'Monthly summary', overview: 'Fund overview' };
  const activeTab = tabs.find(t => t.key === activeKey);

  const renderRegister = () => (
    <React.Fragment>
      {route === 'dashboard' && <Dashboard data={data} navigate={navigate} openLoan={openLoan} openWizard={openWizard}/>}
      {route === 'alerts' && <AlertsSection data={data} navigate={navigate} openLoan={openLoan}/>}
      {route === 'crm' && <CRMView data={data} openLoan={openLoan}/>}
      {route === 'loans' && <LoansView data={data} openLoan={openLoan} openWizard={openWizard} highlightId={highlightId}/>}
      {route === 'underwriting' && <UnderwritingView data={data} cases={cases} openCase={openCase}/>}
      {route === 'investors' && <InvestorsView data={data} openInvestor={openInvestor}/>}
      {route === 'allocations' && <AllocationsView data={data} openLoan={openLoan} openInvestor={openInvestor} removeAllocation={removeAllocation} addAllocation={addAllocation}/>}
      {route === 'maturity' && <MaturityView data={data} openLoan={openLoan}/>}
      {route === 'monthly' && <MonthlyView data={data}/>}
      {route === 'overview' && <FundOverviewView data={data}/>}
    </React.Fragment>
  );
  const renderRecord = () => {
    if (!activeTab) return null;
    if (activeTab.kind === 'loan') {
      return <LoanDrawer key={activeTab.key} loanId={activeTab.ref} data={data} embedded
                         openInvestor={openInvestor} removeAllocation={removeAllocation} openCase={openCase} caseVer={caseVer} onClose={() => closeTab(activeTab.key)}/>;
    }
    if (activeTab.kind === 'case') {
      return <CaseWorkspace key={activeTab.key} caseRef={activeTab.ref} data={data} openLoan={openLoan} caseVer={caseVer}/>;
    }
    return <InvestorPage key={activeTab.key} investorRef={activeTab.ref} data={data} embedded/>;
  };

  return (
    <div className="app">
      <Sidebar route={activeKey ? null : route} navigate={navigate} data={data} mobOpen={mobNav}/>
      {mobNav && <div className="m-sidebar-scrim" onClick={() => setMobNav(false)}/>}
      <main className="main">
        <div className="topdock">
          <Topbar route={route} data={data} theme={theme} toggleTheme={toggleTheme} onMenu={() => setMobNav(true)} openLoan={openLoan} openInvestor={openInvestor}/>
          <TabStrip tabs={tabs} activeKey={activeKey} registerLabel={registerTitles[route] || 'Workspace'}
                    onHome={() => setActiveKey(null)} onSelect={setActiveKey} onClose={closeTab}/>
        </div>
        <div className="content">
          {activeKey ? renderRecord() : renderRegister()}
        </div>
      </main>
      <MobileTabBar route={activeKey ? null : route} navigate={navigate} openMenu={() => setMobNav(true)}/>
      {wizardOpen && <LoanWizard data={data} onClose={() => setWizardOpen(false)} addLoan={addLoan}/>}
    </div>
  );
}

}

function TabStrip({ tabs, activeKey, registerLabel, onHome, onSelect, onClose }) {
  return (
    <div className="tabstrip">
      <button className={"wtab wtab-home" + (!activeKey ? ' on' : '')} onClick={onHome} title="Back to register">
        <span className="wtab-label">{registerLabel}</span>
      </button>
      <div className="tabstrip-scroll">
        {tabs.map(t => (
          <button key={t.key} className={"wtab" + (activeKey === t.key ? ' on' : '')} onClick={() => onSelect(t.key)} title={t.label}>
            <span className="wtab-label">{t.label}</span>
            <span className="wtab-x" role="button" aria-label="Close tab"
                  onClick={(e) => { e.stopPropagation(); onClose(t.key); }}>✕</span>
          </button>
        ))}
      </div>
    </div>
  );
}

function Sidebar({ route, navigate, data, mobOpen }) {
  const counts = {
    loans: data.LOANS.length,
    pipeline: data.LOANS.filter(l => l.status === 'Pipeline').length,
    underwriting: (window.CredXCases ? window.CredXCases.getAll().filter(c => !c.completed).length : 0),
    investors: data.INVESTORS.length,
    allocations: data.ALLOCATIONS.length,
    maturity: data.LOANS.filter(l => l.status === 'Active' &&
      daysFromAsOf(l.expectedRedemption, data.ASOF_DATE) <= 30).length
  };
  // Actionable-alert counts for the nav badge (interest periods to apply +
  // upcoming maturities + active custom alerts). Overdue items drive the amber badge.
  const alertCounts = (() => {
    let total = 0, overdue = 0;
    const active = data.LOANS.filter(l => l.status === 'Active');
    if (window.computeInterestSchedule) {
      active.forEach(l => {
        const due = window.computeInterestSchedule(l, data.ASOF_DATE).periods.filter(p => p.status === 'due').length;
        if (due) { total += 1; overdue += 1; }
      });
    }
    active.forEach(l => {
      const d = daysFromAsOf(l.expectedRedemption, data.ASOF_DATE);
      if (d != null && d <= 60) { total += 1; if (d <= 14) overdue += 1; }
    });
    (window.CredXAlerts ? window.CredXAlerts.active() : []).forEach(a => {
      total += 1;
      const d = a.dueDate ? daysFromAsOf(a.dueDate, data.ASOF_DATE) : null;
      if (d != null && d < 0) overdue += 1;
    });
    return { total, overdue };
  })();
  // CRM: organisations on file + open follow-ups (overdue drives the amber badge).
  const crmCounts = (() => {
    if (!window.CredXCRM) return { total: 0, overdue: 0 };
    const stored = window.CredXCRM.all().filter(r => !r.mirror).length;
    const mirrored = window.crmMirrors ? window.crmMirrors(data).length : 0;
    const f = window.CredXCRM.followUps();
    return { total: stored + mirrored, overdue: f.filter(x => x.overdue).length };
  })();
  const groups = [
    { title: '', items: [
      { id: 'dashboard', label: 'Dashboard', icon: IconHome },
      { id: 'alerts', label: 'Alerts', icon: IconBell,
        count: alertCounts.total, badge: alertCounts.overdue > 0 ? 'amber' : null }
    ]},
    { title: 'Origination', items: [
      { id: 'underwriting', label: 'Underwriting', icon: IconShield, count: counts.underwriting }
    ]},
    { title: 'Relationships', items: [
      { id: 'crm', label: 'CRM', icon: IconContacts, count: crmCounts.total,
        badge: crmCounts.overdue > 0 ? 'amber' : null }
    ]},
    { title: 'Records', items: [
      { id: 'loans', label: 'Loan register', icon: IconLoan, count: counts.loans },
      { id: 'investors', label: 'Investor register', icon: IconUsers, count: counts.investors },
      { id: 'allocations', label: 'Allocations', icon: IconLink, count: counts.allocations }
    ]},
    { title: 'Reporting', items: [
      { id: 'maturity', label: 'Maturity tracker', icon: IconClock,
        count: counts.maturity, badge: counts.maturity > 0 ? 'amber' : null },
      { id: 'monthly', label: 'Monthly summary', icon: IconChart },
      { id: 'overview', label: 'Fund overview', icon: IconBook }
    ]}
  ];

  return (
    <aside className={'sidebar' + (mobOpen ? ' m-open' : '')}>
      <div className="sidebar-brand">

function GlobalSearch({ data, openLoan, openInvestor }) {
  const [q, setQ] = React.useState('');
  const [open, setOpen] = React.useState(false);
  const [active, setActive] = React.useState(0);
  const boxRef = React.useRef(null);

  const results = React.useMemo(() => {
    const term = q.trim().toLowerCase();
    if (!term) return [];
    const loans = (data.LOANS || []).filter(l =>
      (l.id || '').toLowerCase().includes(term) || (l.borrower || '').toLowerCase().includes(term)
    ).slice(0, 6).map(l => ({ type: 'loan', key: l.id, title: l.id, sub: l.borrower }));
    const invs = (data.INVESTORS || []).filter(i =>
      (i.name || '').toLowerCase().includes(term) || (i.ref || '').toLowerCase().includes(term) || (i.email || '').toLowerCase().includes(term)
    ).slice(0, 6).map(i => ({ type: 'investor', key: i.ref, title: i.name, sub: i.ref }));
    return [...loans, ...invs];
  }, [q, data]);

  React.useEffect(() => { setActive(0); }, [q]);
  React.useEffect(() => {
    const onDoc = (e) => { if (boxRef.current && !boxRef.current.contains(e.target)) setOpen(false); };
    document.addEventListener('mousedown', onDoc);
    return () => document.removeEventListener('mousedown', onDoc);
  }, []);

  const choose = (r) => {
    if (!r) return;
    if (r.type === 'loan') openLoan(r.key); else openInvestor(r.key);
    setQ(''); setOpen(false);
  };
  const onKey = (e) => {
    if (e.key === 'Escape') { setOpen(false); return; }
    if (!open || !results.length) return;
    if (e.key === 'ArrowDown') { e.preventDefault(); setActive(a => Math.min(a + 1, results.length - 1)); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); setActive(a => Math.max(a - 1, 0)); }
    else if (e.key === 'Enter') { e.preventDefault(); choose(results[active]); }
  };

  return (
    <div className="gsearch" ref={boxRef}>
      <div className="search-box">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
          <circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <input value={q} onChange={e => { setQ(e.target.value); setOpen(true); }}
               onFocus={() => setOpen(true)} onKeyDown={onKey}
               placeholder="Search loans, investors…"/>
      </div>
      {open && q.trim() && (
        <div className="gsearch-pop">
          {results.length === 0 ? (
            <div className="gsearch-empty">No loans or investors match “{q.trim()}”</div>
          ) : (
            results.map((r, i) => (
              <button key={r.type + ':' + r.key} className={"gsearch-item" + (i === active ? ' on' : '')}
                      onMouseEnter={() => setActive(i)} onClick={() => choose(r)}>
                <span className="gsearch-kind">{r.type === 'loan' ? 'Loan' : 'Investor'}</span>
                <span className="gsearch-main">
                  <span className="gsearch-title">{r.title}</span>
                  <span className="gsearch-sub">{r.sub}</span>
                </span>
              </button>
            ))
          )}
        </div>
      )}
    </div>
  );
}

function Topbar({ route, data, theme, toggleTheme, onMenu, openLoan, openInvestor }) {
  const titles = {
    dashboard: 'Dashboard',
    alerts: 'Alerts',
    loans: 'Loan register',
    underwriting: 'Underwriting',
    investors: 'Investor register',
    allocations: 'Allocations',
    maturity: 'Maturity tracker',
    monthly: 'Monthly summary',
    overview: 'Fund overview'
  };
  return (
    <div className="topbar">
      <button className="m-burger m-only" aria-label="Open menu" onClick={onMenu}>
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor"
             strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
      <div className="breadcrumb">
        <span>CredX</span>
        <span className="bc-sep">/</span>
        <span className="strong">{titles[route]}</span>
      </div>
      <div className="topbar-right">
        <div className="asof">
          <span className="muted small">As at</span>
          <strong>{fmtDate(data.ASOF_DATE)}</strong>
        </div>
        <div className="topbar-search">
          <GlobalSearch data={data} openLoan={openLoan} openInvestor={openInvestor}/>
        </div>
        <button className="theme-toggle" onClick={toggleTheme}
                title={theme === 'dark' ? 'Switch to light mode' : 'Switch to dark mode'}>
          {theme === 'dark' ? (
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
              <circle cx="12" cy="12" r="4"/>
              <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
            </svg>
          ) : (
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
            </svg>
          )}
        </button>
        <div className="user-chip">
          <Avatar name="Nimit Kaur" size={28}/>
          <div className="user-info">
            <div className="strong small">N. Kaur</div>
            <div className="muted small">Director</div>
          </div>
          <button className="admin-signout" type="button" onClick={() => window.CredXAdminAuth.signOut()}>Sign out</button>
        </div>
      </div>
    </div>
  );
}
