<!DOCTYPE html>
<html lang="en"><head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>CredX · Fund Management</title>
  <style>html.credx-admin-auth-pending body{visibility:hidden}</style>
  <script src="/runtime-config.js"></script>
  <script src="/admin-auth.js"></script>
  <script>
    document.documentElement.classList.add('credx-admin-auth-pending');
    Promise.resolve()
      .then(() => window.CredXAdminAuth.verifySession())
      .then(authorized => {
        if (authorized) {
          document.documentElement.classList.remove('credx-admin-auth-pending');
          return;
        }
        const login = new URL('/login.html', window.location.origin);
        login.searchParams.set('reason', 'session');
        window.location.replace(login.href);
      })
      .catch(() => window.location.replace('/login.html?reason=session'));
  </script>

  <style>
    /* ---------- Tokens ---------- */
    :root {
      /* CredX brand: teal primary, charcoal contrast, off-white backgrounds. */
      --navy-900: #1A1A1A;   /* charcoal - sidebar, dark surfaces */
      --navy-800: #262626;
      --navy-700: #333333;
      --navy-600: #4A4A4A;
      --teal-600: #087B8E;   /* brand teal - headers, CTAs, accents */
      --teal-700: #066676;
      --teal-50:  #E4F0F2;
      --gold-500: #087B8E;   /* gold retired → teal accent */
      --gold-100: #E4F0F2;
      --cream:    #F4F6F9;   /* off-white page bg */
      --cream-2:  #ECEFF3;
      --cream-3:  #E1E6EC;
      --surface:  #FFFFFF;
      --surface-2:#FFFFFF;
      --topbar-bg: rgba(244, 246, 249, 0.85);
      --ink:      #1A1A1A;
      --ink-2:    #4A5566;
      --ink-3:    #6B7280;
      --line:     #E2E6EC;
      --line-2:   #CDD3DB;
      --red:      #D14536;
      --red-50:   #FBE7E5;
      --green:    #1D9A5C;
      --green-50: #E8F4EE;
      --shadow:   0 1px 2px rgba(0,0,0,.03);
      --sidebar-bg: var(--navy-900);
      --sidebar-fg: #E8EDF2;
    }

    [data-theme="dark"] {
      --navy-900: #141414;
      --navy-800: #1F1F1F;
      --navy-700: #2A2A2A;
      --navy-600: #383838;
      --teal-600: #14A6A6;
      --teal-700: #0A8C97;
      --teal-50:  #0F2E32;
      --gold-500: #14A6A6;
      --gold-100: #0F2E32;
      --cream:    #0E1112;       /* page bg */
      --cream-2:  #171B1D;       /* table headers, subtle */
      --cream-3:  #232829;       /* chip bg */
      --surface:  #191D1F;       /* cards */
      --surface-2:#1F2426;       /* elevated */
      --topbar-bg: rgba(14, 17, 18, 0.85);
      --ink:      #ECEFF1;
      --ink-2:    #98A4AC;
      --ink-3:    #6C7980;
      --line:     rgba(255,255,255,.07);
      --line-2:   rgba(255,255,255,.14);
      --red:      #E25F50;
      --red-50:   #321612;
      --green:    #2BB677;
      --green-50: #0F2A1E;
      --shadow:   0 1px 2px rgba(0,0,0,.4);
      --sidebar-bg: #101314;
      --sidebar-fg: #C8D2DD;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--cream);
      color: var(--ink);
      font-size: 14px;
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
    }
    h1, h2, h3, h4 { font-family: 'Source Serif 4', Georgia, serif; font-weight: 500; letter-spacing: -0.01em; margin: 0; }
    h1 { font-size: 30px; line-height: 1.1; letter-spacing: -0.02em; }
    h2 { font-size: 22px; }
    h3 { font-size: 16px; font-weight: 600; }
    .num, .loan-id { font-family: 'JetBrains Mono', ui-monospace, monospace; font-variant-numeric: tabular-nums; }
    .small { font-size: 12px; }
    .muted { color: var(--ink-2); }
    .strong { font-weight: 600; }
    .accent { color: var(--teal-600); }
    a { color: var(--teal-700); text-decoration: none; }
    a:hover { text-decoration: underline; }
    button { font: inherit; cursor: pointer; }

    /* ---------- App layout ---------- */
    .app { display: grid; grid-template-columns: 240px 1fr; min-height: 100vh; }
    .main { display: flex; flex-direction: column; min-width: 0; }
    .content { padding: 28px 36px 64px; max-width: 1500px; width: 100%; }

    /* ---------- Sidebar ---------- */
    .sidebar {
      background: var(--sidebar-bg);
      color: var(--sidebar-fg);
      padding: 22px 0 12px;
      display: flex; flex-direction: column;
      position: sticky; top: 0; height: 100vh;
    }
    .sidebar-brand { padding: 0 24px 22px; border-bottom: 1px solid rgba(255,255,255,.06); }
    .sidebar-logo {
      width: 110px; height: auto; display: block;
    }
    .brand-sub { font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase;
                 color: rgba(255,255,255,.45); margin-top: 6px; }
    .sidebar-nav { padding: 16px 12px; flex: 1; overflow: auto; }
    .nav-group { margin-bottom: 18px; }
    .nav-group-title {
      font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase;
      color: rgba(255,255,255,.4); padding: 0 12px 8px;
    }
    .nav-item {
      width: 100%; display: flex; align-items: center; gap: 12px;
      padding: 9px 12px; background: transparent; border: 0;
      color: rgba(255,255,255,.78); border-radius: 8px;
      text-align: left; margin-bottom: 1px;
      transition: background .12s, color .12s;
    }
    .nav-item:hover { background: rgba(255,255,255,.05); color: #fff; }
    .nav-item-on {
      background: var(--teal-600); color: #fff;
      box-shadow: 0 1px 0 rgba(0,0,0,.15);
    }
    .nav-item-on:hover { background: var(--teal-600); }
    .nav-icon { display: inline-flex; opacity: 0.85; }
    .nav-item-on .nav-icon { opacity: 1; }
    .nav-label { flex: 1; font-size: 13.5px; font-weight: 500; }
    .nav-count {
      font-size: 11px; padding: 2px 7px; border-radius: 10px;
      background: rgba(255,255,255,.08); color: rgba(255,255,255,.7);
      font-variant-numeric: tabular-nums;
    }
    .nav-item-on .nav-count { background: rgba(0,0,0,.18); color: #fff; }
    .nav-badge-amber { background: var(--gold-500) !important; color: var(--navy-900) !important; font-weight: 600; }
    .sidebar-foot { padding: 12px 24px; border-top: 1px solid rgba(255,255,255,.06); font-size: 11px; }
    .env-tag {
      display: inline-flex; align-items: center; gap: 7px;
      font-size: 11px; color: rgba(255,255,255,.65); margin-bottom: 4px;
    }
    .env-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); box-shadow: 0 0 0 3px rgba(29,154,92,.18); }
    .sidebar-foot .muted { color: rgba(255,255,255,.4); }

    /* ---------- Topbar ---------- */
    .topbar {
      display: flex; align-items: center; justify-content: space-between; gap: 24px;
      padding: 14px 36px; border-bottom: 1px solid var(--line);
      background: var(--topbar-bg); backdrop-filter: blur(8px);
    }
    /* Topbar + workspace tab strip stay pinned together while content scrolls */
    .topdock { position: sticky; top: 0; z-index: 20; }
    .breadcrumb { font-size: 13px; color: var(--ink-2); flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .bc-sep { margin: 0 8px; opacity: 0.4; }
    .topbar-right { display: flex; align-items: center; gap: 14px; flex-shrink: 0; }
    .topbar-search { width: 240px; }
    .topbar-search .search-box { width: 100%; }
    /* Global search dropdown */
    .gsearch { position: relative; }
    .gsearch-pop {
      position: absolute; top: calc(100% + 6px); right: 0; width: 340px;
      background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
      box-shadow: 0 12px 32px rgba(0,0,0,.16); padding: 6px; z-index: 50;
      max-height: 400px; overflow-y: auto;
    }
    .gsearch-head { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em;
      color: var(--ink-2); padding: 8px 10px 4px; }
    .gsearch-empty { padding: 14px 12px; color: var(--ink-2); font-size: 13px; }
    .gsearch-item {
      display: flex; align-items: center; gap: 10px; width: 100%;
      padding: 8px 10px; border: 0; background: transparent; border-radius: 7px;
      cursor: pointer; text-align: left; font: inherit;
    }
    .gsearch-item.on { background: var(--cream-2); }
    .gsearch-kind {
      font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em;
      color: var(--ink-2); background: var(--cream-2); border: 1px solid var(--line);
      padding: 2px 0; border-radius: 5px; flex-shrink: 0; width: 58px; text-align: center;
    }
    .gsearch-item.on .gsearch-kind { background: var(--surface); }
    .gsearch-main { display: flex; flex-direction: column; min-width: 0; }
    .gsearch-title { font-size: 13px; font-weight: 600; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .gsearch-sub { font-size: 11.5px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .asof { display: flex; flex-direction: column; align-items: flex-end; line-height: 1.1; white-space: nowrap; }
    .user-chip { display: flex; align-items: center; gap: 8px; padding: 4px 10px 4px 4px;
                 border: 1px solid var(--line); border-radius: 999px; background: var(--surface); }
    .user-info { line-height: 1.15; }
    .admin-signout { padding: 5px 8px; border: 0; border-left: 1px solid var(--line); background: transparent;
             color: var(--teal-600); font: inherit; font-size: 11px; cursor: pointer; }

    /* ---------- View header ---------- */
    .view { display: flex; flex-direction: column; gap: 20px; }
    .view-header {
      display: flex; justify-content: space-between; align-items: flex-end;
      margin-bottom: 4px;
    }
    .eyebrow {
      font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase;
      color: var(--teal-600); font-weight: 600; margin-bottom: 8px;
    }
    .view-sub { color: var(--ink-2); font-size: 13.5px; margin-top: 6px; }
    .view-actions { display: flex; gap: 8px; }

    /* ---------- Buttons ---------- */
    .btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 9px 16px; border-radius: 8px; border: 1px solid transparent;
      font-size: 13px; font-weight: 500;
      transition: all .12s;
    }
    .btn-primary { background: var(--teal-600); color: #fff; }
    .btn-primary:hover { background: var(--teal-700); }
    .btn-ghost { background: var(--surface); color: var(--ink); border-color: var(--line); }
    .btn-ghost:hover { border-color: var(--line-2); background: var(--cream-2); }
    .btn-sm { padding: 6px 12px; font-size: 12px; }
    .btn-icon { font-size: 16px; line-height: 1; font-weight: 400; }
    .link-btn { background: transparent; border: 0; color: var(--teal-700); font-size: 12.5px; font-weight: 500; padding: 0; }
    .link-btn:hover { text-decoration: underline; }
    .icon-btn { background: transparent; border: 0; color: var(--ink-2); padding: 6px 10px; border-radius: 6px; }
    .icon-btn:hover { background: var(--cream-2); color: var(--ink); }

    /* ---------- KPI grid ---------- */
    .kpi-grid { display: grid; gap: 14px; }
    .kpi-grid-4 { grid-template-columns: repeat(4, 1fr); }
    .kpi {
      background: var(--surface); border: 1px solid var(--line);
      border-radius: 12px; padding: 18px 20px;
      display: flex; flex-direction: column; gap: 4px;
    }
    .kpi-big { padding: 22px 24px; }
    .kpi-label { font-size: 12px; color: var(--ink-2); font-weight: 500;
                 text-transform: uppercase; letter-spacing: 0.06em; }
    .kpi-value { font-family: 'Source Serif 4', Georgia, serif; font-size: 28px; font-weight: 500;
                 color: var(--ink); letter-spacing: -0.01em; line-height: 1.1; }
    .kpi-big .kpi-value { font-size: 34px; }
    .kpi-sub { font-size: 12px; color: var(--ink-2); margin-top: 6px; }
    .kpi-trend { font-size: 12px; margin-top: 4px; font-weight: 500; }
    .kpi-trend.pos { color: var(--green); }
    .kpi-trend.neg { color: var(--red); }
    .kpi-teal { border-color: var(--teal-600); position: relative; }
    .kpi-teal::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
                        background: var(--teal-600); border-radius: 12px 12px 0 0; }
    .kpi-gold { background: linear-gradient(135deg, var(--gold-100) 0%, white 60%); border-color: var(--gold-500); }
    .kpi-red { border-color: var(--red); }
    .kpi-red .kpi-value { color: var(--red); }

    /* ---------- Cards ---------- */
    .card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
    .card-head {
      display: flex; justify-content: space-between; align-items: center;
      padding: 14px 20px; border-bottom: 1px solid var(--line);
    }
    .card-head h3 { font-family: 'Source Serif 4', Georgia, serif; font-size: 16px; font-weight: 500; }
    .card-body { padding: 18px 20px; }
    .card-body-flush { padding: 0; }

    /* ---------- Dashboard grid ---------- */
    .dash-grid {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px;
    }
    .dash-grid .span-2 { grid-column: span 2; }
    .dash-grid .span-3 { grid-column: span 3; }

    /* ---------- Status / chips ---------- */
    .status-badge {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 3px 9px; border-radius: 999px;
      font-size: 11.5px; font-weight: 500; letter-spacing: 0.01em;
    }
    .status-dot { width: 6px; height: 6px; border-radius: 50%; }

    .mat-chip {
      display: inline-block; padding: 2px 8px; border-radius: 4px;
      font-size: 11.5px; font-weight: 500;
      font-family: 'JetBrains Mono', monospace;
    }
    .mat-ok { background: var(--green-50); color: var(--green); }
    .mat-warn { background: #FBEAE0; color: #B5552B; }
    .mat-critical { background: #F8D9CC; color: #A23E1E; }
    .mat-overdue { background: var(--red-50); color: var(--red); }

    .chip { display: inline-block; padding: 1px 7px; background: var(--cream-2);
            border-radius: 4px; font-size: 11.5px; font-variant-numeric: tabular-nums; color: var(--ink-2); }

    /* ---------- Loan ID / mono ---------- */
    .loan-id { font-size: 12.5px; font-weight: 600; color: var(--navy-800); letter-spacing: 0.02em; }
    .loan-id-big { font-size: 18px; }
    .loan-link { background: transparent; border: 0; color: var(--navy-800); padding: 0;
                 font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 12.5px; }
    .loan-link:hover { color: var(--teal-700); }
    .internal-tag {
      display: inline-block; margin-left: 6px; font-size: 9.5px; padding: 1px 6px;
      background: var(--navy-900); color: white; border-radius: 4px; letter-spacing: 0.06em;
      text-transform: uppercase; font-weight: 600; vertical-align: middle;
    }

    /* ---------- Alert list (dashboard) ---------- */
    .alert-list { display: flex; flex-direction: column; }
    .alert-row {
      display: grid; grid-template-columns: 2fr 1fr 1fr auto; gap: 18px;
      padding: 14px 0; border-bottom: 1px solid var(--line);
      align-items: center; cursor: pointer;
      transition: background .1s;
    }
    .alert-row:hover { background: var(--cream); margin: 0 -20px; padding: 14px 20px; border-radius: 0; }
    .alert-row:last-child { border-bottom: 0; }
    .alert-id .loan-id { font-size: 13px; }
    .alert-redeem, .alert-gross { font-size: 13px; }

    /* ---------- Alerts section (dashboard notification centre) ---------- */
    .alerts-card .card-body { padding-top: 4px; }
    .alerts-head {
      display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
      padding-bottom: 12px; border-bottom: 1px solid var(--line); margin-bottom: 2px;
    }
    .alerts-pills { display: flex; gap: 6px; flex-wrap: wrap; }
    .alerts-pill {
      display: inline-flex; align-items: center; gap: 7px;
      padding: 5px 12px; border-radius: 999px; border: 1px solid var(--line-2);
      background: var(--surface); color: var(--ink-2); font-size: 12.5px; font-weight: 500;
      transition: background .1s, color .1s, border-color .1s;
    }
    .alerts-pill:hover { color: var(--ink); border-color: var(--ink-3); }
    .alerts-pill.is-active { background: var(--navy-900); color: #fff; border-color: var(--navy-900); }
    .alerts-pill .pill-n {
      font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px;
      min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px;
      display: inline-flex; align-items: center; justify-content: center;
      background: var(--cream-2); color: var(--ink-2);
    }
    .alerts-pill.is-active .pill-n { background: rgba(255,255,255,.18); color: #fff; }
    .alerts-pill .pill-n.n-alarm { background: var(--red-50); color: var(--red); }
    .alerts-spacer { flex: 1; }
    .alerts-new-btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 6px 13px; border-radius: 7px; border: 1px solid var(--line-2);
      background: var(--surface); color: var(--ink); font-size: 12.5px; font-weight: 600;
    }
    .alerts-new-btn:hover { background: var(--cream-2); }

    .alerts-list { display: flex; flex-direction: column; }
    .alert-item {
      display: grid; grid-template-columns: 36px 1fr auto; gap: 14px;
      align-items: center; padding: 13px 0; border-bottom: 1px solid var(--line);
      border-left: 3px solid transparent; padding-left: 13px; margin-left: -16px;
      cursor: pointer; transition: background .1s;
    }
    .alert-item:hover { background: var(--cream); }
    .alert-item:last-child { border-bottom: 0; }
    .alert-item.sev-overdue { border-left-color: var(--red); }
    .alert-item.sev-soon    { border-left-color: var(--teal-600); }
    .alert-item.sev-info    { border-left-color: var(--line-2); }

    .alert-glyph {
      width: 32px; height: 32px; border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 15px; font-weight: 600; line-height: 1;
    }
    .alert-glyph.g-interest { background: var(--teal-50); color: var(--teal-700); }
    .alert-glyph.g-maturity { background: var(--cream-2); color: var(--ink); }
    .alert-glyph.g-custom   { background: var(--red-50); color: var(--red); }
    .sev-overdue .alert-glyph.g-interest { background: var(--red-50); color: var(--red); }

    .alert-body { min-width: 0; }
    .alert-title-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .alert-title { font-size: 13.5px; font-weight: 600; color: var(--ink); }
    .alert-tag {
      font-size: 10px; letter-spacing: .07em; text-transform: uppercase; font-weight: 600;
      padding: 2px 7px; border-radius: 5px; background: var(--cream-2); color: var(--ink-2);
    }
    .alert-tag.t-interest { background: var(--teal-50); color: var(--teal-700); }
    .alert-meta { font-size: 12px; color: var(--ink-2); margin-top: 2px; }
    .alert-meta .loan-id { font-size: 11.5px; color: var(--ink); }

    .alert-right { display: flex; align-items: center; gap: 12px; justify-content: flex-end; }
    .alert-amount { text-align: right; }
    .alert-amount .num { font-size: 13.5px; font-weight: 600; }
    .alert-amount .lbl { font-size: 10.5px; color: var(--ink-3); text-transform: uppercase; letter-spacing: .06em; }
    .alert-duechip {
      font-size: 11.5px; font-weight: 600; padding: 3px 9px; border-radius: 6px;
      white-space: nowrap; background: var(--cream-2); color: var(--ink-2);
    }
    .alert-duechip.due-overdue { background: var(--red-50); color: var(--red); }
    .alert-duechip.due-soon { background: var(--teal-50); color: var(--teal-700); }
    .alert-act-btn {
      padding: 6px 13px; border-radius: 7px; border: 0; font-size: 12px; font-weight: 600;
      background: var(--teal-600); color: #fff; white-space: nowrap;
    }
    .alert-act-btn:hover { background: var(--teal-700); }
    .alert-act-btn.ghost { background: transparent; color: var(--ink-3); border: 1px solid var(--line-2); }
    .alert-act-btn.ghost:hover { background: var(--cream-2); color: var(--ink); }

    .alert-composer {
      display: grid; grid-template-columns: 150px 1fr 150px; gap: 10px;
      align-items: start; padding: 14px; margin: 4px 0 6px; border-radius: 9px;
      background: var(--cream); border: 1px solid var(--line);
    }
    .alert-composer .ac-row2 { grid-column: 1 / -1; display: flex; gap: 10px; align-items: center; }
    .alert-composer label { font-size: 11px; color: var(--ink-2); display: block; margin-bottom: 4px; font-weight: 600; }
    .alert-composer input, .alert-composer select, .alert-composer textarea {
      width: 100%; font: inherit; font-size: 13px; padding: 8px 10px;
      border: 1px solid var(--line-2); border-radius: 7px; background: var(--surface); color: var(--ink);
    }
    .alert-composer textarea { resize: vertical; min-height: 38px; }
    .alerts-allclear { padding: 30px 14px; text-align: center; }

    /* ---------- Interest accounting (extensions · receipts · distributions) ---------- */
    .acc-wrap { margin-top: 4px; }
    .acc-block { margin-bottom: 22px; }
    .acc-kpis .svc-kpi .big-num { font-size: 22px; }
    .acc-warn { margin-top: 12px; padding: 11px 14px; border-radius: 9px; font-size: 12.5px; line-height: 1.55;
      color: var(--red); background: var(--red-50); border: 1px solid rgba(199,58,58,.28); }
    .acc-extlist { display: flex; flex-direction: column; gap: 10px; }
    .acc-ext { border: 1px solid var(--line); border-radius: 11px; padding: 13px 15px; background: var(--surface); }
    .acc-ext-active { border-color: var(--teal-600); box-shadow: inset 3px 0 0 var(--teal-600); }
    .acc-ext-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
    .acc-ext-title { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 13.5px; }
    .acc-ext-total { font-size: 16px; font-weight: 600; white-space: nowrap; }
    .acc-ext-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px 18px; margin-top: 12px; }
    .acc-ext-grid > div { display: flex; flex-direction: column; gap: 2px; font-size: 13px; }
    .acc-ext-note { margin-top: 10px; }
    .acc-ext-actions { display: flex; align-items: center; gap: 14px; margin-top: 12px; flex-wrap: wrap; }
    .acc-danger { color: var(--red); }
    .acc-form { margin-top: 12px; padding: 14px 16px; border: 1px solid var(--line); border-radius: 11px; background: var(--cream-2); }
    .acc-form-row, .acc-form-inline { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end; }
    .acc-field { display: flex; flex-direction: column; gap: 4px; min-width: 120px; }
    .acc-field-grow { flex: 1 1 180px; }
    .acc-field .select { width: 100%; }
    .acc-form-btns { display: flex; gap: 8px; align-items: center; margin-top: 14px; flex-wrap: wrap; }
    .acc-form-inline .acc-form-btns { margin-top: 0; }
    .acc-quote { margin-top: 14px; padding: 12px 14px; border-radius: 9px; background: var(--surface); border: 1px solid var(--line); }
    .acc-quote-head { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 8px; }
    .acc-quote-rows > div { display: flex; justify-content: space-between; gap: 16px; padding: 4px 0; font-size: 13px; }
    .acc-quote-total { border-top: 1px solid var(--line); margin-top: 4px; padding-top: 8px !important; font-weight: 600; }
    .acc-quote > .muted { margin-top: 10px; }
    .acc-rcplist { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 11px; overflow: hidden; }
    .acc-rcp + .acc-rcp { border-top: 1px solid var(--line); }
    .acc-rcp-head { display: grid; grid-template-columns: 28px 76px 1fr auto auto 28px; gap: 12px;
      align-items: center; padding: 11px 14px; background: var(--surface); }
    .acc-rcp-toggle { background: none; border: 0; cursor: pointer; padding: 0; color: var(--ink-3); }
    .acc-rcp-date { font-size: 12px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
    .acc-rcp-desc { min-width: 0; font-size: 13px; }
    .acc-rcp-amt { font-size: 14px; font-weight: 600; text-align: right; white-space: nowrap; }
    .acc-rcp-state { display: flex; align-items: center; gap: 12px; }
    .acc-recon { display: inline-flex; align-items: center; gap: 5px; cursor: pointer; }
    .acc-rcp-body { padding: 4px 14px 16px; background: var(--cream-2); border-top: 1px solid var(--line); }
    .acc-dist-empty { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 14px 0; flex-wrap: wrap; }
    .acc-dist-table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
    .acc-dist-table th { text-align: left; font-size: 10.5px; font-weight: 700; letter-spacing: .05em;
      text-transform: uppercase; color: var(--ink-3); padding: 10px 10px 8px; border-bottom: 1px solid var(--line); }
    .acc-dist-table th.num, .acc-dist-table td.num { text-align: right; font-variant-numeric: tabular-nums; }
    .acc-dist-table td { padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
    .acc-dist-table tfoot td { border-bottom: 0; border-top: 1px solid var(--line-2); font-weight: 600; }
    @media (max-width: 900px) {
      .acc-rcp-head { grid-template-columns: 28px 1fr auto; grid-template-areas: "t d a" "s s s"; row-gap: 8px; }
      .acc-rcp-toggle { grid-area: t; }
      .acc-rcp-date { display: none; }
      .acc-rcp-desc { grid-area: d; }
      .acc-rcp-amt { grid-area: a; }
      .acc-rcp-state { grid-area: s; justify-content: space-between; }
      .acc-rcp-head > .svc-led-x { display: none; }
      .acc-dist-table { min-width: 560px; }
      .acc-rcp-body { overflow-x: auto; }
    }

    /* ---------- Utilisation ring ---------- */
    .utilization { display: flex; align-items: center; gap: 22px; flex-wrap: wrap; }
    .util-stats { min-width: 160px; }
    .util-ring { position: relative; width: 140px; height: 140px; flex-shrink: 0; }
    .util-center {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      text-align: center;
    }
    .util-pct { font-family: 'Source Serif 4', Georgia, serif; font-size: 28px; font-weight: 500; line-height: 1; }
    .util-label { font-size: 11px; color: var(--ink-2); text-transform: uppercase; letter-spacing: 0.1em; margin-top: 4px; }
    .util-stats { flex: 1; }

    /* ---------- Stat rows ---------- */
    .stat-row {
      display: flex; justify-content: space-between; align-items: baseline;
      padding: 9px 0; border-bottom: 1px dashed var(--line); font-size: 13.5px;
      gap: 12px;
    }
    .stat-row:last-child { border-bottom: 0; }
    .stat-row-label { color: var(--ink-2); }
    .stat-row-value { font-family: 'JetBrains Mono', monospace; font-weight: 500; white-space: nowrap; }
    .stat-row.accent .stat-row-value { color: var(--teal-700); font-weight: 600; }
    .stat-row.faint .stat-row-value { color: var(--ink-2); }

    /* ---------- Revenue chart ---------- */
    .revenue-chart { width: 100%; }
    .chart-svg { width: 100%; height: auto; display: block; }
    .chart-legend {
      display: flex; gap: 18px; font-size: 12px; color: var(--ink-2);
      margin-bottom: 12px;
    }
    .chart-legend span { display: inline-flex; align-items: center; gap: 6px; }
    .legend-swatch { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }

    /* ---------- Investor bars (dashboard) ---------- */
    .inv-bars { display: flex; flex-direction: column; gap: 10px; }
    .inv-bar-row { display: grid; grid-template-columns: 180px 1fr 90px; align-items: center; gap: 14px; font-size: 13px; }
    .inv-bar-name { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .inv-bar-name > div { min-width: 0; }
    .inv-bar-name > div > div:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .inv-bar-track { height: 10px; background: var(--cream-2); border-radius: 5px; overflow: hidden; }
    .inv-bar-fill { height: 100%; border-radius: 5px; }
    .inv-bar-val { font-family: 'JetBrains Mono', monospace; font-weight: 500; text-align: right; font-size: 13px; }

    /* ---------- Pipeline cards ---------- */
    .pipeline-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .pipeline-card {
      border: 1px solid var(--line); border-radius: 10px; padding: 14px;
      cursor: pointer; transition: all .12s; background: var(--cream);
    }
    .pipeline-card:hover { border-color: var(--teal-600); transform: translateY(-1px); }
    .pipeline-card-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .pipeline-borrower { font-weight: 500; margin-bottom: 12px; font-size: 13.5px; }
    .pipeline-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; font-size: 12.5px; }
    .pipeline-stats > div { line-height: 1.3; }

    /* ---------- Callout ---------- */
    .callout {
      margin-top: 14px; padding: 10px 12px; background: var(--cream);
      border-left: 3px solid var(--teal-600); border-radius: 4px;
      font-size: 12.5px; color: var(--ink-2);
      display: flex; align-items: center; gap: 8px;
    }
    .callout-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--navy-900); }
    .callout strong { color: var(--ink); }

    /* ---------- Toolbar ---------- */
    .toolbar {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 0;
    }
    .toolbar-spacer { flex: 1; }
    .search-box {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
      width: 320px; color: var(--ink-2);
    }
    .search-box input {
      border: 0; outline: 0; flex: 1; font: inherit; background: transparent; color: var(--ink);
    }
    .search-box input::placeholder { color: var(--ink-2); }

    .pills { display: flex; gap: 4px; padding: 3px; background: var(--cream-2); border-radius: 8px; }
    .pill {
      padding: 6px 12px; background: transparent; border: 0; border-radius: 6px;
      font-size: 13px; color: var(--ink-2); font-weight: 500;
      display: inline-flex; align-items: center; gap: 6px;
    }
    .pill:hover { color: var(--ink); }
    .pill-on { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.05); }
    .pill-count {
      font-size: 11px; padding: 0 6px; border-radius: 8px;
      background: var(--cream-3); color: var(--ink-2); font-variant-numeric: tabular-nums;
    }
    .pill-on .pill-count { background: var(--teal-50); color: var(--teal-700); }

    .select {
      padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px;
      background: var(--surface); font: inherit; color: var(--ink); cursor: pointer;
    }

    /* ---------- Data table ---------- */
    .table-wrap { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: auto; }
    .data-table { width: 100%; border-collapse: collapse; }
    .data-table th {
      text-align: left; padding: 10px 14px;
      font-size: 11px; font-weight: 600; color: var(--ink-2);
      text-transform: uppercase; letter-spacing: 0.06em;
      border-bottom: 1px solid var(--line); background: var(--cream);
      position: sticky; top: 0;
    }
    .data-table td {
      padding: 12px 14px; border-bottom: 1px solid var(--line);
      vertical-align: middle; font-size: 13px;
    }
    .data-table tr:last-child td { border-bottom: 0; }
    .data-table tr.row-new td {
      background: var(--teal-50);
      animation: rowflash 4.5s ease-out;
    }
    @keyframes rowflash {
      0%, 50% { background: var(--gold-100); }
      100% { background: transparent; }
    }
    .data-table tr.clickable { cursor: pointer; }
    .data-table tr.clickable:hover td { background: var(--cream); }
    /* Long single-line cells (emails) truncate so the table never grows
       wider than its container and clips the trailing column off-screen. */
    .cell-ellipsis { display: block; max-width: 220px; overflow: hidden;
                     text-overflow: ellipsis; white-space: nowrap; }
    /* Pin the trailing column to the right edge so on narrow widths it
       stays fully visible instead of getting half-clipped off-screen
       (which made the Allocs chips look like broken buttons). */
    .table-stick-last th.stick-last, .table-stick-last td.stick-last {
      position: sticky; right: 0; z-index: 2;
      background: var(--surface);
      box-shadow: -8px 0 8px -8px rgba(0,0,0,.16);
    }
    .table-stick-last thead th.stick-last { z-index: 3; background: var(--cream-2); }
    .data-table tr.clickable:hover td.stick-last { background: var(--cream); }
    [data-theme="dark"] .table-stick-last th.stick-last,
    [data-theme="dark"] .table-stick-last td.stick-last { background: var(--surface); }
    [data-theme="dark"] .table-stick-last thead th.stick-last { background: var(--cream-2); }
    .table-dense .data-table td { padding: 9px 14px; }
    .cell-stack { line-height: 1.3; }
    .cell-row { display: flex; align-items: center; gap: 10px; }
    .empty-row { text-align: center; padding: 40px; color: var(--ink-2); font-style: italic; }
    .num-h { text-align: right; }

    /* ---------- Aggregation row ---------- */
    .agg-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
    .agg-card {
      background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 16px;
    }
    .agg-label { font-size: 11px; color: var(--ink-2); text-transform: uppercase; letter-spacing: 0.06em; }
    .agg-val { font-family: 'Source Serif 4', Georgia, serif; font-size: 22px; font-weight: 500; margin-top: 2px; }

    /* ---------- Avatar ---------- */
    .avatar {
      display: inline-flex; align-items: center; justify-content: center;
      border-radius: 50%; color: white; font-weight: 600; flex-shrink: 0;
    }

    /* ---------- Investor view extras ---------- */
    .deploy-cell { display: flex; flex-direction: column; gap: 4px; align-items: flex-end; }
    .mini-progress {
      width: 80px; height: 4px; background: var(--cream-2); border-radius: 2px; overflow: hidden;
    }
    .mini-progress > div { height: 100%; background: var(--teal-600); }

    /* ---------- Drawer ---------- */
    .drawer-backdrop {
      position: fixed; inset: 0; background: rgba(21, 41, 58, 0.45); z-index: 100;
      display: flex; justify-content: flex-end; animation: fade .15s;
    }
    @keyframes fade { from { opacity: 0; } }
    .drawer {
      background: var(--surface); height: 100vh; overflow: auto;
      box-shadow: -10px 0 40px rgba(0,0,0,.15);
      animation: slide .2s cubic-bezier(.2,.7,.3,1);
    }
    @keyframes slide { from { transform: translateX(40px); opacity: 0; } }
    .drawer-head {
      display: flex; justify-content: space-between; align-items: center;
      padding: 20px 24px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--surface); z-index: 1;
    }
    .drawer-title { font-size: 16px; font-weight: 600; }
    .drawer-header-rich { display: flex; align-items: center; gap: 10px; }
    .drawer-body { padding: 24px; }

    .loan-detail-head { margin-bottom: 18px; }
    .loan-detail-head h2 { font-family: 'Source Serif 4', Georgia, serif; font-size: 22px; margin-bottom: 4px; }
    .loan-detail-kpis {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px;
      background: var(--cream); padding: 18px; border-radius: 10px; margin-bottom: 18px;
    }
    .big-num { font-family: 'Source Serif 4', Georgia, serif; font-size: 22px; font-weight: 500; margin-top: 2px; }

    .loan-detail-rates {
      display: flex; align-items: center; gap: 14px; margin-bottom: 18px;
      padding: 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
    }
    .rate-block { flex: 1; }
    .rate-margin { border-left: 1px solid var(--line); padding-left: 14px; }
    .rate-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-2); }
    .rate-val { font-family: 'JetBrains Mono', monospace; font-size: 20px; font-weight: 600; margin-top: 4px; }
    .rate-arrow { color: var(--ink-2); font-size: 18px; }

    .loan-detail-dates {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 18px;
    }
    .date-block { font-size: 13px; }

    /* ---------- Live-loan servicing (interest, balance, drawdowns) ---------- */
    .svc-block { margin-bottom: 4px; }
    .svc-kpis {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px;
      background: var(--cream); padding: 18px; border-radius: 10px; margin-bottom: 12px;
    }
    [data-theme="dark"] .svc-kpis { background: var(--cream-2); }
    .svc-kpi .big-num { font-size: 21px; }
    .svc-meta {
      display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 18px;
      font-size: 12.5px; color: var(--ink-2); margin-bottom: 6px;
    }
    .svc-meta strong { color: var(--ink); }
    .svc-meta-type { margin-left: auto; font-style: italic; }
    .svc-ledger { border: 1px solid var(--line); border-radius: 8px; overflow: hidden; margin-bottom: 12px; }
    .svc-led-row {
      display: grid; grid-template-columns: 96px 1fr auto 26px; align-items: center; gap: 12px;
      padding: 10px 14px; border-bottom: 1px solid var(--line); font-size: 13.5px;
    }
    .svc-led-row:last-child { border-bottom: 0; }
    .svc-led-facility { background: var(--cream); }
    [data-theme="dark"] .svc-led-facility { background: var(--cream-2); }
    .svc-led-date { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--ink-2); }
    .svc-led-amt { font-family: 'JetBrains Mono', monospace; text-align: right; white-space: nowrap; color: var(--ink); }
    .svc-led-x {
      border: 0; background: transparent; color: var(--ink-2); cursor: pointer;
      font-size: 12px; padding: 4px; border-radius: 5px; line-height: 1;
    }
    .svc-led-x:hover { background: var(--red-50, #fbeaea); color: var(--red, #c0392b); }
    .svc-dd-form {
      border: 1.5px dashed var(--line-2); border-radius: 10px; background: var(--cream);
      padding: 14px; margin-bottom: 12px; display: flex; flex-direction: column; gap: 12px;
    }
    [data-theme="dark"] .svc-dd-form { background: var(--cream-2); }
    .svc-dd-fields { display: flex; flex-wrap: wrap; gap: 12px; }
    .svc-dd-field { display: flex; flex-direction: column; gap: 4px; }
    .svc-dd-field-grow { flex: 1; min-width: 170px; }
    .svc-dd-input { width: 100%; }
    .svc-dd-actions { display: flex; gap: 8px; }
    .svc-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 2px; }
    .accrued-num { color: var(--teal-600); }

    /* Monthly interest periods schedule */
    .svc-sched { border: 1px solid var(--line); border-radius: 8px; overflow: hidden; margin-bottom: 10px; }
    .svc-sched-row {
      display: grid; grid-template-columns: 52px 1fr 110px 130px 70px; align-items: center; gap: 10px;
      padding: 9px 14px; border-bottom: 1px solid var(--line); font-size: 13px;
    }
    .svc-sched-row:last-child { border-bottom: 0; }
    .svc-sched-hd { background: var(--cream); font-size: 10.5px; letter-spacing: 0.05em; text-transform: uppercase;
                    color: var(--ink-2); font-weight: 700; }
    [data-theme="dark"] .svc-sched-hd { background: var(--cream-2); }
    .svc-sched-ix { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--ink-2); }
    .svc-sched-dt { font-size: 12.5px; }
    .svc-sched-amt { font-family: 'JetBrains Mono', monospace; text-align: right; white-space: nowrap; }
    .svc-st-applied { background: color-mix(in srgb, var(--green-50) 55%, transparent); }
    .svc-st-due .svc-sched-amt { color: var(--ink); font-weight: 600; }
    .svc-st-upcoming { color: var(--ink-2); }
    .svc-pill { display: inline-block; padding: 2px 9px; border-radius: 20px; font-size: 11px; font-weight: 600; white-space: nowrap; }
    .svc-pill-applied { background: var(--green-50); color: var(--green); }
    .svc-pill-due { background: var(--amber-50, #fdf0d9); color: var(--amber, #b9770e); }
    .svc-pill-current { background: var(--teal-50); color: var(--teal-600); }
    .svc-pill-upcoming { background: var(--cream-2); color: var(--ink-2); }
    .svc-sched-act { text-align: right; }
    .svc-apply-btn {
      border: 1px solid var(--teal-600); background: var(--teal-600); color: #fff;
      font-size: 12px; font-weight: 600; padding: 4px 12px; border-radius: 6px; cursor: pointer;
    }
    .svc-apply-btn:hover { filter: brightness(1.06); }
    .svc-apply-all { margin-bottom: 12px; }

    .section-head {
      font-family: 'Source Serif 4', Georgia, serif; font-size: 15px; font-weight: 500;
      padding: 16px 0 8px; border-bottom: 1px solid var(--line); margin-bottom: 12px;
      display: flex; justify-content: space-between; align-items: baseline;
    }
    .section-meta { font-family: 'Inter', sans-serif; font-size: 12px; color: var(--ink-2); font-weight: 400; }

    .fee-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px 18px; font-size: 13px; }
    .contact-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px 18px; font-size: 13px; }

    /* Net investment requirement table */
    .nir-table { width: 100%; border-collapse: collapse; font-size: 13.5px; margin-bottom: 4px;
      border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
    .nir-table td { padding: 11px 14px; border-bottom: 1px solid var(--line); }
    .nir-table tr:nth-child(even) td { background: var(--cream); }
    .nir-label { color: var(--ink); }
    .nir-amt { text-align: right; font-family: 'JetBrains Mono', monospace; color: var(--ink); white-space: nowrap; }
    .nir-total td { background: var(--teal-600) !important; color: #fff; border-bottom: 0;
      font-weight: 600; }
    .nir-total .nir-amt { color: #fff; }

    /* DIP-on-file row in the loan drawer */
    .dip-file { display: flex; align-items: center; justify-content: space-between; gap: 14px;
      padding: 14px 16px; border: 1px solid var(--line); border-radius: 8px; background: var(--cream); }
    .dip-file-ref { font-family: 'JetBrains Mono', monospace; font-weight: 600; color: var(--teal-700); font-size: 14px; }
    .dip-file-actions { display: flex; gap: 8px; flex-shrink: 0; }

    /* DIP viewer modal */
    .dip-modal-shell { background: var(--cream); width: min(900px, 96vw); height: min(92vh, 900px);
      border-radius: 14px; overflow: hidden; display: flex; flex-direction: column;
      box-shadow: 0 24px 80px rgba(0,0,0,.4); border: 1px solid var(--line-2);
      animation: wzpop .2s cubic-bezier(.2,.7,.3,1); }
    .dip-modal-head { display: flex; align-items: center; justify-content: space-between;
      padding: 14px 20px; background: var(--surface); border-bottom: 1px solid var(--line); }
    .dip-modal-title { font-family: 'Source Serif 4', serif; font-size: 17px; font-weight: 500; color: var(--ink);
      display: flex; align-items: center; gap: 12px; }
    .dip-recon { font-size: 10.5px; font-style: italic; color: var(--ink-2); }
    .dip-modal-actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
    .dip-modal-body { flex: 1; overflow-y: auto; padding: 26px 24px 36px; }

    .alloc-list { display: flex; flex-direction: column; gap: 6px; }
    .alloc-row {
      display: grid; grid-template-columns: auto 1fr auto 80px auto; gap: 12px;
      align-items: center; padding: 10px 12px; border-radius: 8px;
      background: var(--cream); cursor: pointer;
    }
    .alloc-row:hover { background: var(--cream-2); }
    .alloc-name { font-size: 13px; }
    .alloc-amount { text-align: right; font-size: 13px; }
    .alloc-bar { width: 80px; height: 6px; background: var(--cream-3); border-radius: 3px; overflow: hidden; }
    .alloc-bar-fill { height: 100%; border-radius: 3px; }
    .alloc-pct { text-align: right; min-width: 36px; }
    .alloc-list-2 .alloc-row { grid-template-columns: 1.6fr 1fr 1fr auto; }
    .alloc-row-loan { background: var(--surface); border: 1px solid var(--line); }
    .alloc-row-loan:hover { border-color: var(--teal-600); background: var(--cream); }

    /* Remove-allocation controls (pre-completion only) */
    .alloc-row-removable { grid-template-columns: auto 1fr auto 80px auto auto; }
    .alloc-row-x {
      width: 26px; height: 26px; border-radius: 7px; border: 1px solid var(--line);
      background: var(--surface); color: var(--ink-3); font-size: 12px; line-height: 1;
      cursor: pointer; display: inline-flex; align-items: center; justify-content: center;
      transition: all .12s; flex-shrink: 0;
    }
    .alloc-row-x:hover { border-color: var(--red); color: var(--red); background: var(--red-50); }
    .alloc-remove-btn {
      font: inherit; font-size: 12px; font-weight: 500; cursor: pointer;
      padding: 4px 11px; border-radius: 7px; border: 1px solid var(--line-2);
      background: var(--surface); color: var(--ink-2); transition: all .12s; white-space: nowrap;
    }
    .alloc-remove-btn:hover { border-color: var(--red); color: var(--red); background: var(--red-50); }
    .alloc-remove-lock { font-size: 11px; color: var(--ink-3); letter-spacing: .02em; }

    /* Confirm dialog */
    .cf-backdrop {
      position: fixed; inset: 0; z-index: 260; background: rgba(21, 41, 58, 0.5);
      backdrop-filter: blur(2px); display: flex; align-items: center; justify-content: center;
      padding: 24px; animation: fade .15s;
    }
    .cf-modal {
      width: min(420px, 94vw); background: var(--surface); border: 1px solid var(--line-2);
      border-radius: 14px; padding: 22px 22px 18px; box-shadow: 0 24px 70px rgba(0,0,0,.34);
      animation: wzpop .2s cubic-bezier(.2,.7,.3,1);
    }
    .cf-title { font-family: 'Source Serif 4', Georgia, serif; font-size: 18px; font-weight: 500; color: var(--ink); }
    .cf-msg { font-size: 13.5px; color: var(--ink); margin-top: 10px; line-height: 1.5; }
    .cf-detail { font-size: 12px; color: var(--ink-2); margin-top: 10px; line-height: 1.55;
      background: var(--cream); border-radius: 8px; padding: 10px 12px; }
    .cf-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }
    .cf-btn { font: inherit; font-size: 13px; font-weight: 500; padding: 9px 16px; border-radius: 8px;
      border: 1px solid transparent; cursor: pointer; transition: all .12s; }
    .cf-btn-ghost { background: var(--surface); color: var(--ink); border-color: var(--line); }
    .cf-btn-ghost:hover { background: var(--cream-2); }
    .cf-btn-primary { background: var(--teal-600); color: #fff; }
    .cf-btn-primary:hover { background: var(--teal-700); }
    .cf-btn-danger { background: var(--red); color: #fff; }
    .cf-btn-danger:hover { filter: brightness(.94); }

    /* Add-allocation modal */
    .cf-modal-wide { width: min(540px, 95vw); }
    .aa-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 14px; margin-top: 16px; }
    .aa-field { display: flex; flex-direction: column; gap: 5px; }
    .aa-field.full { grid-column: 1 / -1; }
    .aa-label { font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--ink-3); }
    .aa-target {
      margin-top: 16px; padding: 13px 15px; border-radius: 10px;
      background: var(--cream); border: 1px solid var(--line);
    }
    .aa-target-head { display: flex; justify-content: space-between; align-items: baseline; font-size: 12px; color: var(--ink-2); }
    .aa-target-head .num { font-family: 'JetBrains Mono', monospace; }
    .aa-bar { height: 8px; border-radius: 5px; background: var(--line); overflow: hidden; margin: 9px 0 7px; display: flex; }
    .aa-bar-fill { background: var(--teal-600); transition: width .2s; }
    .aa-bar-fill.add { background: #E0A23C; }
    .aa-bar-fill.over { background: var(--red); }
    .aa-foot { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--ink-3); }
    .aa-foot .warn { color: var(--red); font-weight: 600; }
    .aa-derived { display: flex; gap: 18px; margin-top: 14px; flex-wrap: wrap; }
    .aa-derived .d { display: flex; flex-direction: column; gap: 2px; }
    .aa-derived .d-l { font-size: 10.5px; letter-spacing: .04em; text-transform: uppercase; color: var(--ink-3); }
    .aa-derived .d-v { font-size: 14px; font-weight: 600; font-family: 'JetBrains Mono', monospace; color: var(--ink); }

    .notes-box {
      padding: 12px 14px; background: var(--cream); border-radius: 8px;
      font-size: 13px; color: var(--ink-2); white-space: pre-wrap;
    }

    .drawer-actions {
      display: flex; gap: 8px; margin-top: 24px; padding-top: 18px;
      border-top: 1px solid var(--line); justify-content: flex-end;
    }
    .internal-banner {
      background: var(--navy-900); color: white; padding: 8px 12px; border-radius: 6px;
      font-size: 12px; margin-bottom: 14px; letter-spacing: 0.02em;
    }

    /* ---------- Maturity timeline ---------- */
    .timeline { position: relative; padding: 24px 0 6px; }
    .timeline-axis { position: relative; height: 28px; margin: 0 8px 8px;
                     border-bottom: 1px solid var(--line-2); }
    .timeline-tick { position: absolute; top: 0; transform: translateX(-50%); }
    .tick-mark { width: 1px; height: 6px; background: var(--line-2); margin: 0 auto; }
    .tick-label { font-size: 10px; color: var(--ink-2); margin-top: 2px; text-align: center; }
    .timeline-today { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--gold-500); z-index: 2; }
    .timeline-today .today-label {
      position: absolute; top: -16px; left: 50%; transform: translateX(-50%);
      font-size: 10px; padding: 2px 6px; background: var(--gold-500); color: var(--navy-900);
      font-weight: 600; border-radius: 3px; white-space: nowrap;
    }
    .timeline-loans { display: flex; flex-direction: column; gap: 6px; }
    .timeline-row {
      display: grid; grid-template-columns: 220px 1fr 110px; gap: 12px;
      align-items: center; padding: 6px 8px; border-radius: 6px; cursor: pointer;
      position: relative;
    }
    .timeline-row:hover { background: var(--cream); }
    .timeline-row-label { display: flex; flex-direction: column; line-height: 1.2; }
    .timeline-row-label .loan-id { font-size: 12px; }
    .timeline-bar {
      position: relative; height: 8px; border-radius: 4px; min-width: 4px;
      margin-left: 0;
    }
    .timeline-bar { grid-column: 2 / 3; }
    .bar-pin {
      position: absolute; right: -4px; top: -2px; width: 12px; height: 12px;
      border-radius: 50%; border: 2px solid white;
    }
    .timeline-row-meta { text-align: right; }

    /* ---------- Monthly summary ---------- */
    .monthly-table th { background: var(--cream); }
    .monthly-table td { font-size: 12.5px; }
    .row-empty td { color: #C0B89E; }
    .row-empty td.num { color: #C0B89E; }
    .row-total td {
      background: var(--cream-2); font-family: 'JetBrains Mono', monospace;
      border-top: 2px solid var(--navy-900); border-bottom: 0;
    }
    .row-total td:first-child { font-family: 'Inter', sans-serif; letter-spacing: 0.06em; font-size: 11px; }
    .row-bar { height: 6px; background: var(--cream-2); border-radius: 3px; overflow: hidden; width: 80px; }
    .row-bar-fill { height: 100%; border-radius: 3px; }
    .dense-table td { padding: 8px 14px; }

    /* ---------- Fund overview ---------- */
    .overview-grid {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px;
    }
    .overview-grid .span-2 { grid-column: span 2; }
    .overview-grid .span-3 { grid-column: span 3; }
    .default-grid {
      display: grid; grid-template-columns: repeat(3, 1fr) 1.2fr; gap: 18px;
    }
    .default-val { font-family: 'Source Serif 4', Georgia, serif; font-size: 22px; font-weight: 500; margin-top: 4px; }
    .default-memo { border-left: 2px solid var(--teal-600); padding-left: 14px; }

    .waterfall { display: flex; flex-direction: column; gap: 8px; }
    .wf-row {
      display: grid; grid-template-columns: 240px 1fr 140px; gap: 14px;
      align-items: center; font-size: 13px;
    }
    .wf-label { color: var(--ink-2); }
    .wf-bar-wrap { background: var(--cream-2); height: 14px; border-radius: 3px; overflow: hidden; }
    .wf-bar { height: 100%; border-radius: 3px; transition: width .3s; }
    .wf-val { text-align: right; font-family: 'JetBrains Mono', monospace; font-weight: 500; }
    .wf-sub .wf-label { font-style: italic; }
    .wf-total { padding-top: 10px; border-top: 2px solid var(--navy-900); margin-top: 4px; }
    .wf-total .wf-label, .wf-total .wf-val { font-weight: 600; color: var(--navy-900); }
    .wf-total .wf-val { font-size: 15px; }

    /* ---------- Empty state ---------- */
    .empty-state { text-align: center; padding: 28px 14px; color: var(--ink-2); font-size: 13px; }
    .empty-state-icon {
      width: 38px; height: 38px; margin: 0 auto 10px; border-radius: 50%;
      background: var(--green-50); color: var(--green); font-size: 18px;
      display: flex; align-items: center; justify-content: center;
    }

    /* ---------- Responsive baseline (keep usable) ---------- */
    @media (max-width: 1280px) {
      .dash-grid { grid-template-columns: repeat(2, 1fr); }
      .dash-grid .span-3 { grid-column: span 2; }
      .pipeline-grid { grid-template-columns: repeat(2, 1fr); }
    }

    /* ═══════════ Mobile / phone layer (iOS + Android) ═══════════ */
    :root {
      --m-safe-top: env(safe-area-inset-top, 0px);
      --m-safe-bottom: env(safe-area-inset-bottom, 0px);
      --m-tabbar-h: 58px;
    }
    .m-only { display: none; }
    .m-tabbar, .m-sidebar-scrim { display: none; }

    @media (max-width: 900px) {
      .m-only { display: inline-flex; }

      /* Single-column app; sidebar lifts out as an off-canvas drawer */
      .app { display: block; }
      .sidebar {
        position: fixed; top: 0; left: 0; bottom: 0;
        width: 82vw; max-width: 318px; height: 100vh; z-index: 320;
        transform: translateX(-100%);
        transition: transform .26s cubic-bezier(.32,.72,0,1);
        padding-top: var(--m-safe-top);
      }
      .sidebar.m-open { transform: none; box-shadow: 0 0 44px rgba(0,0,0,.35); }
      .m-sidebar-scrim {
        position: fixed; inset: 0; background: rgba(0,0,0,.45);
        z-index: 310; display: block; animation: mFade .18s ease;
      }
      @keyframes mFade { from { opacity: 0; } to { opacity: 1; } }

      /* Topbar → compact app bar */
      .topdock { position: sticky; top: 0; z-index: 200; }
      .topbar { padding: var(--m-safe-top) 12px 0; gap: 8px; height: 54px; }
      .m-burger { width: 38px; height: 38px; align-items: center; justify-content: center;
                  color: var(--ink); border-radius: 8px; flex-shrink: 0; }
      .topbar-search, .asof, .user-info { display: none !important; }
      .breadcrumb > span:not(.strong) { display: none; }
      .breadcrumb { font-size: 16px; min-width: 0; overflow: hidden; }
      .breadcrumb .strong { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

      /* Content clears the bottom tab bar */
      .content { padding: 16px 14px calc(var(--m-tabbar-h) + var(--m-safe-bottom) + 28px) !important; }

      /* Dense desktop grids collapse */
      .dash-grid, .pipeline-grid, .svc-kpis, .loan-detail-kpis,
      .loan-detail-dates, .wz-doc-cols, .wz-g2, .wz-g3 {
        grid-template-columns: 1fr !important;
      }
      .dash-grid .span-2, .dash-grid .span-3 { grid-column: span 1 !important; }
      /* KPI strips & pipeline stats read better 2-up than 1-up */
      .kpi-grid-4, .pipeline-stats, .agg-row { grid-template-columns: 1fr 1fr !important; }
      /* Maturity alert rows: stack label / figures */
      .alert-row { grid-template-columns: 1fr !important; gap: 4px 0 !important; row-gap: 2px !important; }

      /* Wide registers: swipe horizontally rather than overflow the page */
      .content table { min-width: 660px; }
      .table-wrap, .reg-wrap, .card-table { overflow-x: auto; -webkit-overflow-scrolling: touch; }
      /* any container holding a table gets its own horizontal scroll */
      .content *:has(> table) { overflow-x: auto; -webkit-overflow-scrolling: touch; max-width: 100%; }

      /* Servicing schedule + ledgers stay readable */
      .svc-sched-row { grid-template-columns: 40px 1fr auto; }
      .svc-sched-row > .svc-sched-st, .svc-sched-hd > :nth-child(4) { display: none; }

      /* Toolbars / filter rows: wrap and go full-width instead of overflowing */
      .toolbar, .reg-bar, .filter-row { flex-wrap: wrap !important; gap: 10px !important; }
      .toolbar-spacer { display: none !important; }
      .toolbar > .search-box, .search-box { width: 100% !important; max-width: none !important; flex: 1 1 100% !important; }
      .toolbar > .select, .toolbar > .btn { flex: 1 1 auto; min-width: 0; }
      .select { width: 100%; max-width: 100%; }
      .pills { flex-wrap: wrap; row-gap: 4px; width: 100%; }
      .pill { white-space: nowrap; min-height: 38px; }

      /* Grid/flex children must be able to shrink below their content width */
      .content .card, .content [class*="grid"] > *, .content .card > * { min-width: 0; }

      /* Detail drawers become full-screen sheets */
      .drawer { width: 100vw !important; max-width: 100vw !important; }
      .drawer-head { padding: 14px 16px; padding-top: calc(14px + var(--m-safe-top)); }
      .drawer-body { padding: 16px 16px calc(var(--m-safe-bottom) + 32px); }
      .drawer-actions { flex-direction: column-reverse; }
      .drawer-actions .btn { width: 100%; }

      /* Investor register: allocation count lives on the profile, not the row */
      .content [data-col="activeAllocations"] { display: none !important; }

      /* Comfortable tap targets */
      .btn, .nav-item, .pill, .m-tab { min-height: 40px; }
      .link-btn { min-height: 32px; display: inline-flex; align-items: center; }

      /* Modals / wizard / statement → bottom sheets */
      .dip-modal-shell, .wz-shell {
        width: 100vw; max-width: 100vw; height: 100vh; max-height: 100vh;
        border-radius: 0; border: 0;
      }
      .dip-modal-body { padding: 16px; }
      .wz-doc { padding: 20px 16px; }
    }

    /* Bottom tab bar */
    .m-tabbar {
      position: fixed; left: 0; right: 0; bottom: 0;
      height: calc(var(--m-tabbar-h) + var(--m-safe-bottom));
      padding-bottom: var(--m-safe-bottom);
      background: var(--surface); border-top: 1px solid var(--line);
      z-index: 180; display: none; align-items: stretch;
      box-shadow: 0 -1px 12px rgba(0,0,0,.05);
    }
    @media (max-width: 900px) { .m-tabbar { display: flex; } }
    .m-tab {
      flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 3px; color: var(--ink-3); font-size: 10px; font-weight: 600; padding-top: 3px;
    }
    .m-tab svg { width: 22px; height: 22px; }
    .m-tab[aria-current="page"] { color: var(--teal-600); }


    /* ---------- Serif optical tuning ---------- */
    h1, h2, h3, h4, .kpi-value, .agg-val, .util-pct, .big-num, .default-val {
      font-feature-settings: "lnum" 0, "onum" 1;
    }
    .num, .stat-row-value, .data-table .num, .alert-row [class*="num"],
    .timeline-row .loan-id, .wf-val { font-feature-settings: "tnum" 1; }
    h1 { font-weight: 400; }
    h2 { font-weight: 400; }
    .kpi-value { font-weight: 400; }
    .agg-val, .util-pct, .big-num, .default-val { font-weight: 400; }

    /* ---------- Dark-mode contextual overrides ---------- */
    [data-theme="dark"] body { color: var(--ink); }
    [data-theme="dark"] .topbar { border-bottom-color: var(--line); }
    [data-theme="dark"] .sidebar-brand,
    [data-theme="dark"] .sidebar-foot { border-color: rgba(255,255,255,.05); }
    [data-theme="dark"] .nav-item:hover { background: rgba(255,255,255,.04); }
    [data-theme="dark"] .pill-on { background: var(--surface-2); box-shadow: 0 1px 2px rgba(0,0,0,.4); }
    [data-theme="dark"] .pills { background: var(--cream-2); }
    [data-theme="dark"] .pill-count { background: var(--cream-3); color: var(--ink-2); }
    [data-theme="dark"] .pill-on .pill-count { background: var(--teal-50); color: var(--teal-600); }
    [data-theme="dark"] .data-table th { background: var(--cream-2); color: var(--ink-2); }
    [data-theme="dark"] .data-table tr.clickable:hover td { background: var(--cream-3); }
    [data-theme="dark"] .alert-row:hover { background: var(--cream-3); }
    [data-theme="dark"] .pipeline-card { background: var(--cream-2); }
    [data-theme="dark"] .pipeline-card:hover { background: var(--cream-3); border-color: var(--teal-600); }
    [data-theme="dark"] .loan-detail-kpis { background: var(--cream-2); }
    [data-theme="dark"] .alloc-row { background: var(--cream-2); }
    [data-theme="dark"] .alloc-row:hover { background: var(--cream-3); }
    [data-theme="dark"] .alloc-row-loan { background: var(--surface); }
    [data-theme="dark"] .alloc-row-loan:hover { background: var(--cream-2); border-color: var(--teal-600); }
    [data-theme="dark"] .notes-box { background: var(--cream-2); }
    [data-theme="dark"] .callout { background: var(--cream-2); }
    [data-theme="dark"] .row-total td { background: var(--cream-2); border-top-color: var(--teal-600); }
    [data-theme="dark"] .monthly-table th { background: var(--cream-2); }
    [data-theme="dark"] .kpi-gold {
      background: linear-gradient(135deg, rgba(8,123,142,.15) 0%, var(--surface) 60%);
      border-color: var(--gold-500);
    }
    [data-theme="dark"] .kpi-gold .kpi-value { color: var(--gold-500); }
    [data-theme="dark"] .btn-ghost:hover { background: var(--cream-2); border-color: var(--line-2); }
    [data-theme="dark"] .chip { background: var(--cream-3); color: var(--ink-2); }
    [data-theme="dark"] .mat-ok { background: rgba(43,182,119,.14); color: #4FCC92; }
    [data-theme="dark"] .mat-warn { background: rgba(226,114,78,.18); color: #E2724E; }
    [data-theme="dark"] .mat-critical { background: rgba(245,150,40,.16); color: #F0A04D; }
    [data-theme="dark"] .mat-overdue { background: rgba(226,95,80,.16); color: var(--red); }
    [data-theme="dark"] .status-badge { filter: brightness(1.05); }
    [data-theme="dark"] .empty-state-icon { background: rgba(43,182,119,.16); color: #4FCC92; }
    [data-theme="dark"] .internal-banner { background: var(--cream-2); color: var(--gold-500); border: 1px solid var(--gold-500); }
    [data-theme="dark"] .mini-progress { background: var(--cream-3); }
    [data-theme="dark"] .inv-bar-track { background: var(--cream-3); }
    [data-theme="dark"] .alloc-bar { background: var(--cream-3); }
    [data-theme="dark"] .wf-bar-wrap { background: var(--cream-3); }
    [data-theme="dark"] .row-bar { background: var(--cream-3); }
    [data-theme="dark"] .loan-id, [data-theme="dark"] .loan-link { color: #B8D4E8; }
    [data-theme="dark"] .timeline-axis { border-bottom-color: var(--line-2); }
    [data-theme="dark"] .tick-mark { background: var(--line-2); }
    [data-theme="dark"] .timeline-row:hover { background: var(--cream-2); }
    [data-theme="dark"] .util-ring svg circle:first-child { stroke: var(--cream-3); }
    [data-theme="dark"] .chart-svg line { stroke: var(--cream-3) !important; }
    [data-theme="dark"] .chart-svg text { fill: var(--ink-2); }
    [data-theme="dark"] .chart-svg .revenue-line { stroke: var(--ink) !important; }
    [data-theme="dark"] .chart-svg .revenue-dot { fill: var(--ink) !important; stroke: var(--cream) !important; }
    [data-theme="dark"] .legend-swatch.revenue-swatch { background: var(--ink) !important; }

    /* ======================================================================
       New-loan wizard (full-page takeover) - prefix wz-
       ====================================================================== */
    .wz-backdrop {
      position: fixed; inset: 0; z-index: 200;
      background: rgba(21, 41, 58, 0.55); backdrop-filter: blur(3px);
      display: flex; align-items: center; justify-content: center;
      padding: 24px; animation: fade .15s;
    }
    .wz-shell {
      background: var(--cream); width: min(1100px, 96vw); height: min(92vh, 920px);
      border-radius: 14px; overflow: hidden; display: flex; flex-direction: column;
      box-shadow: 0 24px 80px rgba(0,0,0,.4); border: 1px solid var(--line-2);
      animation: wzpop .2s cubic-bezier(.2,.7,.3,1);
    }
    @keyframes wzpop { from { transform: translateY(12px) scale(.99); opacity: 0; } }

    .wz-head {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 24px; background: var(--surface); border-bottom: 1px solid var(--line);
    }
    .wz-head-title { font-family: 'Source Serif 4', serif; font-size: 19px; font-weight: 500; color: var(--ink);
                     display: flex; align-items: center; gap: 12px; }
    .wz-ref { font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 600;
              color: var(--navy-800); background: var(--cream); border: 1px solid var(--line);
              padding: 3px 10px; border-radius: 6px; }
    [data-theme="dark"] .wz-ref { color: #B8D4E8; background: var(--cream-2); }
    .wz-head-sub { font-family: 'Inter', sans-serif; font-size: 11px; letter-spacing: 0.14em;
                   text-transform: uppercase; color: var(--ink-2); font-weight: 600; }
    .wz-close { width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--line);
                background: var(--surface); color: var(--ink-2); font-size: 15px; }
    .wz-close:hover { background: var(--cream-2); color: var(--ink); }

    /* stepper */
    .wz-stepper { display: flex; gap: 0; padding: 12px 24px; background: var(--cream-2);
                  border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
    .wz-stepper::-webkit-scrollbar { display: none; }
    .wz-step { display: flex; align-items: center; gap: 8px; background: transparent; border: 0;
               padding: 4px 16px 4px 6px; color: var(--ink-2); white-space: nowrap; position: relative; }
    .wz-step:not(:last-child)::after { content: '→'; position: absolute; right: 0; color: var(--line-2); font-size: 12px; }
    .wz-step-num { width: 24px; height: 24px; border-radius: 50%; display: inline-flex;
                   align-items: center; justify-content: center; font-size: 12px; font-weight: 600;
                   background: var(--cream-3); color: var(--ink-2); font-family: 'JetBrains Mono', monospace;
                   border: 1px solid var(--line-2); flex-shrink: 0; }
    .wz-step-label { font-size: 12.5px; font-weight: 500; }
    .wz-step-cur .wz-step-num { background: var(--navy-900); color: #fff; border-color: var(--navy-900); }
    .wz-step-cur .wz-step-label { color: var(--ink); font-weight: 600; }
    .wz-step-done .wz-step-num { background: var(--teal-600); color: #fff; border-color: var(--teal-600); }
    .wz-step-done .wz-step-label { color: var(--ink); }
    .wz-step-seen .wz-step-label { color: var(--ink-2); }
    .wz-step-todo { cursor: default; opacity: 0.7; }
    .wz-step:not(.wz-step-todo):not(.wz-step-cur):hover .wz-step-label { color: var(--teal-700); }

    /* body */
    .wz-body { flex: 1; overflow-y: auto; padding: 26px 32px 40px; }
    .wz-pane { max-width: 820px; margin: 0 auto; animation: in .15s; }
    @keyframes in { from { opacity: 0; transform: translateY(4px); } }
    .wz-pane-head { margin-bottom: 18px; }
    .wz-pane-head h2 { font-family: 'Source Serif 4', serif; font-size: 22px; font-weight: 500; margin-bottom: 4px; }
    .wz-pane-head p { margin: 0; color: var(--ink-2); font-size: 13.5px; max-width: 640px; }

    .wz-group { border: 1px solid var(--line); border-radius: 10px; background: var(--surface); margin-bottom: 16px; }
    .wz-group-head { display: flex; justify-content: space-between; align-items: baseline;
                     padding: 13px 18px; border-bottom: 1px solid var(--line); background: var(--cream);
                     border-radius: 10px 10px 0 0; }
    .wz-group-head h3 { font-family: 'Source Serif 4', serif; font-size: 15px; font-weight: 500; }
    .wz-meta { font-size: 10.5px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-2); font-weight: 600; }
    .wz-group-body { padding: 18px; }

    .wz-grid { display: grid; gap: 14px 16px; }
    .wz-g2 { grid-template-columns: 1fr 1fr; }
    .wz-g3 { grid-template-columns: 1fr 1fr 1fr; }
    .wz-span2 { grid-column: span 2; }
    .wz-grid + .wz-fld, .wz-fld + .wz-grid { margin-top: 14px; }
    .wz-fld { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
    .wz-lbl { font-size: 11px; font-weight: 600; color: var(--ink-2); letter-spacing: 0.04em;
              text-transform: uppercase; display: flex; align-items: center; gap: 5px; }
    .wz-req { color: var(--red); }
    .wz-hint { font-size: 11px; color: var(--ink-2); font-style: italic; }

    .wz-input { display: block; width: 100%; font-family: 'Inter', sans-serif; font-size: 13px;
                color: var(--ink); background: var(--surface); border: 1px solid var(--line);
                border-radius: 6px; padding: 9px 11px; min-height: 38px; outline: 0;
                transition: border-color .12s, box-shadow .12s; }
    .wz-input:hover { border-color: var(--line-2); }
    .wz-input:focus { border-color: var(--teal-600); box-shadow: 0 0 0 3px rgba(14,135,135,.12); }
    .wz-input::placeholder { color: var(--ink-3); }
    select.wz-input { cursor: pointer; }
    textarea.wz-area { min-height: 64px; resize: vertical; line-height: 1.5; }
    .wz-calc { background: var(--cream); border-left: 2px solid var(--teal-600); font-weight: 500;
               font-family: 'JetBrains Mono', monospace; }
    .wz-input-err { border-color: var(--red); box-shadow: 0 0 0 3px rgba(209,69,54,.12); }
    .wz-ded { display: grid; grid-template-columns: 1fr 96px; gap: 8px; }
    .wz-subfield { display: flex; align-items: center; gap: 8px; margin-top: 9px; flex-wrap: wrap;
      animation: in .14s; }
    .wz-subfield-pre, .wz-subfield-post { font-size: 12.5px; color: var(--ink-2); }
    .wz-subfield-num { width: 72px; flex: 0 0 auto; text-align: center; }

    .wz-seg { display: inline-flex; background: var(--cream-2); border: 1px solid var(--line);
              border-radius: 8px; padding: 3px; gap: 2px; flex-wrap: wrap; }
    .wz-seg-opt { background: transparent; border: 0; border-radius: 6px; padding: 7px 13px;
                  font-size: 12.5px; font-weight: 500; color: var(--ink-2); }
    .wz-seg-opt:hover { color: var(--ink); }
    .wz-seg-opt.on { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
    [data-theme="dark"] .wz-seg-opt.on { background: var(--surface-2); }

    .wz-feerow { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; }
    .wz-unit { display: inline-flex; background: var(--cream-2); border: 1px solid var(--line); border-radius: 7px; padding: 2px; gap: 2px; }
    .wz-unit-opt { background: transparent; border: 0; border-radius: 5px; padding: 5px 9px; min-width: 30px;
                   font-size: 12px; font-weight: 600; color: var(--ink-2); font-family: 'JetBrains Mono', monospace; }
    .wz-unit-opt:hover { color: var(--ink); }
    .wz-unit-opt.on { background: var(--surface); color: var(--teal-700); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
    [data-theme="dark"] .wz-unit-opt.on { background: var(--surface-2); }

    .wz-combo { position: relative; }
    .wz-combo-menu { position: absolute; top: calc(100% + 4px); left: 0; right: 0; z-index: 20;
                     background: var(--surface); border: 1px solid var(--line-2); border-radius: 8px;
                     box-shadow: 0 12px 36px rgba(0,0,0,.16); overflow: hidden; max-height: 240px; overflow-y: auto; }
    .wz-combo-head { padding: 8px 12px; font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase;
                     color: var(--ink-2); font-weight: 600; background: var(--cream); border-bottom: 1px solid var(--line); }
    .wz-combo-opt { padding: 9px 12px; font-size: 13px; cursor: pointer; }
    .wz-combo-opt:hover { background: var(--teal-50); color: var(--teal-700); }

    .wz-checks { display: flex; flex-wrap: wrap; gap: 8px; }
    .wz-check { border: 1px solid var(--line); background: var(--surface); border-radius: 999px;
                padding: 7px 14px 7px 30px; font-size: 12.5px; color: var(--ink-2); position: relative; }
    .wz-check::before { content: ''; position: absolute; left: 11px; top: 50%; transform: translateY(-50%);
                        width: 12px; height: 12px; border-radius: 3px; border: 1.5px solid var(--line-2); }
    .wz-check.on { border-color: var(--teal-600); background: var(--teal-50); color: var(--teal-700); font-weight: 500; }
    .wz-check.on::before { background: var(--teal-600); border-color: var(--teal-600); }
    .wz-check.on::after { content: '✓'; position: absolute; left: 12.5px; top: 50%; transform: translateY(-50%);
                          color: #fff; font-size: 9px; font-weight: 700; }

    .wz-totals { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 4px; }
    .wz-totals-pinned { position: sticky; bottom: -20px; z-index: 5;
      background: linear-gradient(180deg, transparent 0, var(--cream) 18px);
      padding-top: 16px; padding-bottom: 4px; margin-top: 18px; }
    .wz-total-card { border: 1px solid var(--teal-600); border-radius: 10px; padding: 16px 18px; background: var(--surface); }
    .wz-total-dark { background: var(--teal-600); border-color: var(--teal-600); }
    .wz-total-lbl { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; font-weight: 600; color: var(--ink-2); }
    .wz-total-dark .wz-total-lbl { color: rgba(255,255,255,.85); }
    .wz-total-val { font-family: 'JetBrains Mono', monospace; font-size: 24px; font-weight: 600; color: var(--teal-700); margin: 4px 0 2px; }
    .wz-total-dark .wz-total-val { color: #fff; }
    .wz-total-hint { font-size: 11px; color: var(--ink-2); font-style: italic; }
    .wz-total-dark .wz-total-hint { color: rgba(255,255,255,.7); }
