// CredX - Loan & Investor detail drawers

function LoanDrawer({ loanId, data, onClose, openInvestor, removeAllocation, openCase, caseVer, embedded }) {
  const [dipOpen, setDipOpen] = React.useState(false);
  const [publishOpen, setPublishOpen] = React.useState(false);
  const [allocConfirm, setAllocConfirm] = React.useState(null);   // allocation pending removal
  const [stmtOpen, setStmtOpen] = React.useState(false);          // borrower statement viewer
  const [ddOpen, setDdOpen] = React.useState(false);              // capital-drawdown form
  const [ddAmount, setDdAmount] = React.useState('');
  const [ddDate, setDdDate] = React.useState(new Date().toISOString().slice(0, 10));
  const [ddNote, setDdNote] = React.useState('');
  const [, forceTick] = React.useState(0);
  React.useEffect(() => { setDipOpen(false); setPublishOpen(false); setStmtOpen(false); setDdOpen(false); }, [loanId]);
  // Re-read bridge state (posted/live) whenever it changes.
  React.useEffect(() => window.CredXBridge
    ? window.CredXBridge.subscribe(() => forceTick(t => t + 1)) : undefined, []);
  // Re-render when a servicing event (drawdown) is recorded.
  React.useEffect(() => window.CredXServicing
    ? window.CredXServicing.subscribe(() => forceTick(t => t + 1)) : undefined, []);
  if (!loanId) return null;
  const { LOANS, ALLOCATIONS, INVESTORS, ASOF_DATE } = data;
  const loan = LOANS.find(l => l.id === loanId);
  if (!loan) return null;

  const allocs = ALLOCATIONS.filter(a => a.loanId === loanId);
  const totalAllocated = allocs.reduce((s,a) => s + a.amount, 0);
  const daysToMaturity = daysFromAsOf(
    window.effectiveRedemption ? window.effectiveRedemption(loan) : loan.expectedRedemption, ASOF_DATE);
  const investorByRef = Object.fromEntries(INVESTORS.map(i => [i.ref, i]));
  // Net investment the investors must fund = net drawdown to borrower + the fees.
  const nir = [
    ['Net Loan Drawdown', loan.netLoan],
    ['Arrangement Fee', loan.credxArrFee],
    ['Broker Fee', loan.introFee],
    ['Setup Fee', loan.adminFee],
  ];
  const netInvestment = nir.reduce((s, r) => s + (r[1] || 0), 0);
  const dipDoc = buildDipDocFromLoan(loan);

  // Live-loan servicing: interest accrual + capital drawdowns + redemption figure.
  const accrual = (loan.status === 'Active' && window.computeLoanAccrual)
    ? window.computeLoanAccrual(loan, ASOF_DATE) : null;
  const schedule = (loan.status === 'Active' && window.computeInterestSchedule)
    ? window.computeInterestSchedule(loan, ASOF_DATE) : null;
  const submitDrawdown = () => {
    const amt = parseFloat(ddAmount);
    if (!amt || amt <= 0 || !ddDate) return;
    window.CredXServicing.addDrawdown(loan.id, { amount: amt, date: ddDate, note: ddNote, by: 'CredX' });
    setDdAmount(''); setDdNote(''); setDdOpen(false);
  };

  const lpHeader = (
    <div className="drawer-header-rich">
      <span className="loan-id loan-id-big">{loan.id}</span>
      <StatusBadge status={loan.status}/>
      {(loan.status === 'Active' || loan.status === 'Redeemed') && (
        <span className="status-badge" title="This facility is investor-facing and shown in the CredX Investor Portal. Its servicing data is managed here."
              style={{ background: 'var(--teal-50)', color: 'var(--teal-600)' }}>
          ↪ In Investor Portal
        </span>
      )}
      <span className="muted" style={{ marginLeft: 4 }}>{loan.borrower}</span>
    </div>
  );
  const lpBody = (
      <div className="loan-detail">
        {dipOpen && <DipModal doc={dipDoc} onClose={() => setDipOpen(false)}/>}
        {stmtOpen && accrual && <StatementModal loan={loan} accrual={accrual} schedule={schedule} allocs={allocs} onClose={() => setStmtOpen(false)}/>}
        {allocConfirm && (
          <ConfirmModal
            title="Remove allocation"
            danger
            confirmLabel="Remove allocation"
            message={`Pull ${investorByRef[allocConfirm.investorRef]?.name || allocConfirm.investorRef}'s ${fmtGBP(allocConfirm.amount)} allocation from ${loan.id}?`}
            detail={`${loan.id} is pre-completion (${loan.status}). This frees the investor's commitment; it can be re-added before the loan draws down.`}
            onCancel={() => setAllocConfirm(null)}
            onConfirm={() => { removeAllocation(allocConfirm); setAllocConfirm(null); }}/>
        )}
        <div className="loan-detail-head">
          <h2>{loan.borrower}</h2>
          <div className="muted">{loan.interestType} interest · {loan.termMonths} months</div>
        </div>

        <div className="loan-detail-kpis">
          <div>
            <div className="muted small">Gross loan</div>
            <div className="big-num">{fmtGBP(loan.grossLoan)}</div>
          </div>
          <div>
            <div className="muted small">Net loan</div>
            <div className="big-num">{fmtGBP(loan.netLoan)}</div>
          </div>
          <div>
            <div className="muted small">CredX earnings</div>
            <div className="big-num accent">{fmtGBP(loan.totalCredxEarnings)}</div>
          </div>
        </div>

        <div className="loan-detail-rates">
          <div className="rate-block">
            <div className="rate-label">Borrower</div>
            <div className="rate-val">{fmtPct(loan.borrowerRate, 1)}</div>
          </div>
          <div className="rate-arrow">→</div>
          <div className="rate-block">
            <div className="rate-label">Investor</div>
            <div className="rate-val muted">{fmtPct(loan.investorRate, 1)}</div>
          </div>
          <div className="rate-arrow">=</div>
          <div className="rate-block rate-margin">
            <div className="rate-label">CredX margin</div>
            <div className="rate-val accent">{fmtPct(loan.credxMargin, 1)}</div>
          </div>
        </div>

        <div className="loan-detail-dates">
          <div className="date-block">
            <div className="muted small">Completion</div>
            <div>{fmtDate(loan.completion)}</div>
          </div>
          <div className="date-block">
            <div className="muted small">Expected redemption</div>
            {(() => {
              const eff = window.effectiveRedemption ? window.effectiveRedemption(loan) : loan.expectedRedemption;
              const extended = eff && eff !== loan.expectedRedemption;
              return (
                <>
                  <div>{fmtDate(eff)}</div>
                  {extended && <div className="muted small">extended from {fmtDate(loan.expectedRedemption)}</div>}
                </>
              );
            })()}
            {loan.status === 'Active' && <MaturityChip days={daysToMaturity}/>}
          </div>
          <div className="date-block">
            <div className="muted small">Funding requirement</div>
            <div>{fmtGBP(loan.fundingRequirement)}</div>
          </div>
        </div>

        {accrual && (
          <div className="svc-block">
            <div className="section-head">Interest &amp; balance
              <span className="section-meta">Live · accruing daily</span></div>
            <div className="svc-kpis">
              <div className="svc-kpi">
                <div className="muted small">Principal outstanding</div>
                <div className="big-num">{fmtGBP(accrual.principal)}</div>
                {accrual.drawdownTotal > 0 && (
                  <div className="muted small">{fmtGBP(accrual.baseGross)} facility + {fmtGBP(accrual.drawdownTotal)} drawn</div>
                )}
              </div>
              <div className="svc-kpi">
                <div className="muted small">Interest accrued to date</div>
                <div className="big-num">{fmtGBP(accrual.accruedInterest, { decimals: 2 })}</div>
                <div className="muted small">{fmtGBP(accrual.dailyInterest, { decimals: 2 })} / day · {fmtPct(accrual.rate, 1)} p.a.</div>
              </div>
              <div className="svc-kpi">
                <div className="muted small">Redemption figure today</div>
                <div className="big-num accent">{fmtGBP(accrual.redemptionFigure, { decimals: 2 })}</div>
                <div className="muted small">
                  {accrual.totalApplied > accrual.interestOutstanding
                    ? 'principal + ' + fmtGBP(accrual.totalApplied, { decimals: 0 }) + ' interest charged'
                    : accrual.retained
                      ? (accrual.interestOutstanding > 0
                          ? fmtGBP(accrual.interestOutstanding, { decimals: 0 }) + ' interest beyond retained'
                          : 'within retained interest')
                      : 'principal + accrued interest'}
                </div>
              </div>
            </div>
            <div className="svc-meta">
              <span><strong>Day {accrual.daysElapsed}</strong> since completion</span>
              {accrual.daysToRedemption != null && (
                <span>{accrual.daysToRedemption >= 0
                  ? accrual.daysToRedemption + ' days to expected redemption'
                  : Math.abs(accrual.daysToRedemption) + ' days past expected redemption'}</span>
              )}
              <span className="svc-meta-type">{accrual.retained
                ? 'Retained — interest prepaid up front'
                : 'Serviced — interest paid monthly'}</span>
            </div>

            <div className="section-head">Capital drawdowns
              <span className="section-meta">{accrual.drawdowns.length} additional · {fmtGBP(accrual.principal)} total drawn</span></div>
            <div className="svc-ledger">
              <div className="svc-led-row svc-led-facility">
                <div className="svc-led-date">{fmtDateShort(loan.completion)}</div>
                <div className="svc-led-desc">Initial facility advance</div>
                <div className="svc-led-amt num">{fmtGBP(accrual.baseGross)}</div>
                <div className="svc-led-x"/>
              </div>
              {accrual.drawdowns.map(d => (
                <div className="svc-led-row" key={d.id}>
                  <div className="svc-led-date">{fmtDateShort(d.date)}</div>
                  <div className="svc-led-desc">Capital drawdown{d.note ? <span className="muted small"> · {d.note}</span> : ''}</div>
                  <div className="svc-led-amt num">{fmtGBP(d.amount)}</div>
                  <button className="svc-led-x" title="Remove drawdown"
                          onClick={() => window.CredXServicing.removeDrawdown(loan.id, d.id)}>✕</button>
                </div>
              ))}
            </div>

            {ddOpen ? (
              <div className="svc-dd-form">
                <div className="svc-dd-fields">
                  <label className="svc-dd-field">
                    <span className="muted small">Amount</span>
                    <input className="select svc-dd-input" type="number" min="0" step="100" placeholder="£ amount"
                           value={ddAmount} onChange={e => setDdAmount(e.target.value)} autoFocus/>
                  </label>
                  <label className="svc-dd-field">
                    <span className="muted small">Date</span>
                    <input className="select svc-dd-input" type="date" value={ddDate}
                           onChange={e => setDdDate(e.target.value)}/>
                  </label>
                  <label className="svc-dd-field svc-dd-field-grow">
                    <span className="muted small">Note (optional)</span>
                    <input className="select svc-dd-input" type="text" placeholder="e.g. stage 2 release"
                           value={ddNote} onChange={e => setDdNote(e.target.value)}/>
                  </label>
                </div>
                <div className="svc-dd-actions">
                  <Btn variant="primary" onClick={submitDrawdown}>Record drawdown</Btn>
                  <Btn variant="ghost" onClick={() => setDdOpen(false)}>Cancel</Btn>
                </div>
              </div>
            ) : (
              <div className="svc-actions">
                <Btn variant="ghost" icon="+" onClick={() => setDdOpen(true)}>Add capital drawdown</Btn>
                <Btn variant="primary" icon="▤" onClick={() => setStmtOpen(true)}>Generate statement</Btn>
              </div>
            )}

            {schedule && (
              <>
                <div className="section-head">Monthly interest periods
                  <span className="section-meta">
                    {fmtGBP(schedule.totalApplied, { decimals: 0 })} applied
                    {schedule.totalDue > 0 ? ' · ' + fmtGBP(schedule.totalDue, { decimals: 0 }) + ' due' : ''}
                  </span></div>
                <div className="svc-sched">
                  <div className="svc-sched-row svc-sched-hd">
                    <div>Period</div><div>Dates</div><div className="num">Interest</div><div className="svc-sched-st">Status</div><div/>
                  </div>
                  {schedule.periods.map(p => (
                    <div className={'svc-sched-row svc-st-' + p.status} key={p.key}>
                      <div className="svc-sched-ix">#{p.index}</div>
                      <div className="svc-sched-dt">{fmtDateShort(p.start)} – {fmtDateShort(p.end)}<span className="muted small"> · {p.days}d</span></div>
                      <div className="num svc-sched-amt">{fmtGBP(p.amount, { decimals: 2 })}</div>
                      <div className="svc-sched-st">
                        <span className={'svc-pill svc-pill-' + p.status}>
                          {p.status === 'applied' ? 'Applied ' + fmtDateShort(p.applied.appliedDate)
                            : p.status === 'due' ? 'Due'
                            : p.status === 'current' ? 'Current'
                            : 'Upcoming'}
                        </span>
                      </div>
                      <div className="svc-sched-act">
                        {p.status === 'applied'
                          ? <button className="svc-led-x" title="Reverse applied interest"
                                    onClick={() => window.CredXServicing.unapplyPeriod(loan.id, p.key)}>↩</button>
                          : (p.status === 'due' || p.status === 'current')
                            ? <button className="svc-apply-btn"
                                      onClick={() => window.CredXServicing.applyPeriod(loan.id, { key: p.key, start: p.start, end: p.rawEnd, amount: p.amount, by: 'CredX' })}>Apply</button>
                            : <span/>}
                      </div>
                    </div>
                  ))}
                </div>
                {schedule.periods.some(p => p.status === 'due') && (
                  <div className="svc-apply-all">
                    <Btn variant="ghost" onClick={() => schedule.periods.filter(p => p.status === 'due')
                      .forEach(p => window.CredXServicing.applyPeriod(loan.id, { key: p.key, start: p.start, end: p.rawEnd, amount: p.amount, by: 'CredX' }))}>
                      Apply all due periods
                    </Btn>
                  </div>
                )}
              </>
            )}
          </div>
        )}

        {window.UwDrawerPanel && window.CredXCases && window.CredXCases.get(loan.id) && (
          <UwDrawerPanel loanId={loan.id} data={data} openCase={openCase} caseVer={caseVer}/>
        )}

        {window.LoanAccountingBlock && loan.status === 'Active' && (
          <LoanAccountingBlock loan={loan} allocations={allocs} investors={data.INVESTORS}/>
        )}

        <div className="section-head">Net investment requirement
          <span className="section-meta">Net loan + fees</span></div>
        <table className="nir-table">
          <tbody>
            {nir.map(([label, amt], i) => (
              <tr key={i}>
                <td className="nir-label">{label}</td>
                <td className="nir-amt">{fmtGBP(amt, { decimals: 2 })}</td>
              </tr>
            ))}
            <tr className="nir-total">
              <td className="nir-label">Total Net Investment Required</td>
              <td className="nir-amt">{fmtGBP(netInvestment, { decimals: 2 })}</td>
            </tr>
          </tbody>
        </table>

        <div className="section-head">Decision in Principle
          <span className="section-meta">{loan.dipDoc ? 'Stored on file' : 'Reconstructed from record'}</span></div>
        <div className="dip-file">
          <div className="dip-file-info">
            <div className="dip-file-ref">{dipDoc.ref}</div>
            <div className="muted small">Issued {fmtDate(dipDoc.issued)}{dipDoc.validUntil ? ' · Valid until ' + fmtDate(dipDoc.validUntil) : ''}</div>
          </div>
          <div className="dip-file-actions">
            <Btn variant="ghost" onClick={() => setDipOpen(true)}>View DIP</Btn>
            <Btn variant="primary" onClick={() => wzEmailDip(dipDoc)}>Email DIP</Btn>
          </div>
        </div>

        {loan.status === 'Funding' && (() => {
          const required = loan.fundingRequirement || loan.grossLoan;
          const pct = required > 0 ? Math.min(100, Math.round(totalAllocated / required * 100)) : 0;
          const remaining = Math.max(0, required - totalAllocated);
          const fullyFunded = remaining <= 0;
          return (
            <div style={{
              padding: '14px 16px', marginBottom: 18, borderRadius: 12,
              background: 'rgba(58,111,214,0.07)', border: '1px solid rgba(58,111,214,0.35)'
            }}>
              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', marginBottom: 10 }}>
                <strong style={{ color: '#1E478F', fontSize: 13, letterSpacing: '.02em', textTransform: 'uppercase' }}>Funding progress</strong>
                <span style={{ fontSize: 12, color: 'var(--ink-2)' }}>
                  {fullyFunded ? 'Fully committed — ready to complete' : `${fmtGBP(remaining)} still to raise`}
                </span>
              </div>
              <div style={{ height: 10, borderRadius: 6, background: 'var(--cream-3)', overflow: 'hidden' }}>
                <div style={{ width: pct + '%', height: '100%', borderRadius: 6,
                  background: fullyFunded ? '#1D9A5C' : '#3A6FD6', transition: 'width .3s' }}/>
              </div>
              <div style={{ display: 'flex', justifyContent: 'space-between', marginTop: 10 }}>
                <div><div className="muted small">Committed</div><div style={{ fontWeight: 600 }}>{fmtGBP(totalAllocated)}</div></div>
                <div style={{ textAlign: 'center' }}><div className="muted small">Funding requirement</div><div style={{ fontWeight: 600 }}>{fmtGBP(required)}</div></div>
                <div style={{ textAlign: 'right' }}><div className="muted small">Raised</div><div style={{ fontWeight: 600, color: fullyFunded ? '#1D9A5C' : '#1E478F' }}>{pct}%</div></div>
              </div>
            </div>
          );
        })()}

        {(loan.status === 'Pipeline' || loan.status === 'Funding') && (
          <PlatformListing
            loan={loan} dipDoc={dipDoc}
            postedDeal={window.CredXBridge ? window.CredXBridge.getPostedDeals().find(d => d.loanId === loan.id) : null}
            onPublish={() => setPublishOpen(true)}/>
        )}
        {publishOpen && (
          <PublishModal loan={loan} dipDoc={dipDoc} allocs={allocs}
            existing={window.CredXBridge ? window.CredXBridge.getPostedDeals().find(d => d.loanId === loan.id) : null}
            onClose={() => setPublishOpen(false)}/>
        )}

        <div className="section-head">Fees breakdown</div>
        <div className="fee-grid">
          <div><span className="muted small">Arr. fee</span><br/>{fmtPct(loan.arrFee, 1)} · {fmtGBP(loan.credxArrFee + loan.introFee)}</div>
          <div><span className="muted small">Broker fee</span><br/>{fmtPct(loan.brokerFee, 1)} · {fmtGBP(loan.introFee)}</div>
          <div><span className="muted small">CredX arr. fee</span><br/>{fmtGBP(loan.credxArrFee)}</div>
          <div><span className="muted small">Admin fee</span><br/>{fmtGBP(loan.adminFee)}</div>
          <div><span className="muted small">Pre-completion</span><br/>{fmtGBP(loan.preCompletionFees)}</div>
          <div><span className="muted small">Total fees</span><br/><strong>{fmtGBP(loan.totalFees)}</strong></div>
        </div>

        <div className="section-head">
          Investor allocations
          <span className="section-meta">{allocs.length} investors · {fmtGBP(totalAllocated)}</span>
        </div>

        {allocs.length === 0 ? (
          <div className="empty-state">No investor allocations for this loan yet.</div>
        ) : (
          <div className="alloc-list">
            {allocs.map((a,i) => {
              const inv = investorByRef[a.investorRef];
              const canRemove = loanPreCompletion(loan) && typeof removeAllocation === 'function';
              return (
                <div key={a._id != null ? a._id : i}
                     className={'alloc-row' + (canRemove ? ' alloc-row-removable' : '')}
                     onClick={() => openInvestor(a.investorRef)}>
                  <Avatar name={inv?.name || '?'} size={28}/>
                  <div className="alloc-name">
                    <div>{inv?.name || a.investorRef}</div>
                    <div className="muted small">{a.investorRef}</div>
                  </div>
                  <div className="alloc-amount num">
                    {fmtGBP(a.amount)}
                    <div className="muted small">{fmtPct(a.rate, 1)}</div>
                  </div>
                  <div className="alloc-bar">
                    <div className="alloc-bar-fill"
                         style={{ width: (a.amount / totalAllocated * 100) + '%',
                                  background: inv?.isInternal ? '#1A1A1A' : '#087B8E' }}/>
                  </div>
                  <div className="alloc-pct muted small">{Math.round(a.amount / totalAllocated * 100)}%</div>
                  {canRemove && (
                    <button className="alloc-row-x" title="Remove allocation (pre-completion)"
                            onClick={(e) => { e.stopPropagation(); setAllocConfirm(a); }}>✕</button>
                  )}
                </div>
              );
            })}
          </div>
        )}

        {loan.notes && (
          <>
            <div className="section-head">Notes</div>
            <div className="notes-box">{loan.notes}</div>
          </>
        )}

        <div className="drawer-actions">
          <Btn variant="ghost">Edit loan</Btn>
          <Btn variant="ghost">Add allocation</Btn>
          {loan.status === 'Funding' && <Btn variant="primary">Mark live</Btn>}
          {loan.status === 'Active' && <Btn variant="primary">Mark redeemed</Btn>}
        </div>
      </div>
  );

  if (embedded) {
    return <div className="record-panel"><div className="record-panel-head">{lpHeader}</div>{lpBody}</div>;
  }
  return (
    <Drawer open={true} onClose={onClose} title={lpHeader} width={680}>{lpBody}</Drawer>
  );
}

function InvestorDrawer({ investorRef, data, onClose, openLoan }) {
  if (!investorRef) return null;
  const { INVESTORS, ALLOCATIONS, LOANS, ASOF_DATE } = data;
  const inv = INVESTORS.find(i => i.ref === investorRef);
  if (!inv) return null;

  const allocs = ALLOCATIONS.filter(a => a.investorRef === investorRef);
  const loanById = Object.fromEntries(LOANS.map(l => [l.id, l]));

  const totals = allocs.reduce((acc, a) => ({
    amount: acc.amount + a.amount,
    interest: acc.interest + a.totalInterest,
    monthly: acc.monthly + a.monthlyInterest
  }), { amount: 0, interest: 0, monthly: 0 });

  return (
    <Drawer open={true} onClose={onClose}
            title={<div className="drawer-header-rich">
              <Avatar name={inv.name} size={36}/>
              <div>
                <div className="strong">{inv.name}</div>
                <div className="muted small">{inv.ref}</div>
              </div>
            </div>}
            width={680}>
      <div className="loan-detail">
        {inv.isInternal && <div className="internal-banner">Internal CredX self-funded account</div>}

        <div className="loan-detail-kpis">
          <div>
            <div className="muted small">Total invested</div>
            <div className="big-num">{fmtGBP(inv.totalInvested)}</div>
          </div>
          <div>
            <div className="muted small">Active allocations</div>
            <div className="big-num">{inv.activeAllocations}</div>
          </div>
          <div>
            <div className="muted small">Default rate</div>
            <div className="big-num accent">{fmtPct(inv.defaultRate, 1)}</div>
          </div>
        </div>

        <div className="section-head">Contact</div>
        <div className="contact-grid">
          <div><span className="muted small">Contact name</span><br/>{inv.contact}</div>
          <div><span className="muted small">Email</span><br/><a href={`mailto:${inv.email}`}>{inv.email}</a></div>
          <div><span className="muted small">Phone</span><br/>{inv.phone}</div>
          <div><span className="muted small">Onboarded</span><br/>{fmtDate(inv.onboarded)}</div>
        </div>

        <div className="section-head">
          Allocations
          <span className="section-meta">{allocs.length} · {fmtGBP(totals.amount)} · {fmtGBP(totals.monthly, { decimals: 0 })}/mo</span>
        </div>

        {allocs.length === 0 ? (
          <div className="empty-state">No allocations yet.</div>
        ) : (
          <div className="alloc-list alloc-list-2">
            {allocs.map((a,i) => {
              const loan = loanById[a.loanId];
              const dtm = daysFromAsOf(a.expectedRedemption, ASOF_DATE);
              return (
                <div key={i} className="alloc-row alloc-row-loan" onClick={() => openLoan(a.loanId)}>
                  <div>
                    <span className="loan-id">{a.loanId}</span>
                    <div className="muted small">{loan?.borrower || ''}</div>
                  </div>
                  <div className="num">
                    <strong>{fmtGBP(a.amount)}</strong>

  <script type="text/babel" data-src="view_publish.jsx">
// CredX - Publish a pipeline loan to the investor platform (Opportunities).
// A loan can only be posted once Investment thesis, Documents, Property &
// valuation and the DIP are complete. Posting writes an opportunity-shaped
// record + a "new deal" update to the shared bridge; the investor portal
// reads them on load. Marking the deal live flips it to "funding closed".

const PUB_TYPES   = ['Residential', 'Commercial', 'Business'];
const PUB_TAGS    = ['Bridging', 'Refurb', 'Capital raise', 'Development', 'Business loan'];
const PUB_DOCSET  = ['Investor Term Sheet', 'Decision in Principle', 'Valuation Report', 'Title Plan & Register'];
const PUB_CATEGORY = { Residential: 'Residential bridging', Commercial: 'Commercial bridging', Business: 'Business loan' };

function pubAddDays(iso, days) {
  const d = iso ? new Date(iso) : new Date();
  d.setDate(d.getDate() + days);
  return d.toISOString().slice(0, 10);
}

// Map the loan + DIP + publish form into the exact opportunity shape the
// investor portal's cards and detail drawer expect.
function buildOpportunityFromPublish(loan, dipDoc, pf) {
  const mv = parseFloat(pf.marketValue) || 0;
  const ltv = mv > 0 ? loan.grossLoan / mv : (dipDoc.ltv || 0);
  const rate = parseFloat(pf.coupon) || (loan.investorRate * 100);
  const bullets = (pf.bullets || []).map(b => b.trim()).filter(Boolean);
  const conditions = (pf.conditions || []).map(c => c.trim()).filter(Boolean);
  return {
    id: loan.id,
    loanId: loan.id,
    title: pf.title.trim(),
    property: pf.property.trim(),
    type: pf.type,
    category: PUB_CATEGORY[pf.type] || 'Commercial bridging',
    chargeType: pf.charge,
    typeTag: pf.typeTag,
    facility: loan.grossLoan,
    fundingRequirement: loan.fundingRequirement != null ? loan.fundingRequirement : loan.grossLoan,
    rate: rate,
    term: loan.termMonths,
    ltv: ltv,
    min: parseInt(pf.minInvest, 10) || 25000,
    raisedPct: 0,
    closes: fmtDate(pf.closeDate),
    hot: !!pf.hot,
    summary: pf.thesis.trim(),
    bullets: bullets.length ? bullets : ['Secured by first legal charge', 'Independent valuation on file', 'Documented exit strategy'],
    thesis: pf.thesis.trim(),
    requiresDealNda: !!pf.requiresDealNda,
    security: {
      tenure: pf.tenure.trim() || 'Freehold',
      description: pf.description.trim() || '-',
      tenancy: pf.tenancy.trim() || 'See valuation report',
      councilTax: pf.councilTax || '-',
      epc: pf.epc || '-',
      marketValue: mv,
      restricted180: mv,
      restricted90: Math.round(mv * 0.9),
      valuer: pf.valuer.trim() || '-',
      valuationDate: fmtDate(pf.valDate),
      valuerRef: pf.valuerRef.trim() || '-',
      monthlyRent: pf.monthlyRent ? parseFloat(pf.monthlyRent) : null,
    },
    dip: {
      reference: dipDoc.ref,
      date: fmtDate(dipDoc.issued),
      validity: (dipDoc.validDays || 14) + ' days',
      product: pf.typeTag === 'Business loan' ? 'Business Loan (Bridging)' : 'Bridging Loan',
      borrowerRate: dipDoc.ratePct || (loan.borrowerRate * 100),
      monthlyInterest: Math.round(((dipDoc.ratePct || loan.borrowerRate * 100) / 100) * loan.grossLoan / 12),
      term: loan.termMonths,
      minTerm: 3,
      grossLoan: dipDoc.grossLoan != null ? dipDoc.grossLoan : loan.grossLoan,
      netDrawdown: dipDoc.netDrawdown != null ? dipDoc.netDrawdown : loan.netLoan,
      arrangementFee: dipDoc.arrFee != null ? dipDoc.arrFee : loan.credxArrFee,
      brokerFee: dipDoc.brokerFee != null ? dipDoc.brokerFee : loan.introFee,
      setupFee: dipDoc.setupFee != null ? dipDoc.setupFee : loan.adminFee,
      retainedInterest: dipDoc.retainedInterest != null ? dipDoc.retainedInterest : loan.retainedInterest,
      applicationFee: 495,
      redemptionFee: 500,
      defaultFee: '2% above standard rate',
      earlyRepayment: 'Min. 3 months interest',
      esg: dipDoc.esg || 'Approved',
      conditions: conditions.length ? conditions : (dipDoc.nextSteps ? [dipDoc.nextSteps] : ['Subject to underwriting, full valuation and KYC.']),
    },
    documents: (pf.documents || []).slice(),
    borrower: loan.borrower,
    lifecycle: 'open',
    postedAt: new Date().toISOString(),
  };
}

// ---- small local field helpers (reuse wizard .wz-* styles) ----
function PubFld({ label, req, hint, children }) {
  return (
    <label className="wz-fld" style={{ display: 'block' }}>

}
function PubMoney({ value, onChange, placeholder }) {
  const has = value !== '' && value != null && !isNaN(parseFloat(value));
  const display = has ? '£' + Math.round(parseFloat(value)).toLocaleString('en-GB') : '';
  return (
    <input className="wz-input" inputMode="numeric" value={display} placeholder={placeholder || '£0'}
           onChange={e => { const d = e.target.value.replace(/[^0-9]/g, ''); onChange(d === '' ? '' : d); }}/>
  );
}

// ---- Readiness checklist + publish/posted controls inside the loan drawer ----
function PlatformListing({ loan, dipDoc, postedDeal, onPublish }) {
  const live = postedDeal && postedDeal.lifecycle === 'live';
  const markLive = () => {
    if (!postedDeal) return;
    window.CredXBridge.setDealLifecycle(loan.id, 'live');

      id: 'bd-live-' + loan.id, date: fmtDate(new Date().toISOString().slice(0,10)),
      timeAgo: 'just now', kind: 'Deal update', dealId: loan.id, isBridge: true,
      title: postedDeal.title + ' - now live and deployed',

      attachments: [],
    });
  };
  const unpublish = () => {
    if (confirm('Remove this deal from the investor platform? Investors will no longer see it.')) {

    }
  };

  if (postedDeal) {
    return (
      <>
        <div className="section-head">Investor platform

              <div className="strong">{postedDeal.title}</div>
              <div className="muted small">
                Posted {fmtDate((postedDeal.postedAt || '').slice(0,10))} · Min {fmtGBP(postedDeal.min)} · Closes {postedDeal.closes}
              </div>
            </div>
            <span className={'status-badge'} style={{ background: live ? '#E8F4EE' : '#E4F0F2', color: live ? '#0E6B3F' : '#066676' }}>
              <span className="status-dot" style={{ background: live ? '#1D9A5C' : '#087B8E' }}/>
              {live ? 'Now live' : 'Open'}
            </span>
          </div>
          <div className="pub-listed-actions">
            {!live && <Btn variant="primary" onClick={markLive}>Mark live (funding closed)</Btn>}
            <Btn variant="ghost" onClick={onPublish}>Edit listing</Btn>
            <Btn variant="ghost" onClick={unpublish}>Unpublish</Btn>
          </div>
        </div>
      </>
    );
  }

  return (
    <>

        <span className="section-meta">Not posted</span></div>
      <div className="pub-cta">

          <div className="strong">Post this opportunity to investors</div>
          <div className="muted small">Complete the investment thesis, documents, property &amp; valuation and DIP, then publish to the Opportunities page.</div>

      </div>
    </>

}

// ---- The publish modal ----

// Auto-fill defaults for a NEW platform listing, derived from the loan + DIP.
// Everything returned is a starting value the user can freely edit before posting.
function pubLocalityFromLine(line) {
  if (!line || line === '-') return '';
  // strip a trailing UK postcode, then take the last comma-segment (usually the town)
  const s = line.replace(/,?\s*[A-Z]{1,2}\d[A-Z\d]?\s*\d[A-Z]{2}\s*$/i, '').trim();
  const parts = s.split(',').map(p => p.trim()).filter(Boolean);
  if (!parts.length) return '';
  let town = parts[parts.length - 1];
  // if the last piece looks like a street ("12 High Street"), prefer the one before it
  if (parts.length > 1 && /\d|street|road|lane|avenue|drive|close|way|parade/i.test(town)) town = parts[parts.length - 2] || town;
  return town;
}

function derivePublishDefaults(loan, dipDoc) {
  const money0 = (n) => fmtGBP(n);
  const line = (dipDoc.propertyLine && dipDoc.propertyLine !== '-') ? dipDoc.propertyLine : '';
  const locality = pubLocalityFromLine(line);

  // Asset type -> one of PUB_TYPES
  const typeMap = { Residential: 'Residential', Commercial: 'Commercial', 'Semi-commercial': 'Commercial', Development: 'Commercial', Business: 'Business' };
  const assetType = typeMap[dipDoc.propType] || 'Commercial';
  const assetNoun = { Residential: 'residential property', Commercial: 'commercial property', Business: 'business' }[assetType];

  // Type tag inferred from the loan purpose / strategy
  const purpose = (dipDoc.purpose && dipDoc.purpose !== '-') ? dipDoc.purpose : '';
  const strategy = (dipDoc.repaymentStrategy && dipDoc.repaymentStrategy !== '-') ? dipDoc.repaymentStrategy : '';
  const hay = (purpose + ' ' + strategy).toLowerCase();
  let typeTag = 'Bridging';
  if (assetType === 'Business') typeTag = 'Business loan';
  else if (/develop/.test(hay)) typeTag = 'Development';
  else if (/refurb|renovat|conver/.test(hay)) typeTag = 'Refurb';
  else if (/raise|capital|equity release/.test(hay)) typeTag = 'Capital raise';
  const tagNoun = { Bridging: 'Bridge', Refurb: 'Refurbishment', 'Capital raise': 'Capital Raise', Development: 'Development', 'Business loan': 'Loan' }[typeTag];

  const val = (dipDoc.valuation && dipDoc.valuation > 0) ? dipDoc.valuation : null;
  const ltvPct = val ? Math.round((loan.grossLoan / val) * 100)
    : (dipDoc.ltv ? Math.round(dipDoc.ltv * 100) : null);
  const couponPct = +(loan.investorRate * 100).toFixed(2);
  const term = loan.termMonths;

  // Headline title — location-led, falls back to an asset/term descriptor.
  const assetWord = assetType === 'Residential' ? 'Residential' : assetType === 'Business' ? 'Business' : 'Commercial';
  const title = [locality, assetWord, tagNoun].filter(Boolean).join(' ');

  // Investment thesis
  let thesis = 'First charge facility secured against ' + assetNoun + (locality ? ' in ' + locality : '');
  if (ltvPct != null) thesis += ', at ' + ltvPct + '% LTV' + (val ? ' against an independent ' + money0(val) + ' valuation' : '');
  thesis += '. ' + (strategy ? 'Repayment via ' + strategy.toLowerCase() + ' over a ' + term + '-month term.' : term + '-month term.');
  if (couponPct) thesis += ' Investors earn ' + couponPct + '% p.a.';

  // Key points (up to 3)
  const bullets = [];
  bullets.push('First legal charge over ' + assetNoun + (locality ? ' in ' + locality : ''));
  if (ltvPct != null) bullets.push(ltvPct + '% LTV' + (val ? ' against ' + money0(val) + ' independent valuation' : ''));
  bullets.push(couponPct + '% p.a. to investors over a ' + term + '-month term');
  if (strategy && bullets.length < 3) bullets.push(strategy + ' exit');
  const keyPoints = bullets.slice(0, 3);
  while (keyPoints.length < 3) keyPoints.push('');

  return { title, property: line, assetType, typeTag, thesis, keyPoints,
           marketValue: val ? String(Math.round(val)) : '',
           valuer: (dipDoc.surveyor && dipDoc.surveyor !== '-') ? dipDoc.surveyor : '' };
}

function PublishModal({ loan, dipDoc, allocs, existing, onClose }) {
  const seed = existing || {};
  // Pre-computed auto-fill from the loan + DIP (used only for a brand-new listing).
  const auto = React.useMemo(() => existing ? null : derivePublishDefaults(loan, dipDoc), [existing]);
  const a = auto || {};
  const [pf, setPf] = React.useState(() => ({
    title: seed.title || a.title || '',
    property: seed.property || (dipDoc.propertyLine && dipDoc.propertyLine !== '-' ? dipDoc.propertyLine : '') || a.property || '',
    type: seed.type || a.assetType || 'Commercial',
    charge: seed.chargeType || 'First',
    typeTag: seed.typeTag || a.typeTag || 'Bridging',
    coupon: seed.rate != null ? String(seed.rate) : String((loan.investorRate * 100).toFixed(1)).replace(/\.0$/, ''),
    minInvest: seed.min != null ? String(seed.min) : '25000',
    closeDate: pubAddDays(null, 14),
    hot: seed.hot || false,
    thesis: seed.thesis || a.thesis || '',
    bullets: (seed.bullets && seed.bullets.slice(0, 3)) || a.keyPoints || ['', '', ''],
    tenure: (seed.security && seed.security.tenure) || 'Freehold',
    description: (seed.security && seed.security.description !== '-' ? seed.security.description : '') || '',
    tenancy: (seed.security && seed.security.tenancy) || '',
    councilTax: (seed.security && seed.security.councilTax) || '',
    epc: (seed.security && seed.security.epc) || '',
    marketValue: seed.security ? String(seed.security.marketValue) : (dipDoc.valuation ? String(Math.round(dipDoc.valuation)) : (a.marketValue || '')),
    valuer: (seed.security && seed.security.valuer !== '-' ? seed.security.valuer : '') || a.valuer || '',
    valuerRef: (seed.security && seed.security.valuerRef !== '-' ? seed.security.valuerRef : '') || '',
    valDate: new Date().toISOString().slice(0, 10),
    monthlyRent: (seed.security && seed.security.monthlyRent != null) ? String(seed.security.monthlyRent) : '',
    documents: seed.documents ? seed.documents.slice() : ['Investor Term Sheet', 'Decision in Principle'],
    conditions: (seed.dip && seed.dip.conditions && seed.dip.conditions.slice(0, 3)) ||
      (dipDoc.nextSteps ? [dipDoc.nextSteps, '', ''] : ['', '', '']),
    requiresDealNda: seed.requiresDealNda || false,
  }));
  const upd = (patch) => setPf(prev => ({ ...prev, ...patch }));
  const setBullet = (i, v) => setPf(prev => { const b = prev.bullets.slice(); b[i] = v; return { ...prev, bullets: b }; });
  const setCond = (i, v) => setPf(prev => { const c = prev.conditions.slice(); c[i] = v; return { ...prev, conditions: c }; });
  const toggleDoc = (d) => setPf(prev => ({ ...prev, documents: prev.documents.includes(d) ? prev.documents.filter(x => x !== d) : [...prev.documents, d] }));

  // readiness
  const r = {

    docs: pf.documents.includes('Investor Term Sheet') && pf.documents.includes('Decision in Principle'),
    property: pf.property.trim() && (parseFloat(pf.marketValue) > 0) && pf.valuer.trim(),
    dip: !!dipDoc.ref,

  const listingOk = pf.title.trim() && (parseInt(pf.minInvest, 10) > 0) && pf.closeDate;
  const canPost = r.thesis && r.docs && r.property && r.dip && listingOk;

  const doPost = () => {

                <button key={d} type="button" className={'wz-check' + (pf.documents.includes(d) ? ' on' : '')}
                        onClick={() => toggleDoc(d)}>{d}</button>
              ))}
            </div>
            <div className="dip-file" style={{ marginTop: 12 }}>
              <div className="dip-file-info">
                <div className="dip-file-ref">DIP {dipDoc.ref}</div>
                <div className="muted small">On file · attached to the listing automatically</div>
              </div>
              <span className="status-badge" style={{ background: '#E8F4EE', color: '#0E6B3F' }}>
                <span className="status-dot" style={{ background: '#1D9A5C' }}/>Ready
              </span>
            </div>
          </WzGroup>

          <WzGroup title="Conditions & comments" meta="shown under the DIP">
            {pf.conditions.map((c, i) => (
              <input key={i} className="wz-input" style={{ marginBottom: 8 }} value={c}
                     onChange={e => setCond(i, e.target.value)} placeholder={'Condition ' + (i + 1)}/>
            ))}
            <label className="pub-redact">
              <input type="checkbox" checked={pf.requiresDealNda} onChange={e => upd({ requiresDealNda: e.target.checked })}/>
              Require an additional per-deal NDA to reveal underwriting detail
            </label>
            <div className="muted small" style={{ marginTop: 8 }}>Borrower identity stays redacted behind the platform NDA by default.</div>
          </WzGroup>
        </div>

        <div className="pub-foot">
          <div className="muted small">
            {canPost ? 'Ready to publish to the Opportunities page.' : 'Complete the four required sections to publish.'}
          </div>
          <div style={{ display: 'flex', gap: 8 }}>
            <button className="wz-btn wz-btn-link" onClick={onClose}>Cancel</button>
            <button className={'wz-btn wz-btn-primary' + (canPost ? '' : ' wz-btn-disabled')}
                    onClick={doPost} disabled={!canPost}>
              {existing ? 'Update listing' : 'Post to platform →'}
            </button>
          </div>
        </div>
      </div>
    </div>
  );
}

Object.assign(window, { PlatformListing, PublishModal, buildOpportunityFromPublish });

// ─────────────────────────────────────────────────────────────────
// Investor profile extras (backend) - Documents, NDA and the
// Approvals inbox for changes the investor submitted from the portal.
// Keyed by investor ref, which for portal investors equals their
// portal accountId (e.g. CX-INV-0421), so both sides line up.
// ─────────────────────────────────────────────────────────────────
const INV_DOC_CATS = ['Certified ID', 'Proof of address', 'Bank statements', 'Source of funds', 'GoIdentity report', 'Suitability / self-cert', 'NDA', 'Other'];

function InvestorProfileExtras({ inv }) {
  const [, tick] = React.useState(0);
  const [cat, setCat] = React.useState('Certified ID');
  React.useEffect(() => window.CredXBridge ? window.CredXBridge.subscribe(() => tick(t => t + 1)) : undefined, []);
  if (!window.CredXBridge) return null;
  const ref = inv.ref;
  const today = new Date().toISOString().slice(0, 10);
  const docs = window.CredXBridge.getInvestorDocs(ref);
  const nda = window.CredXBridge.getNda(ref);
  const subs = window.CredXBridge.getSubmissions(ref).filter(s => s.status === 'pending');

  const addDoc = (name, category, by) => window.CredXBridge.addInvestorDoc(ref, {
    id: window.CredXBridge.nextId('doc'), name, category, by, date: today, status: 'approved'
  });
  const onUpload = (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    addDoc(file.name, cat, 'Investor Relations');
    e.target.value = '';
  };
  const onNda = (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    window.CredXBridge.setNda(ref, { signed: true, signedAt: today, fileName: file.name, by: 'Investor Relations' });
    addDoc(file.name, 'NDA', 'Investor Relations');
    e.target.value = '';
  };
  const approve = (s) => {
    window.CredXBridge.setSubmissionStatus(s.id, 'approved');
    if (s.kind === 'document' && s.payload) addDoc(s.payload.name, s.payload.category || 'Investor upload', inv.name);
  };
  const reject = (s) => window.CredXBridge.setSubmissionStatus(s.id, 'rejected');

  const subLabel = (s) => {
    if (s.kind === 'document') return 'Uploaded document · ' + (s.payload && s.payload.category || 'document');
    if (s.kind === 'profile') return 'Profile detail change';
    if (s.kind === 'banking') return 'Nominated banking change';
    return 'Account change';
  };
  const subDetail = (s) => {
    if (!s.payload) return '';
    if (s.kind === 'document') return s.payload.name;
    return Object.entries(s.payload).map(([k, v]) => k + ': ' + v).join(' · ');
  };

  return (
    <>
      {/* Approvals inbox */}
      <div className="section-head">Pending approvals
        <span className="section-meta">{subs.length ? subs.length + ' awaiting' : 'all clear'}</span></div>
      {subs.length === 0 ? (
        <div className="empty-state">No changes awaiting approval.</div>
      ) : (
        <div className="appr-list">
          {subs.map(s => (
            <div key={s.id} className="appr-row">
              <div style={{ flex: 1, minWidth: 0 }}>
                <div className="strong small">{subLabel(s)}</div>
                <div className="muted small" style={{ wordBreak: 'break-word' }}>{subDetail(s)}</div>
                <div className="muted small">Submitted {fmtDate((s.submittedAt || '').slice(0, 10))}</div>
              </div>
              <div className="appr-actions">
                <Btn variant="primary" onClick={() => approve(s)}>Approve</Btn>
                <Btn variant="ghost" onClick={() => reject(s)}>Reject</Btn>
              </div>
            </div>
          ))}
        </div>
      )}

      {/* NDA */}
      <div className="section-head">Non-disclosure agreement
        <span className="section-meta">{nda && nda.signed ? 'Signed' : 'Not on file'}</span></div>
      <div className="nda-box">
        {nda && nda.signed ? (
          <div className="nda-signed">
            <span className="status-badge" style={{ background: '#E8F4EE', color: '#0E6B3F' }}>
              <span className="status-dot" style={{ background: '#1D9A5C' }}/>NDA signed
            </span>
            <div className="muted small" style={{ marginTop: 6 }}>
              {nda.fileName ? nda.fileName + ' · ' : ''}Marked signed {fmtDate(nda.signedAt)}{nda.by ? ' by ' + nda.by : ''}.
              Tier-2 deal content is unlocked for this investor on the portal.
            </div>
          </div>
        ) : (
          <div className="muted small">No signed NDA on file. Upload the countersigned agreement to unlock Tier-2 deal detail on the investor portal.</div>
        )}
        <label className="file-btn" style={{ marginTop: 10 }}>
          {nda && nda.signed ? 'Replace signed NDA' : 'Upload signed NDA & mark signed'}
          <input type="file" accept=".pdf,.doc,.docx,image/*" onChange={onNda} hidden/>
        </label>
      </div>

      {/* Documents */}
      <div className="section-head">Documents
        <span className="section-meta">{docs.length} on file</span></div>
      <div className="inv-upload">
        <select className="wz-input" style={{ maxWidth: 220 }} value={cat} onChange={e => setCat(e.target.value)}>
          {INV_DOC_CATS.map(c => <option key={c}>{c}</option>)}
        </select>
        <label className="file-btn">Upload document
          <input type="file" accept=".pdf,.doc,.docx,image/*" onChange={onUpload} hidden/>
        </label>
      </div>
      {docs.length === 0 ? (
        <div className="empty-state">No documents uploaded yet. Investor Relations can upload ID, proofs of address and bank statements here.</div>
      ) : (
        <div className="docfile-list">
          {docs.map(d => (
            <div key={d.id} className="docfile-row">
              <span className="docfile-ic">{(d.name || '').split('.').pop().slice(0, 3).toUpperCase() || 'DOC'}</span>
              <div style={{ flex: 1, minWidth: 0 }}>
                <div className="small strong" style={{ wordBreak: 'break-word' }}>{d.name}</div>
                <div className="muted small">{d.category} · {d.by} · {fmtDate(d.date)}</div>
              </div>
              <button className="icon-btn" title="Remove"
                      onClick={() => window.CredXBridge.removeInvestorDoc(ref, d.id)}>✕</button>
            </div>
          ))}
        </div>
      )}
    </>
  );
}

Object.assign(window, { InvestorProfileExtras });

  </script>

  <script type="text/babel" data-src="view_wizard.jsx">
// CredX - New Loan creation wizard (7 steps → Decision in Principle)
// Full-page takeover launched from any "+ New loan" button. On "Generate DIP"
// it builds a complete loan record, hands it to addLoan(), and returns to the
// Loan Register with the new loan visible.

const WZ_STEPS = ['Basics', 'Borrower', 'Property', 'Loan terms & financials', 'T&Cs', 'Generate'];
const WZ_LTV_MAX = 0.75;   // lending criteria threshold - LTV above this flags red

const WZ_BROKERS = [
  { name: 'Direct (no introducer)', commission: 0 },
  { name: 'Credcorp Ltd', commission: 1.0 },
  { name: 'Bridging Direct', commission: 1.5 },
  { name: 'Y3S Bridging Loans', commission: 1.0 },
  { name: 'Brightstar Financial', commission: 1.25 },
  { name: 'Enness Global', commission: 1.5 },
  { name: 'Hank Zarihs Associates', commission: 0.75 }
];
const WZ_SURVEYORS = ['Marshall Property Surveys', 'Cushman & Wakefield', 'Knight Frank', 'Carter Jonas'];
const WZ_SOLICITORS = ['Ashfords LLP', 'Knight & Partners', 'Brecher LLP', 'Memery Crystal'];
const WZ_PURPOSES = ['Purchase property', 'Refinance', 'Capital raise', 'Refurbishment', 'Development', 'Bridge to BTL', 'Bridge to sale', 'Other'];
const WZ_DOCS = ['Certified ID', 'Two certified proofs of address', 'Statement of Assets & Liabilities', 'Statement of Income', 'Bank statements (3 months)'];

// ---- date helpers ----
const wzToday = () => new Date().toISOString().slice(0, 10);
function wzAddMonths(iso, months) {
  if (!iso) return '';
  const d = new Date(iso);
  d.setMonth(d.getMonth() + (parseInt(months, 10) || 0));
  return d.toISOString().slice(0, 10);
}
function wzMonthsBetween(a, b) {
  if (!a || !b) return 0;
  const d1 = new Date(a), d2 = new Date(b);
  let m = (d2.getFullYear() - d1.getFullYear()) * 12 + (d2.getMonth() - d1.getMonth());
  if (d2.getDate() < d1.getDate()) m -= 1;
  return Math.max(0, m);
}
function wzNextRef(loans) {
  let max = 535;
  (loans || []).forEach(l => {
    const m = /^CXP-(\d+)/.exec(l.id || '');
    if (m) max = Math.max(max, parseInt(m[1], 10));
  });
  return 'CXP-' + (max + 1);
}

// ---------- small field primitives ----------
function WzField({ label, req, hint, span, children }) {
  return (
    <div className={'wz-fld' + (span ? ' wz-span' + span : '')}>
      <div className="wz-lbl">{label}{req && <span className="wz-req">*</span>}</div>
      {children}
      {hint && <div className="wz-hint">{hint}</div>}
    </div>
  );
}
function WzSeg({ value, options, onChange }) {
  return (
    <div className="wz-seg">
      {options.map(o => (
        <button key={o} type="button"
                className={'wz-seg-opt' + (value === o ? ' on' : '')}
                onClick={() => onChange(o)}>{o}</button>
      ))}
    </div>
  );
}

// ---------- the wizard ----------
function LoanWizard({ data, onClose, addLoan }) {
  const ref = React.useMemo(() => wzNextRef(data.LOANS), [data.LOANS]);

  const [step, setStep] = React.useState(1);
  const [maxSeen, setMaxSeen] = React.useState(1);
  const [showErr, setShowErr] = React.useState(false);
  const [f, setF] = React.useState(() => ({
    // step 1
    dateEntered: wzToday(), status: 'Prospect', workflow: 'Standard workflow',
    // step 2
    borrowerName: '', borrowerCrmId: '', contactName: '', companyReg: '', address: '', postcode: '',
    phone: '', email: '', broker: 'Direct (no introducer)', brokerCrmId: '', commission: 0,
    // step 3
    propAddress: '', propPostcode: '', propType: 'Residential', tenure: 'Freehold',
    valuation: '', valBasis: 'Full RICS', surveyor: '', prospectSolicitor: '',
    ourSolicitor: '', esg: 'Approved',
    // step 4 - loan terms & financials (merged)
    solveMode: 'gross',                 // 'gross' (default) | 'net'
    purpose: 'Purchase property', startDate: wzToday(),
    repaymentDate: wzAddMonths(wzToday(), 12), minTerm: 6,
    repaymentStrategy: 'Re-finance', existingMortgage: 0,
    grossLoan: '', targetNet: '', ratePct: '15', retained: true, retainedPeriods: 12,
    arrFeePct: 2.0, arrFeeMode: 'pct', arrFeeAmt: 0,
    commissionMode: 'pct', commissionAmt: 0,
    setupFee: 1495, redemptionFee: 0, exitLegals: 0,
    ded1Label: '', ded1Amt: 0, ded2Label: '', ded2Amt: 0,
    // step 5 - T&Cs
    erc: 'No penalty', ercMonths: 3, partial: 'No penalty', partialPct: 10, validDays: 14,
    legalFeesNote: "Borrower's legal fees payable by the Borrower - estimated at £2,500 plus VAT.",
    nextSteps: 'Subject to valuation and KYC completion.',
    docs: ['Certified ID', 'Two certified proofs of address', 'Bank statements (3 months)'],
    internalNotes: ''
  }));
  const set = (patch) => setF(prev => ({ ...prev, ...patch }));

  // ---- live derived numbers (solve-mode aware) ----
  const calc = React.useMemo(() => {
    const rate = (parseFloat(f.ratePct) || 0) / 100;
    const sec = parseFloat(f.valuation) || 0;
    const existing = parseFloat(f.existingMortgage) || 0;
    const term = wzMonthsBetween(f.startDate, f.repaymentDate);
    const arrPct = parseFloat(f.arrFeePct) || 0;
    const commPct = parseFloat(f.commission) || 0;
    const periods = f.retained ? (parseInt(f.retainedPeriods, 10) || 0) : 0;
    const setupFee = parseFloat(f.setupFee) || 0;
    const ded = (parseFloat(f.ded1Amt) || 0) + (parseFloat(f.ded2Amt) || 0);
    const arrIsAmt = f.arrFeeMode === 'amt';
    const commIsAmt = f.commissionMode === 'amt';
    const arrFixed = arrIsAmt ? (parseFloat(f.arrFeeAmt) || 0) : 0;
    const commFixed = commIsAmt ? (parseFloat(f.commissionAmt) || 0) : 0;

    // proportional cost factor applied to gross (%-based fees + retained interest %)
    const k = (arrIsAmt ? 0 : arrPct / 100) + (commIsAmt ? 0 : commPct / 100) +
              (f.retained ? rate * periods / 12 : 0);
    const denom = 1 - k;

    let gross, targetNet, solvable = true;
    if (f.solveMode === 'net') {
      targetNet = parseFloat(f.targetNet) || 0;
      solvable = denom > 0;
      gross = solvable ? (targetNet + setupFee + ded + arrFixed + commFixed) / denom : 0;
    } else {
      gross = parseFloat(f.grossLoan) || 0;
    }

    const arrFee = arrIsAmt ? arrFixed : arrPct / 100 * gross;
    const brokerFee = commIsAmt ? commFixed : commPct / 100 * gross;
    const retainedInterest = f.retained ? rate * gross * periods / 12 : 0;
    const monthlyInterest = rate * gross / 12;
    const netDrawdown = gross - arrFee - brokerFee - setupFee - retainedInterest - ded;
    const servicedInterest = f.retained ? 0 : monthlyInterest * term;
    const totalRepayable = gross + servicedInterest +
      (parseFloat(f.redemptionFee) || 0) + (parseFloat(f.exitLegals) || 0);
    const ltv = sec > 0 ? (gross + existing) / sec : 0;
    const ltvBreach = sec > 0 && ltv > WZ_LTV_MAX;

    // effective percentages, so downstream docs/records read consistently in either mode
    const arrFeePctEff = gross > 0 ? arrFee / gross * 100 : (arrIsAmt ? 0 : arrPct);
    const brokerFeePctEff = gross > 0 ? brokerFee / gross * 100 : (commIsAmt ? 0 : commPct);

    return { gross, rate, sec, term, ltv, ltvBreach, retainedInterest, monthlyInterest,
             arrFee, brokerFee, arrFeePctEff, brokerFeePctEff, setupFee, ded,
             netDrawdown, servicedInterest, totalRepayable, targetNet, solvable };
  }, [f]);

  // keep term/repayment in sync when dates change is handled live in calc; nothing to persist.
  const validUntil = wzAddMonths(f.dateEntered, 0) &&
    (() => { const d = new Date(f.dateEntered); d.setDate(d.getDate() + (parseInt(f.validDays,10)||14)); return d.toISOString().slice(0,10); })();

  const canGenerate = f.borrowerName.trim() && f.borrowerCrmId && calc.gross > 0 && (f.solveMode !== 'net' || calc.solvable);

  const goNext = () => {
    if (step === 2 && !(f.borrowerCrmId && f.borrowerName.trim())) { setShowErr(true); return; }
    if (step === 4 && !(calc.gross > 0)) { setShowErr(true); return; }
    setShowErr(false);
    const n = Math.min(6, step + 1);
    setStep(n); setMaxSeen(m => Math.max(m, n));
    document.querySelector('.wz-body')?.scrollTo({ top: 0 });
  };
  const goBack = () => { setShowErr(false); setStep(s => Math.max(1, s - 1)); };
  const jump = (n) => { if (n <= maxSeen) { setShowErr(false); setStep(n); } };

  const toggleDoc = (d) => set({ docs: f.docs.includes(d) ? f.docs.filter(x => x !== d) : [...f.docs, d] });

  const handleGenerate = () => {
    if (!canGenerate) { setShowErr(true); setStep(f.borrowerName.trim() ? 4 : 2); return; }
    const c = calc;
    const investorRate = Math.min(c.rate, 0.10);
    const margin = Math.max(0, c.rate - investorRate);
    const credxInterest = margin * c.gross * c.term / 12;
    const loan = {
      id: ref,
      borrower: f.borrowerName.trim(),
      completion: f.startDate,
      termMonths: c.term,
      interestType: f.retained ? 'Retained' : 'Serviced',
      arrFee: c.arrFeePctEff / 100,
      brokerFee: c.brokerFeePctEff / 100,
      grossLoan: c.gross,
      netLoan: c.netDrawdown,
      retainedInterest: c.retainedInterest,
      expectedRedemption: f.repaymentDate,
      fundingRequirement: c.netDrawdown + c.retainedInterest,
      borrowerRate: c.rate,
      investorRate: investorRate,
      credxMargin: margin,
      introFee: c.brokerFee,
      credxArrFee: c.arrFee,
      adminFee: c.setupFee,
      preCompletionFees: 0,
      totalFees: c.arrFee + c.brokerFee + c.setupFee,
      investorInterest: 0,
      credxInterest: credxInterest,
      totalCredxEarnings: c.arrFee + credxInterest,
      status: 'Pipeline',
      introducer: f.broker && f.broker !== 'Direct (no introducer)' ? f.broker : '',
      surveyor: f.surveyor || '',
      notes: f.internalNotes.trim() ||
        (f.purpose + ' · ' + (f.propAddress || f.address || 'security TBC') + (f.broker && f.broker !== 'Direct (no introducer)' ? ' · via ' + f.broker : '')),
      // DIP metadata + full stored document (kept on file with the loan)
      dip: { ref, issued: f.dateEntered, validUntil, ltv: c.ltv, esg: f.esg },
      dipDoc: wzDipFromForm(f, c, ref, validUntil)
    };
    wzEmailDip(loan.dipDoc);   // export to email
    addLoan(loan);
  };

  // close on Escape
  React.useEffect(() => {
    const onKey = (e) => { if (e.key === 'Escape') onClose(); };
    document.addEventListener('keydown', onKey);
    return () => document.removeEventListener('keydown', onKey);
  }, [onClose]);

  return (
    <div className="wz-backdrop">
      <div className="wz-shell" role="dialog" aria-modal="true">
        {/* header */}
        <div className="wz-head">
          <div className="wz-head-title">
            New loan <span className="wz-ref">{ref}</span>
            <span className="wz-head-sub">Decision in Principle</span>
          </div>
          <button className="wz-close" onClick={onClose} aria-label="Close">✕</button>
        </div>

        {/* stepper */}
        <div className="wz-stepper">
          {WZ_STEPS.map((label, i) => {
            const n = i + 1;
            const state = n < step ? 'done' : n === step ? 'cur' : (n <= maxSeen ? 'seen' : 'todo');
            return (
              <button key={label} className={'wz-step wz-step-' + state}
                      onClick={() => jump(n)} disabled={n > maxSeen}>
                <span className="wz-step-num">{n < step ? '✓' : n}</span>
                <span className="wz-step-label">{label}</span>
              </button>
            );
          })}
        </div>

        {/* body */}
        <div className="wz-body">
          {step === 1 && <WzStep1 f={f} set={set} ref_={ref}/>}
          {step === 2 && <WzStep2 f={f} set={set} data={data} showErr={showErr}/>}
          {step === 3 && <WzStep3 f={f} set={set}/>}
          {step === 4 && <WzStep4 f={f} set={set} calc={calc} showErr={showErr}/>}
          {step === 5 && <WzStep6 f={f} set={set} validUntil={validUntil} toggleDoc={toggleDoc}/>}
          {step === 6 && <WzStep7 f={f} calc={calc} ref_={ref} validUntil={validUntil}/>}
        </div>

        {/* footer */}
        <div className="wz-foot">
          <div className="wz-foot-meta">
            Step {step} of 6
            {step === 4 && ' · all maths live'}
            {!canGenerate && step === 6 && <span className="wz-foot-warn"> · a CRM borrower &amp; loan amount are required</span>}
          </div>
          <div className="wz-foot-btns">
            <button className="wz-btn wz-btn-link" onClick={onClose}>Cancel</button>
            {step > 1 && <button className="wz-btn wz-btn-ghost" onClick={goBack}>← Back</button>}
            {step < 6 && <button className="wz-btn wz-btn-primary" onClick={goNext}>
              {step === 5 ? 'Next: Preview →' : 'Next →'}
            </button>}
            {step === 6 && <button className={'wz-btn wz-btn-primary' + (canGenerate ? '' : ' wz-btn-disabled')}
                                   onClick={handleGenerate}>Generate DIP →</button>}
          </div>
        </div>
      </div>
    </div>
  );
}

// ============ STEP COMPONENTS ============
// £-formatted money input: shows "£292,067", stores a raw numeric string.
const wzGBP = (n) => '£' + (Math.round(n) || 0).toLocaleString('en-GB');
function WzMoney({ value, onChange, placeholder, invalid, readOnly, calc }) {
  const has = value !== '' && value != null && !isNaN(parseFloat(value));
  const display = has ? '£' + Math.round(parseFloat(value)).toLocaleString('en-GB') : '';
  return (
    <input className={'wz-input' + (calc ? ' wz-calc' : '') + (invalid ? ' wz-input-err' : '')}
           inputMode="numeric" value={display} placeholder={placeholder || '£0'} readOnly={readOnly}
           onChange={e => { const d = e.target.value.replace(/[^0-9]/g, ''); onChange(d === '' ? '' : d); }}/>
  );
}

function WzUnitToggle({ mode, onChange }) {
  return (
    <div className="wz-unit" role="group" aria-label="Fee basis">
      {[['pct', '%'], ['amt', '\u00A3']].map(([m, lbl]) => (
        <button key={m} type="button" className={'wz-unit-opt' + (mode === m ? ' on' : '')}
                onClick={() => onChange(m)}>{lbl}</button>
      ))}
    </div>
  );
}

function WzGroup({ title, meta, children }) {
  return (
    <div className="wz-group">
      <div className="wz-group-head"><h3>{title}</h3>{meta && <span className="wz-meta">{meta}</span>}</div>
      <div className="wz-group-body">{children}</div>
    </div>
  );
}

function WzStep1({ f, set, ref_ }) {
  return (
    <div className="wz-pane">
      <div className="wz-pane-head"><h2>Loan basics</h2>
        <p>Three fields to open a record. Status defaults to Prospect; the reference is reserved on first save.</p></div>

// ---- DIP document: shared by the wizard preview, the stored copy, and the drawer viewer ----
const WZ_DIP_ADDR = ["Suite 013 Regus, Victory Way,", "Crossways, Dartford, Kent, DA2 6QD", "info@credx.co.uk \u00b7 www.credx.co.uk"];

// Build a self-contained DIP document object from the live wizard form.
function wzDipFromForm(f, calc, ref, validUntil) {
  return {
    ref, issued: f.dateEntered, validUntil,
    borrower: f.borrowerName, contact: f.contactName, email: f.email, phone: f.phone, companyReg: f.companyReg,
    broker: f.broker, commissionPct: parseFloat(f.commission) || 0,
    purpose: f.purpose, termMonths: calc.term, startDate: f.startDate,
    repaymentDate: f.repaymentDate, repaymentStrategy: f.repaymentStrategy,
    borrowerAddress: (f.address || '') + (f.postcode ? ', ' + f.postcode : ''),
    propertyLine: (f.propAddress || '-') + (f.propPostcode ? ', ' + f.propPostcode : ''),
    propType: f.propType, surveyor: f.surveyor, valBasis: f.valBasis, tenure: f.tenure,
    minTermMonths: parseInt(f.minTerm, 10) || 0,
    monthlyInterest: calc.monthlyInterest,
    retained: !!f.retained, retainedPeriods: f.retained ? (parseInt(f.retainedPeriods, 10) || 0) : 0,
    deductions: [
      { label: f.ded1Label, amt: parseFloat(f.ded1Amt) || 0 },
      { label: f.ded2Label, amt: parseFloat(f.ded2Amt) || 0 }
    ].filter(d => d.amt > 0 || (d.label || '').trim()),
    redemptionFee: parseFloat(f.redemptionFee) || 0,
    exitLegals: parseFloat(f.exitLegals) || 0,
    guarantors: (f.guarantors || '').trim(),
    valuation: calc.sec, ltv: calc.ltv,
    grossLoan: calc.gross, ratePct: parseFloat(f.ratePct) || 0,
    arrFeePct: +(calc.arrFeePctEff || 0).toFixed(2), arrFee: calc.arrFee,
    arrFeeMode: f.arrFeeMode || 'pct',
    brokerFeePct: +(calc.brokerFeePctEff || 0).toFixed(2), brokerFee: calc.brokerFee,
    brokerFeeMode: f.commissionMode || 'pct',
    setupFee: calc.setupFee, retainedInterest: calc.retainedInterest,
    netDrawdown: calc.netDrawdown, totalRepayable: calc.totalRepayable,
    legalFeesNote: f.legalFeesNote,
    ercText: f.erc === 'Custom' ? ('Minimum ' + (parseInt(f.ercMonths, 10) || 0) + " months' interest payments required.") : 'No penalty.',
    partialText: f.partial === 'Custom' ? ('Permitted up to ' + (parseFloat(f.partialPct) || 0) + '% of the outstanding balance.') : 'No penalty.',
    validDays: f.validDays, esg: f.esg, docs: (f.docs || []).slice(), nextSteps: f.nextSteps
  };
}

// Reconstruct a DIP for an existing loan that predates stored DIPs (seed book).
function buildDipDocFromLoan(loan) {
  if (loan.dipDoc) return loan.dipDoc;
  const d = loan.dip || {};
  return {
    ref: d.ref || loan.id, issued: d.issued || loan.completion, validUntil: d.validUntil || null,
    borrower: loan.borrower, contact: '', email: '', phone: '', companyReg: '',
    broker: '-', commissionPct: (loan.brokerFee || 0) * 100,
    purpose: '-', termMonths: loan.termMonths, startDate: loan.completion,

// Render the DIP to a one-page PDF Blob (off-screen capture of the styled document).
async function dipToPdfBlob(doc) {
  const holder = document.createElement('div');
  holder.style.cssText = 'position:fixed;left:-10000px;top:0;width:760px;background:#ffffff;z-index:-1;';
  document.body.appendChild(holder);
  const root = ReactDOM.createRoot(holder);
  root.render(<DipDocument doc={doc}/>);
  await new Promise(r => setTimeout(r, 140));
  if (document.fonts && document.fonts.ready) { try { await document.fonts.ready; } catch (e) {} }
  const node = holder.querySelector('.wz-doc');
  const canvas = await html2canvas(node, { scale: 2, backgroundColor: '#ffffff', useCORS: true, logging: false });
  const img = canvas.toDataURL('image/png');
  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF({ unit: 'pt', format: 'a4', compress: true });
  const pw = pdf.internal.pageSize.getWidth();
  const ph = pdf.internal.pageSize.getHeight();
  const margin = 28;
  let iw = pw - margin * 2;
  let ih = canvas.height * (iw / canvas.width);
  const availH = ph - margin * 2;
  let x = margin, y = margin;
  if (ih > availH) { ih = availH; iw = canvas.width * (ih / canvas.height); x = (pw - iw) / 2; }
  pdf.addImage(img, 'PNG', x, y, iw, ih);
  const blob = pdf.output('blob');
  root.unmount();
  holder.remove();
  return blob;
}

// Export the DIP as a PDF and attach it to an email (no body text).
async function wzEmailDip(doc) {
  const subject = 'Decision in Principle - ' + doc.ref + ' - ' + (doc.borrower || '');
  const fname = 'DIP-' + String(doc.ref || 'loan').replace(/[^\w-]+/g, '') + '.pdf';
  let blob;
  try {
    blob = await dipToPdfBlob(doc);
  } catch (e) {
    console.error('DIP PDF generation failed', e);
    const a = document.createElement('a');
    a.href = 'mailto:' + encodeURIComponent(doc.email || '') + '?subject=' + encodeURIComponent(subject);
    a.style.display = 'none'; document.body.appendChild(a); a.click(); a.remove();
    return;
  }
  const file = new File([blob], fname, { type: 'application/pdf' });
  // Preferred path: a share sheet that attaches the PDF directly to an email (no body).
  try {
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: subject });
      return;
    }
  } catch (e) { /* cancelled / unsupported -> fall through */ }
  // Fallback: download the PDF, then open a body-less email addressed to the borrower to attach it.
  const url = URL.createObjectURL(blob);
  const dl = document.createElement('a');
  dl.href = url; dl.download = fname; dl.style.display = 'none';
  document.body.appendChild(dl); dl.click(); dl.remove();
  setTimeout(() => URL.revokeObjectURL(url), 8000);
  const mail = document.createElement('a');
  mail.href = 'mailto:' + encodeURIComponent(doc.email || '') + '?subject=' + encodeURIComponent(subject);
  mail.style.display = 'none'; document.body.appendChild(mail);
  setTimeout(() => { mail.click(); mail.remove(); }, 350);
}

function StatementDocument({ loan, accrual, schedule }) {

  const applied = (schedule && schedule.applied) ? schedule.applied.slice() : [];
  const totalApplied = applied.reduce((s, p) => s + (p.amount || 0), 0);
  const events = accrual.tranches.map(t => ({
    date: t.date, kind: t.kind, capital: t.amount, interest: 0,
    desc: t.kind === 'facility' ? 'Initial facility advance' : ('Capital drawdown' + (t.note ? ' — ' + t.note : '')),
  })).concat(applied.map(p => ({
    date: p.appliedDate || p.end, kind: 'interest', capital: 0, interest: p.amount,
    desc: 'Interest charged · ' + fmtDateShort(p.start) + ' – ' + fmtDateShort(p.end),
  })));
  events.sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : (a.kind === 'interest' ? 1 : -1)));
  let bal = 0;
  // Interest accrued but not yet posted as a monthly charge (bridges to redemption).
  const uncharged = Math.max(0, accrual.redemptionFigure - accrual.principal - totalApplied);

            {kv('Borrower', loan.borrower || '-')}
            {kv('Loan reference', loan.id)}
            {kv('Product', 'Bridging loan')}
            {kv('Interest basis', loan.interestType)}
            {kv('Interest rate', fmtPct(loan.borrowerRate, 1) + ' p.a.')}
            {kv('Term', loan.termMonths + ' months')}
            {kv('Completion', fmtDate(loan.completion))}
            {kv('Expected redemption', fmtDate(loan.expectedRedemption))}
          </div>
        </div>
        <div className="wz-doc-block">
          <h4>Current position</h4>
          <div className="wz-doc-kv">
            {kv('Principal outstanding', g0(accrual.principal))}
            {kv('Interest charged to date', g2(totalApplied))}
            {uncharged > 0 && kv('Interest accrued, not yet charged', g2(uncharged))}
            {accrual.retained && kv('Interest prepaid (retained)', '(' + g0(accrual.prepaid) + ')')}
            {kv('Redemption figure today', <b>{g2(accrual.redemptionFigure)}</b>)}

          </thead>
          <tbody>

            : 'Interest is serviced monthly. Any interest accrued since the last applied period is shown as not yet charged.'}

// Shared statement model — the same figures + chronological ledger the
// on-screen StatementDocument renders, so PDF and Excel exports always agree.
function buildStatementModel(loan, accrual, schedule) {
  const applied = (schedule && schedule.applied) ? schedule.applied.slice() : [];
  const totalApplied = applied.reduce((s, p) => s + (p.amount || 0), 0);
  const events = accrual.tranches.map(t => ({
    date: t.date, kind: t.kind, capital: t.amount, interest: 0,
    desc: t.kind === 'facility' ? 'Initial facility advance' : ('Capital drawdown' + (t.note ? ' — ' + t.note : '')),
  })).concat(applied.map(p => ({
    date: p.appliedDate || p.end, kind: 'interest', capital: 0, interest: p.amount,
    desc: 'Interest charged · ' + fmtDateShort(p.start) + ' – ' + fmtDateShort(p.end),
  })));
  events.sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : (a.kind === 'interest' ? 1 : -1)));
  const uncharged = Math.max(0, accrual.redemptionFigure - accrual.principal - totalApplied);
  let bal = 0;
  const rows = events.map(e => { bal += e.capital + e.interest; return { ...e, balance: bal }; });
  if (uncharged > 0) {
    bal += uncharged;
    rows.push({ date: accrual.asOf, kind: 'interest', capital: 0, interest: uncharged, balance: bal,
                desc: 'Interest accrued, not yet charged' });
  }
  return {
    applied, totalApplied, uncharged, rows,
    stmtRef: 'STMT-' + loan.id + '-' + (accrual.asOf || '').replace(/-/g, ''),
    fileBase: 'Statement-' + String(loan.id).replace(/[^\w-]+/g, '') + '-' + (accrual.asOf || '').replace(/-/g, ''),
  };
}

// Trigger a browser download for a Blob.
function triggerDownload(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; a.style.display = 'none';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 8000);
}

function round2(n) { return Math.round((Number(n) || 0) * 100) / 100; }

// Render a statement to a one-page PDF Blob (off-screen capture).
async function statementToPdfBlob(loan, accrual, schedule) {
  const holder = document.createElement('div');
  holder.style.cssText = 'position:fixed;left:-10000px;top:0;width:760px;background:#ffffff;z-index:-1;';
  document.body.appendChild(holder);
  const root = ReactDOM.createRoot(holder);
  root.render(<StatementDocument loan={loan} accrual={accrual} schedule={schedule}/>);
  await new Promise(r => setTimeout(r, 140));
  if (document.fonts && document.fonts.ready) { try { await document.fonts.ready; } catch (e) {} }
  const node = holder.querySelector('.wz-doc');
  const canvas = await html2canvas(node, { scale: 2, backgroundColor: '#ffffff', useCORS: true, logging: false });
  const img = canvas.toDataURL('image/png');
  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF({ unit: 'pt', format: 'a4', compress: true });
  const pw = pdf.internal.pageSize.getWidth();
  const ph = pdf.internal.pageSize.getHeight();
  const margin = 28;
  let iw = pw - margin * 2;
  let ih = canvas.height * (iw / canvas.width);
  const availH = ph - margin * 2;
  let x = margin, y = margin;
  if (ih > availH) { ih = availH; iw = canvas.width * (ih / canvas.height); x = (pw - iw) / 2; }
  pdf.addImage(img, 'PNG', x, y, iw, ih);
  const blob = pdf.output('blob');
  root.unmount();
  holder.remove();
  return blob;
}

// Export the statement as a PDF and attach it to an email to the borrower.
async function emailStatement(loan, accrual, schedule) {
  const subject = 'CredX loan statement - ' + loan.id + ' - ' + (loan.borrower || '');
  const fname = 'Statement-' + String(loan.id).replace(/[^\w-]+/g, '') + '-' + (accrual.asOf || '').replace(/-/g, '') + '.pdf';
  let blob;
  try { blob = await statementToPdfBlob(loan, accrual, schedule); }
  catch (e) { console.error('Statement PDF generation failed', e); return; }
  const file = new File([blob], fname, { type: 'application/pdf' });
  try {
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: subject });
      return;
    }
  } catch (e) { /* cancelled / unsupported -> fall through */ }
  const url = URL.createObjectURL(blob);
  const dl = document.createElement('a');
  dl.href = url; dl.download = fname; dl.style.display = 'none';
  document.body.appendChild(dl); dl.click(); dl.remove();
  setTimeout(() => URL.revokeObjectURL(url), 8000);
  const mail = document.createElement('a');
  mail.href = 'mailto:?subject=' + encodeURIComponent(subject);
  mail.style.display = 'none'; document.body.appendChild(mail);
  setTimeout(() => { mail.click(); mail.remove(); }, 350);
}
