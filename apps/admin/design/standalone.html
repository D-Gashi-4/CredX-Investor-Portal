.uw-list-row:last-child { border-bottom: 0; }
.uw-list-row:hover { background: var(--cream); }
.uw-ref { font-family: 'JetBrains Mono', monospace; font-size: 12.5px; font-weight: 600; color: var(--ink); }
.uw-cell-borrower { display: flex; align-items: center; gap: 9px; min-width: 0; }
.uw-cell-borrower .cell-stack { min-width: 0; }
.uw-cell-borrower .strong { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.uw-cell-stage { display: flex; align-items: center; gap: 8px; min-width: 0; }
.uw-stage-no { font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700; color: #fff;
  background: var(--teal-600); border-radius: 5px; padding: 2px 6px; flex-shrink: 0; }
.uw-stage-name { font-size: 12.5px; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.uw-cell-prog { display: flex; align-items: center; gap: 8px; }
.uw-prog-txt { font-size: 11.5px; color: var(--ink-3); font-variant-numeric: tabular-nums; min-width: 34px; }
.uw-cell-owner { display: flex; align-items: center; gap: 7px; }
.uw-cell-status { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }

/* ── Board ── */
.uw-board { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(230px, 1fr); gap: 14px;
  overflow-x: auto; padding-bottom: 8px; }
.uw-col { background: var(--cream-2); border-radius: 12px; padding: 10px; display: flex; flex-direction: column; min-height: 120px; }
.uw-col-head { display: flex; align-items: center; justify-content: space-between; padding: 4px 6px 10px; }
.uw-col-title { font-size: 12px; font-weight: 700; color: var(--ink-2); letter-spacing: .02em; }
.uw-col-count { font-size: 11px; font-weight: 700; color: var(--ink-3); background: var(--surface); border-radius: 100px; padding: 1px 8px; }
.uw-col-body { display: flex; flex-direction: column; gap: 8px; }
.uw-col-empty { color: var(--ink-3); text-align: center; padding: 14px 0; font-size: 18px; opacity: .5; }
.uw-card { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  padding: 11px; cursor: pointer; font: inherit; display: flex; flex-direction: column; gap: 8px; transition: all .12s; }
.uw-card:hover { border-color: var(--teal-600); box-shadow: 0 3px 10px rgba(0,0,0,.07); }
.uw-card-top { display: flex; align-items: center; justify-content: space-between; }
.uw-card-borrower { display: flex; align-items: center; gap: 7px; }
.uw-card-borrower .strong { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.uw-card-stage { line-height: 1.3; }
.uw-card-foot { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
.uw-card-foot-r { display: flex; align-items: center; gap: 6px; }

/* ── Workspace ── */
.uw-workspace { display: flex; flex-direction: column; height: 100%; }
.uw-ws-head { padding: 20px 24px 0; border-bottom: 1px solid var(--line); background: var(--surface); }
.uw-ws-headtop { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.uw-ws-ident { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.uw-ws-ref { font-family: 'JetBrains Mono', monospace; font-size: 16px; font-weight: 700; color: var(--ink); }
.uw-ws-borrower { display: flex; align-items: center; gap: 12px; margin: 14px 0 4px; }
.uw-ws-name { font-family: 'Source Serif 4', Georgia, serif; font-size: 21px; font-weight: 500; color: var(--ink); }
.uw-ws-metarow { display: flex; flex-wrap: wrap; gap: 26px; padding: 14px 0 16px; }
.uw-ws-meta { display: flex; flex-direction: column; gap: 3px; }
.uw-meta-l { font-size: 10.5px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--ink-3); }
.uw-ws-meta .small { display: inline-flex; align-items: center; gap: 6px; }
.uw-owner-btn { display: inline-flex; align-items: center; gap: 6px; font: inherit; font-size: 12.5px; font-weight: 500;
  background: var(--cream-2); border: 1px solid var(--line); border-radius: 100px; padding: 3px 11px 3px 3px; cursor: pointer; color: var(--ink); }
.uw-owner-btn:hover { border-color: var(--teal-600); }
.uw-ws-prog { min-width: 180px; }
.uw-ws-progbar { display: flex; align-items: center; gap: 8px; }
.uw-overdue-txt { color: var(--red); font-weight: 600; }

/* Tabs */
.uw-tabs { display: flex; gap: 4px; padding: 0 24px; background: var(--surface); border-bottom: 1px solid var(--line); }
.uw-tab { font: inherit; font-size: 13.5px; font-weight: 500; color: var(--ink-2); background: transparent;
  border: 0; border-bottom: 2px solid transparent; padding: 12px 14px; cursor: pointer; display: inline-flex; align-items: center; gap: 7px; }
.uw-tab:hover { color: var(--ink); }
.uw-tab.on { color: var(--teal-700); border-bottom-color: var(--teal-600); font-weight: 600; }
.uw-tab-badge { font-size: 10.5px; font-weight: 700; background: var(--cream-3); color: var(--ink-2); border-radius: 100px; padding: 1px 7px; }
.uw-tab.on .uw-tab-badge { background: var(--teal-600); color: #fff; }
.uw-ws-body { flex: 1; overflow-y: auto; padding: 22px 24px 60px; background: var(--cream); }

/* Stepper */
.uw-stepper { display: flex; align-items: center; margin-bottom: 20px; padding: 4px 2px; flex-wrap: wrap; gap: 2px; }
.uw-step { border: 0; background: transparent; cursor: pointer; padding: 0; }
.uw-step-dot { display: inline-flex; align-items: center; justify-content: center; width: 30px; height: 30px;
  border-radius: 50%; font-size: 11.5px; font-weight: 700; font-family: 'JetBrains Mono', monospace;
  background: var(--surface); border: 2px solid var(--line-2); color: var(--ink-3); transition: all .15s; }
.uw-step-done .uw-step-dot { background: var(--green); border-color: var(--green); color: #fff; }
.uw-step-current .uw-step-dot { background: var(--teal-600); border-color: var(--teal-600); color: #fff; box-shadow: 0 0 0 4px var(--teal-50); }
.uw-step-escalated .uw-step-dot { background: var(--red); border-color: var(--red); color: #fff; }
.uw-step:hover .uw-step-dot { transform: scale(1.08); }
.uw-step-line { width: 18px; height: 2px; background: var(--line-2); flex-shrink: 0; }
.uw-line-done { background: var(--green); }

.uw-checklist-tools { display: flex; justify-content: flex-end; margin-bottom: 10px; }

/* Stage card */
.uw-stage { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; margin-bottom: 12px; overflow: hidden; }
.uw-stage-current { border-color: var(--teal-600); box-shadow: 0 0 0 1px var(--teal-600); }
.uw-stage-escalated { border-color: var(--red); }
.uw-stage-head { width: 100%; display: flex; align-items: center; gap: 14px; padding: 14px 16px; background: transparent;
  border: 0; cursor: pointer; font: inherit; text-align: left; }
.uw-stage-head:hover { background: var(--cream); }
.uw-stage-num { font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 700; color: var(--ink-3);
  width: 34px; height: 34px; display: inline-flex; align-items: center; justify-content: center;
  border-radius: 9px; background: var(--cream-2); flex-shrink: 0; }
.uw-stage-done .uw-stage-num { background: var(--green-50); color: var(--green); }
.uw-stage-current .uw-stage-num { background: var(--teal-600); color: #fff; }
.uw-stage-escalated .uw-stage-num { background: var(--red-50); color: var(--red); }
.uw-stage-headmain { flex: 1; min-width: 0; }
.uw-stage-title { font-size: 14.5px; font-weight: 600; color: var(--ink); }
.uw-stage-meta { display: flex; align-items: center; gap: 10px; margin-top: 3px; flex-wrap: wrap; }
.uw-area-tag { font-size: 11px; font-weight: 600; color: var(--teal-700); background: var(--teal-50); border-radius: 5px; padding: 1px 7px; }
.uw-stage-right { display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
.uw-stage-status { font-size: 11.5px; font-weight: 600; }
.uw-sstate-done { color: var(--green); }
.uw-sstate-current { color: var(--teal-700); }
.uw-sstate-escalated { color: var(--red); }
.uw-sstate-todo { color: var(--ink-3); }
.uw-stage-count { font-size: 12px; font-variant-numeric: tabular-nums; color: var(--ink-3); min-width: 32px; text-align: right; }
.uw-chev { font-size: 20px; color: var(--ink-3); transition: transform .18s; line-height: 1; }
.uw-chev.open { transform: rotate(90deg); }
.uw-stage-body { padding: 4px 16px 14px; border-top: 1px solid var(--line); }
.uw-stage-note { font-size: 12px; color: var(--uw-amber); background: var(--uw-amber-bg); border-radius: 7px; padding: 8px 11px; margin: 12px 0 4px; }
.uw-evidence { padding: 10px 0; font-size: 12px; color: var(--ink-2); line-height: 1.5; }

/* Item rows */
.uw-item { display: flex; gap: 12px; padding: 13px 0; border-top: 1px solid var(--line); }
.uw-item:first-of-type { border-top: 0; }
.uw-item-esc { background: var(--red-50); margin: 0 -16px; padding: 13px 16px; }
.uw-item-marker { flex-shrink: 0; padding-top: 1px; }
.uw-dot { display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px;
  border-radius: 50%; font-size: 12px; font-weight: 700; background: var(--uwbg); color: var(--uwc); border: 1.5px solid var(--uwc); }
.uw-tone-idle.uw-dot { border-color: var(--line-2); background: var(--surface); }
.uw-item-main { flex: 1; min-width: 0; }
.uw-item-label { font-size: 13.5px; font-weight: 600; color: var(--ink); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.uw-item-id { font-family: 'JetBrains Mono', monospace; font-size: 10.5px; font-weight: 600; color: var(--ink-3); background: var(--cream-2); border-radius: 4px; padding: 1px 5px; }
.uw-tag-2uw { font-size: 10px; font-weight: 700; color: #6D44A8; background: #EEE6F7; border-radius: 4px; padding: 1px 6px; }
[data-theme="dark"] .uw-tag-2uw { background: #261C36; color: #B794E0; }
.uw-item-detail { font-size: 12px; color: var(--ink-2); line-height: 1.5; margin-top: 3px; }
.uw-item-note { font-size: 12px; color: var(--ink-2); background: var(--cream-2); border-left: 2px solid var(--teal-600);
  border-radius: 0 6px 6px 0; padding: 6px 10px; margin-top: 7px; }
.uw-item-escbar { display: flex; align-items: center; gap: 10px; margin-top: 8px; flex-wrap: wrap; }
.uw-escbar-l { font-size: 11.5px; font-weight: 700; color: var(--red); white-space: nowrap; }
.uw-escbar-t { font-size: 12px; color: var(--ink-2); flex: 1; min-width: 140px; }
.uw-item-docs { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.uw-doc-chip { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--ink);
  background: var(--cream-2); border: 1px solid var(--line); border-radius: 7px; padding: 3px 6px 3px 9px; }
.uw-doc-ic { color: var(--teal-600); }
.uw-doc-x { border: 0; background: transparent; color: var(--ink-3); cursor: pointer; font-size: 10px; padding: 2px 3px; border-radius: 4px; }
.uw-doc-x:hover { color: var(--red); background: var(--red-50); }
.uw-item-tools { display: flex; gap: 12px; margin-top: 9px; }
.uw-tool { font: inherit; font-size: 11.5px; font-weight: 500; color: var(--ink-2); background: transparent; border: 0; padding: 2px 0; cursor: pointer; }
.uw-tool:hover { color: var(--teal-700); }
.uw-tool-danger:hover { color: var(--red); }
.uw-item-side { flex-shrink: 0; }
.uw-state-select { font: inherit; font-size: 12px; font-weight: 600; padding: 6px 8px; border-radius: 8px;
  border: 1px solid var(--uwc); color: var(--uwc); background: var(--uwbg); cursor: pointer; }

.uw-inline-form { margin-top: 9px; display: flex; flex-direction: column; gap: 7px; }
.uw-inline-actions { display: flex; gap: 7px; }
.uw-attach-row { display: flex; gap: 7px; }
.uw-attach-row .wz-input:first-child { flex: 1; }
.uw-file-hidden { display: none; }
.uw-dropzone { display: flex; flex-direction: column; align-items: center; gap: 3px;
  padding: 16px 14px; border: 1.5px dashed var(--line-2); border-radius: 10px;
  background: var(--cream-2); cursor: pointer; text-align: center; transition: border-color .12s, background .12s; }
.uw-dropzone:hover { border-color: var(--teal-600); background: #fff; }
.uw-dropzone.drag { border-color: var(--teal-600); border-style: solid; background: var(--teal-50, #e9f4f2); }
.uw-dz-ic { font-size: 18px; color: var(--teal-600); line-height: 1; }
.uw-dz-main { font-size: 13px; font-weight: 600; color: var(--ink); }
.uw-dz-link { color: var(--teal-600); text-decoration: underline; }
.uw-dz-sub { font-size: 11px; color: var(--ink-2); }
.uw-mini-btn { font: inherit; font-size: 12px; font-weight: 600; padding: 6px 13px; border-radius: 8px;
  border: 1px solid var(--teal-600); background: var(--teal-600); color: #fff; cursor: pointer; white-space: nowrap; }
.uw-mini-btn:hover { background: var(--teal-700); }
.uw-mini-btn.ghost { background: transparent; color: var(--ink-2); border-color: var(--line-2); }
.uw-mini-btn.ghost:hover { background: var(--cream-2); color: var(--ink); }
.uw-mini-btn.danger { background: var(--red); border-color: var(--red); }
.uw-mini-btn.danger:hover { filter: brightness(.94); }

/* Security call */
.uw-item-call .uw-dot { font-size: 12px; }
.uw-call-covers { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.uw-cover-chip { font-size: 11px; color: var(--ink-2); background: var(--cream-2); border-radius: 6px; padding: 3px 9px; }
.uw-call-done { font-size: 12px; color: var(--green); font-weight: 500; margin-top: 7px; }

/* Sign-off gate */
.uw-signoff { border-radius: 11px; padding: 16px; margin-top: 8px; border: 1.5px dashed var(--line-2); }
.uw-signoff.blocked { background: var(--cream-2); }
.uw-signoff.ready { background: var(--uw-amber-bg); border-color: var(--uw-amber); border-style: solid; }
.uw-signoff.done { background: var(--green-50); border-color: var(--green); border-style: solid; }
.uw-signoff-head { display: flex; gap: 12px; }
.uw-signoff-ic { font-size: 20px; flex-shrink: 0; }
.uw-signoff-title { font-size: 14px; font-weight: 700; color: var(--ink); display: flex; align-items: center; gap: 8px; }
.uw-signoff-stamp { font-size: 12.5px; font-weight: 600; color: var(--green); margin-top: 10px; }
.uw-signoff-actions { margin-top: 12px; }
.uw-signoff-btns { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.uw-signoff-btn { font: inherit; font-size: 12.5px; font-weight: 600; padding: 9px 16px; border-radius: 9px;
  border: 0; background: var(--uw-amber); color: #fff; cursor: pointer; }
.uw-signoff-btn:hover { filter: brightness(.95); }
.uw-signoff-btn.alt { background: var(--navy-900); }
.uw-signoff-blocked { margin-top: 10px; }
.uw-lock-txt { font-size: 12px; font-weight: 600; color: var(--ink-2); }
.uw-block-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.uw-block-chip { font-size: 11px; color: var(--ink-2); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 2px 8px; }

/* Panes (documents, conditions, escalations, post) */
.uw-pane { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; }
.uw-pane-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 14px; }
.uw-pane-head h3 { font-family: 'Source Serif 4', Georgia, serif; font-size: 17px; font-weight: 500; margin: 0; }
.uw-addbar { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
.uw-addbar .wz-input { flex: 1; min-width: 120px; }
.uw-addbar .uw-narrow { flex: 0 0 auto; min-width: 0; width: auto; }
.uw-table { width: 100%; border-collapse: collapse; }
.uw-table th { text-align: left; font-size: 10.5px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase;
  color: var(--ink-3); padding: 8px 10px; border-bottom: 1px solid var(--line); }
.uw-table td { padding: 9px 10px; border-bottom: 1px solid var(--line); font-size: 12.5px; color: var(--ink); vertical-align: top; }
.uw-table tr:last-child td { border-bottom: 0; }
.uw-kind { font-size: 11px; color: var(--ink-2); background: var(--cream-2); border-radius: 5px; padding: 2px 8px; }
.uw-point-ref { font-family: 'JetBrains Mono', monospace; font-size: 10.5px; font-weight: 600; color: var(--teal-700); background: var(--teal-50); border-radius: 4px; padding: 1px 5px; margin-right: 4px; }
.empty-state.small { padding: 14px; font-size: 12.5px; }

/* Conditions */
.uw-cond-sec { margin-bottom: 18px; }
.uw-cond-sectitle { font-size: 13px; font-weight: 700; color: var(--ink); margin-bottom: 10px; }
.uw-cond { display: flex; align-items: flex-start; gap: 11px; padding: 10px; border: 1px solid var(--line); border-radius: 9px; margin-bottom: 7px; }
.uw-cond.sat { background: var(--green-50); border-color: transparent; }
.uw-cond-check { flex-shrink: 0; width: 22px; height: 22px; border-radius: 6px; border: 1.5px solid var(--line-2);
  background: var(--surface); color: #fff; font-size: 12px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
.uw-cond-check.on { background: var(--green); border-color: var(--green); }
.uw-cond-body { flex: 1; }
.uw-cond-text { font-size: 13px; color: var(--ink); line-height: 1.45; }
.uw-cond-meta { display: flex; gap: 10px; margin-top: 5px; align-items: center; }
.uw-due { font-size: 11px; color: var(--ink-3); }
.uw-due.overdue { color: var(--red); font-weight: 600; }
.uw-sat-tag { font-size: 11px; font-weight: 600; color: var(--green); }

/* Escalations */
.uw-callout { font-size: 12px; color: var(--red); background: var(--red-50); border-radius: 9px; padding: 11px 13px; margin-bottom: 14px; line-height: 1.5; }
.uw-esc { display: flex; gap: 11px; padding: 13px; border: 1px solid var(--line); border-left: 3px solid var(--red); border-radius: 9px; margin-bottom: 9px; }
.uw-esc.resolved { border-left-color: var(--green); opacity: .85; }
.uw-esc-ic { color: var(--red); font-size: 15px; flex-shrink: 0; }
.uw-esc.resolved .uw-esc-ic { color: var(--green); }
.uw-esc-body { flex: 1; }
.uw-esc-reason { font-size: 13px; color: var(--ink); line-height: 1.45; }
.uw-esc-meta { display: flex; gap: 10px; align-items: center; margin-top: 6px; flex-wrap: wrap; }
.uw-esc-status { font-size: 11px; font-weight: 700; }
.uw-esc-status.open { color: var(--red); }
.uw-esc-status.resolved { color: var(--green); }
.uw-esc-resolution { font-size: 12px; color: var(--ink-2); margin-top: 7px; background: var(--cream-2); border-radius: 6px; padding: 7px 10px; }

/* Post-completion */
.uw-pc-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 1px; background: var(--line);
  border: 1px solid var(--line); border-radius: 11px; overflow: hidden; margin-bottom: 20px; }
.uw-pc-stat { background: var(--surface); padding: 13px 15px; }
.uw-pc-l { font-size: 10.5px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--ink-3); }
.uw-pc-v { font-size: 17px; font-weight: 600; font-family: 'JetBrains Mono', monospace; color: var(--ink); margin-top: 4px; }
.uw-pc-v.amber { color: var(--uw-amber); }
.uw-pc-sec { margin-bottom: 18px; }
.uw-pc-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; }
.uw-logrow { display: flex; align-items: center; gap: 11px; padding: 9px 0; border-bottom: 1px solid var(--line); }
.uw-logrow:last-child { border-bottom: 0; }
.uw-var-type { font-size: 11px; font-weight: 700; color: var(--teal-700); background: var(--teal-50); border-radius: 5px; padding: 2px 8px; white-space: nowrap; }
.uw-var-type.alt { color: var(--ink-2); background: var(--cream-2); }
.uw-log-text { flex: 1; font-size: 12.5px; color: var(--ink); }

/* Drawer panel */
.uw-drawerpanel { background: var(--cream-2); border: 1px solid var(--line); border-radius: 11px; padding: 14px 16px; margin: 18px 0; }
.uw-dp-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 11px; }
.uw-dp-title { font-size: 13.5px; font-weight: 600; color: var(--ink); }
.uw-dp-row { display: flex; align-items: center; gap: 9px; margin-bottom: 9px; }
.uw-dp-meta { display: flex; flex-direction: column; gap: 2px; margin-bottom: 12px; font-size: 12.5px; color: var(--ink); }
.uw-dp-open { width: 100%; font: inherit; font-size: 13px; font-weight: 600; color: var(--teal-700); background: var(--surface);
  border: 1px solid var(--teal-600); border-radius: 9px; padding: 9px; cursor: pointer; }
.uw-dp-open:hover { background: var(--teal-600); color: #fff; }

@media (max-width: 900px) {
  .uw-pc-cols { grid-template-columns: 1fr; }
  /* Workspace chrome tightens; tab strip scrolls instead of overflowing */
  .uw-ws-head { padding: 14px 14px 0; }
  .uw-ws-headtop { flex-wrap: wrap; }
  .uw-tabs {
    padding: 0 14px; overflow-x: auto; -webkit-overflow-scrolling: touch;
    scrollbar-width: none; max-width: 100%;
  }
  .uw-tabs::-webkit-scrollbar { display: none; }
  .uw-tab { flex-shrink: 0; padding: 12px 12px; min-height: 44px; }
  .uw-ws-body { padding: 16px 14px 60px; }

// Shared UI primitives for CredX management platform
const { useState, useMemo, useEffect, useRef, createContext, useContext } = React;

// ---------- formatters ----------
const fmtGBP = (n, opts = {}) => {
  if (n == null || isNaN(n)) return '-';
  const { decimals = 0, abbreviate = false } = opts;
  if (abbreviate && Math.abs(n) >= 1_000_000) return '£' + (n / 1_000_000).toFixed(2) + 'm';
  if (abbreviate && Math.abs(n) >= 10_000) return '£' + (n / 1000).toFixed(1) + 'k';
  return '£' + n.toLocaleString('en-GB', { minimumFractionDigits: decimals, maximumFractionDigits: decimals });
};
const fmtPct = (n, decimals = 2) => {
  if (n == null || isNaN(n)) return '-';
  return (n * 100).toFixed(decimals) + '%';
};
const fmtDate = (iso) => {
  if (!iso) return '-';
  const d = new Date(iso);
  return d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
};
const fmtDateShort = (iso) => {
  if (!iso) return '-';
  const d = new Date(iso);
  return d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short' });
};
const daysBetween = (a, b) => {
  if (!a || !b) return null;
  const ms = new Date(b) - new Date(a);
  return Math.round(ms / 86400000);
};
const daysFromAsOf = (iso, asOf) => daysBetween(asOf, iso);

// ---------- Status badge ----------
function StatusBadge({ status }) {
  const styles = {

    'Overdue':  { bg: '#FBE7E5', fg: '#9B2D24', dot: '#D14536' }
  };
  const s = styles[status] || styles['Pipeline'];
  return (
    <span className="status-badge" style={{ background: s.bg, color: s.fg }}>
      <span className="status-dot" style={{ background: s.dot }}></span>
      {status}
    </span>
  );
}

// ---------- Maturity chip ----------
function MaturityChip({ days }) {
  if (days == null) return <span className="muted">-</span>;
  let cls = 'mat-ok', label = 'On track';
  if (days < 0) { cls = 'mat-overdue'; label = `${Math.abs(days)}d overdue`; }
  else if (days <= 7) { cls = 'mat-critical'; label = `${days}d`; }
  else if (days <= 30) { cls = 'mat-warn'; label = `${days}d`; }
  else { label = `${days}d`; }
  return <span className={`mat-chip ${cls}`}>{label}</span>;
}

// ---------- KPI Card ----------
function KPI({ label, value, sub, trend, accent, big }) {
  return (
    <div className={"kpi " + (big ? 'kpi-big ' : '') + (accent ? `kpi-${accent}` : '')}>
      <div className="kpi-label">{label}</div>
      <div className="kpi-value">{value}</div>
      {sub && <div className="kpi-sub">{sub}</div>}
      {trend != null && (
        <div className={"kpi-trend " + (trend >= 0 ? 'pos' : 'neg')}>
          {trend >= 0 ? '▲' : '▼'} {Math.abs(trend).toFixed(1)}%
        </div>
      )}
    </div>
  );
}

// ---------- Card ----------
function Card({ title, action, children, padded = true, className = '' }) {
  return (
    <div className={`card ${className}`}>
      {(title || action) && (
        <div className="card-head">
          <h3>{title}</h3>
          {action}
        </div>
      )}
      <div className={padded ? 'card-body' : 'card-body-flush'}>{children}</div>
    </div>
  );
}

// ---------- Sparkline / mini bars ----------
function MiniBars({ data, height = 36, color = '#087B8E', accent }) {
  const max = Math.max(...data, 1);
  return (
    <div className="mini-bars" style={{ height }}>
      {data.map((v, i) => (
        <div key={i} className="mini-bar"
             style={{ height: `${(v / max) * 100}%`, background: i === accent ? '#1A1A1A' : color }}/>
      ))}
    </div>
  );
}

// ---------- Drawer ----------
function Drawer({ open, onClose, title, children, width = 520 }) {
  useEffect(() => {
    if (!open) return;
    const onKey = (e) => e.key === 'Escape' && onClose();
    document.addEventListener('keydown', onKey);
    return () => document.removeEventListener('keydown', onKey);
  }, [open, onClose]);
  if (!open) return null;
  return (
    <div className="drawer-backdrop" onClick={onClose}>
      <div className="drawer" style={{ width }} onClick={(e) => e.stopPropagation()}>
        <div className="drawer-head">
          <div className="drawer-title">{title}</div>
          <button className="icon-btn" onClick={onClose}>✕</button>
        </div>
        <div className="drawer-body">{children}</div>
      </div>
    </div>
  );
}

// ---------- Toolbar (filters/search) ----------
function Toolbar({ children }) {
  return <div className="toolbar">{children}</div>;
}
function SearchBox({ value, onChange, placeholder = 'Search…' }) {
  return (
    <div className="search-box">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
        <circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <input value={value} onChange={(e) => onChange(e.target.value)} placeholder={placeholder}/>
    </div>
  );
}
function FilterPills({ options, value, onChange }) {
  return (
    <div className="pills">
      {options.map((o) => (
        <button key={o.value}
                className={'pill ' + (value === o.value ? 'pill-on' : '')}
                onClick={() => onChange(o.value)}>
          {o.label}{o.count != null && <span className="pill-count">{o.count}</span>}
        </button>
      ))}
    </div>
  );
}

// ---------- Button ----------
function Btn({ children, onClick, variant = 'primary', size, icon }) {
  return (
    <button className={`btn btn-${variant} ${size === 'sm' ? 'btn-sm' : ''}`} onClick={onClick}>
      {icon && <span className="btn-icon">{icon}</span>}
      {children}
    </button>
  );
}

// ---------- Data table ----------
function DataTable({ columns, rows, onRowClick, empty = 'No rows', sticky = true, dense, rowClass, stickyLast }) {
  const lastIdx = columns.length - 1;
  return (
    <div className={"table-wrap " + (dense ? 'table-dense' : '')}>
      <table className={"data-table " + (sticky ? 'table-sticky' : '') + (stickyLast ? ' table-stick-last' : '')}>
        <thead>
          <tr>
            {columns.map((c, ci) => (
              <th key={c.key} data-col={c.key} style={{ width: c.width, textAlign: c.align || 'left' }}
                  className={stickyLast && ci === lastIdx ? 'stick-last' : ''}>
                {c.label}
              </th>
            ))}
          </tr>
        </thead>
        <tbody>
          {rows.length === 0 ? (
            <tr><td colSpan={columns.length} className="empty-row">{empty}</td></tr>
          ) : rows.map((r, i) => (
            <tr key={r._key || i} onClick={() => onRowClick && onRowClick(r)}
                className={(onRowClick ? 'clickable ' : '') + (rowClass ? rowClass(r) : '')}>{columns.map((c, ci) => (
                <td key={c.key} data-col={c.key} style={{ textAlign: c.align || 'left' }}
                    className={stickyLast && ci === lastIdx ? 'stick-last' : ''}>
                  {c.render ? c.render(r) : r[c.key]}
                </td>
              ))}
            </tr>
          ))}
        </tbody>
      </table>
    </div>
  );
}

// ---------- Stat Row ----------
function StatRow({ label, value, accent, faint }) {
  return (
    <div className={"stat-row " + (accent ? 'accent' : '') + (faint ? ' faint' : '')}>
      <span className="stat-row-label">{label}</span>
      <span className="stat-row-value">{value}</span>
    </div>
  );
}

// ---------- Avatar (initials) ----------
function Avatar({ name, size = 28 }) {
  const initials = (name || '?').split(/\s+/).map(w => w[0]).slice(0, 2).join('').toUpperCase();
  const colors = ['#087B8E','#1A1A1A','#7A5BB8','#B86A2E','#3B7D4F','#9B2D6A'];
  const idx = (name || '').split('').reduce((a,c) => a + c.charCodeAt(0), 0) % colors.length;
  return (
    <div className="avatar" style={{ width: size, height: size, background: colors[idx], fontSize: size * 0.4 }}>
      {initials}
    </div>
  );
}

// ---------- Progress ----------
function Progress({ value, max, color = '#087B8E' }) {
  const pct = Math.max(0, Math.min(100, (value / max) * 100));
  return <div className="progress"><div className="progress-bar" style={{ width: pct + '%', background: color }}/></div>;
}

// ---------- Pre-completion helper ----------
// An allocation can be pulled only while its loan has not yet completed (drawn down).
// Completed loans are 'Active' or 'Redeemed'; everything else (Pipeline, Funding, Committed, Dead) is pre-completion.
function loanPreCompletion(loan) {
  return !!loan && loan.status !== 'Active' && loan.status !== 'Redeemed';
}

// ---------- Confirm dialog ----------
function ConfirmModal({ title, message, detail, confirmLabel, danger, onConfirm, onCancel }) {
  React.useEffect(() => {
    const onKey = (e) => { if (e.key === 'Escape') onCancel(); };
    document.addEventListener('keydown', onKey);
    return () => document.removeEventListener('keydown', onKey);
  }, [onCancel]);
  return (
    <div className="cf-backdrop" onClick={onCancel}>
      <div className="cf-modal" role="dialog" aria-modal="true" onClick={e => e.stopPropagation()}>
        <div className="cf-title">{title}</div>
        <div className="cf-msg">{message}</div>
        {detail && <div className="cf-detail">{detail}</div>}
        <div className="cf-actions">
          <button className="cf-btn cf-btn-ghost" onClick={onCancel}>Cancel</button>
          <button className={'cf-btn ' + (danger ? 'cf-btn-danger' : 'cf-btn-primary')} onClick={onConfirm}>
            {confirmLabel || 'Confirm'}
          </button>
        </div>
      </div>
    </div>
  );
}

Object.assign(window, {
  fmtGBP, fmtPct, fmtDate, fmtDateShort, daysBetween, daysFromAsOf,
  StatusBadge, MaturityChip, KPI, Card, MiniBars, Drawer, ConfirmModal, loanPreCompletion,
  Toolbar, SearchBox, FilterPills, Btn, DataTable, StatRow, Avatar, Progress
});

  </script>

  <script type="text/babel" data-src="view_dashboard.jsx">

function Dashboard({ data, navigate, openLoan, openWizard }) {

  const monthBarsRev   = MONTHLY_2026.map(m => m.total);
  const currentMonthIdx = 4; // May

  };

                <circle cx="60" cy="60" r="50" fill="none" stroke="#087B8E" strokeWidth="14"

              </svg>
              <div className="util-center">

              </div>

        {/* Monthly revenue chart */}

        {/* Investor breakdown */}

// ---------- Revenue chart ----------
function RevenueChart({ data }) {
  const maxGross = Math.max(...data.map(m => m.gross), 1);
  const maxRev   = Math.max(...data.map(m => m.total), 1);
  const months = data.map(m => m.month);
  const W = 800, H = 220, PAD = 28;
  const barW = (W - PAD * 2) / months.length - 8;

  // Line for revenue
  const points = data.map((m, i) => {
    const x = PAD + i * ((W - PAD * 2) / months.length) + barW / 2 + 4;
    const y = H - 20 - (m.total / maxRev) * (H - 60);
    return { x, y, v: m.total };
  });
  const pathD = points.map((p, i) => (i === 0 ? 'M' : 'L') + p.x + ',' + p.y).join(' ');

  return (
    <div className="revenue-chart">
      <div className="chart-legend">
        <span><span className="legend-swatch" style={{ background: '#087B8E' }}/>Gross lending</span>
        <span><span className="legend-swatch revenue-swatch" style={{ background: '#1A1A1A' }}/>CredX revenue</span>
      </div>
      <svg viewBox={`0 0 ${W} ${H}`} className="chart-svg" preserveAspectRatio="none">
        {[0, 0.25, 0.5, 0.75, 1].map((t, i) => (
          <line key={i} x1={PAD} x2={W - PAD} y1={H - 20 - t * (H - 60)} y2={H - 20 - t * (H - 60)}
                stroke="#E2E6EC" strokeWidth="1" strokeDasharray={t === 0 ? '' : '3 3'}/>
        ))}
        {data.map((m, i) => {
          const x = PAD + i * ((W - PAD * 2) / months.length) + 4;
          const h = (m.gross / maxGross) * (H - 60);
          const y = H - 20 - h;
          return (
            <g key={i}>
              <rect x={x} y={y} width={barW} height={h || 0} rx="2"
                    fill={m.gross > 0 ? '#087B8E' : '#E1E6EC'} opacity={m.gross > 0 ? 0.85 : 1}/>
              <text x={x + barW / 2} y={H - 6} textAnchor="middle" fontSize="11" fill="#6B7280">{m.month}</text>
            </g>
          );
        })}
        <path className="revenue-line" d={pathD} fill="none" stroke="#1A1A1A" strokeWidth="2.5"/>
        {points.map((p, i) => (
          <circle key={i} className="revenue-dot" cx={p.x} cy={p.y} r={p.v > 0 ? 4 : 0} fill="#1A1A1A" stroke="#FFFFFF" strokeWidth="1.5"/>
        ))}
      </svg>
    </div>
  );
}

// ---------- Investor deployment bars ----------
function InvestorBars({ investors, allocations }) {
  // deployment per investor from active allocations
  const deployed = {};
  for (const a of allocations.filter(x => x.status === 'Active')) {
    deployed[a.investorRef] = (deployed[a.investorRef] || 0) + a.amount;
  }
  const enriched = investors.map(i => ({
    ...i, deployed: deployed[i.ref] || 0
  })).sort((a, b) => b.deployed - a.deployed).slice(0, 8);
  const max = Math.max(...enriched.map(i => i.deployed), 1);

  return (
    <div className="inv-bars">
      {enriched.map(i => (
        <div key={i.ref} className="inv-bar-row">
          <div className="inv-bar-name">
            <Avatar name={i.name} size={24}/>
            <div>
              <div>{i.name}</div>
              <div className="muted small">{i.ref}</div>
            </div>
          </div>
          <div className="inv-bar-track">
            <div className="inv-bar-fill"
                 style={{ width: (i.deployed / max * 100) + '%',
                          background: i.isInternal ? '#1A1A1A' : '#087B8E' }}/>
          </div>
          <div className="inv-bar-val">{fmtGBP(i.deployed, { abbreviate: true })}</div>
        </div>
      ))}
    </div>
  );
}

// ---------- Alerts section (dashboard notification centre) ----------
// Re-render whenever the servicing store (applied interest periods) or the
// custom-alerts store changes, so applying a period / adding an alert is live.
function useAlertTick() {
  const [, force] = useStateD(0);
  React.useEffect(() => {
    const unsubs = [];
    if (window.CredXServicing) unsubs.push(window.CredXServicing.subscribe(() => force(x => x + 1)));
    if (window.CredXAlerts) unsubs.push(window.CredXAlerts.subscribe(() => force(x => x + 1)));
    if (window.CredXCRM) unsubs.push(window.CredXCRM.subscribe(() => force(x => x + 1)));
    return () => unsubs.forEach(u => u && u());
  }, []);
}

function relDue(days) {
  if (days == null) return { label: '', cls: '' };
  if (days < 0) return { label: `${Math.abs(days)}d overdue`, cls: 'due-overdue' };
  if (days === 0) return { label: 'Due today', cls: 'due-overdue' };
  if (days <= 7) return { label: `Due in ${days}d`, cls: 'due-soon' };
  return { label: `Due in ${days}d`, cls: '' };
}

const SEV_ORDER = { overdue: 0, soon: 1, info: 2 };

function AlertsSection({ data, navigate, openLoan }) {
  const { LOANS, ASOF_DATE } = data;
  useAlertTick();
  const [filter, setFilter] = useStateD('all');
  const [composing, setComposing] = useStateD(false);
  const [draft, setDraft] = useStateD({ loanId: '', title: '', dueDate: '', note: '' });

  const activeLoans = LOANS.filter(l => l.status === 'Active');

  // 1) Month-end interest periods awaiting application.
  const interestAlerts = [];
  if (window.computeInterestSchedule) {
    activeLoans.forEach(l => {
      const sched = window.computeInterestSchedule(l, ASOF_DATE);
      const due = sched.periods.filter(p => p.status === 'due');      // month closed, not yet posted
      const current = sched.periods.find(p => p.status === 'current'); // open period
      if (due.length) {
        const oldest = due[0];
        const total = due.reduce((s, p) => s + p.amount, 0);
        interestAlerts.push({
          kind: 'interest', sev: 'overdue', loanId: l.id,
          title: due.length > 1
            ? `${due.length} interest periods awaiting application`
            : 'Interest period awaiting application',
          tag: 'Interest', glyph: '%',
          meta: <>{l.id} · {l.borrower} · {l.interestType}</>,
          sub: `Oldest period ${fmtDateShort(oldest.start)} – ${fmtDateShort(oldest.end)}`,
          amount: total, amountLbl: due.length > 1 ? `${due.length} periods` : 'to apply',
          duechip: { label: 'Action due', cls: 'due-overdue' },
          action: { label: 'Apply', run: (e) => { e.stopPropagation(); window.CredXServicing.applyPeriod(l.id, oldest); } },
          sort: -100 - due.length,
        });
      } else if (current) {
        const dEnd = daysFromAsOf(current.end, ASOF_DATE);
        if (dEnd != null && dEnd <= 7) {
          interestAlerts.push({
            kind: 'interest', sev: 'soon', loanId: l.id,
            title: 'Interest period closes at month-end',
            tag: 'Interest', glyph: '%',
            meta: <>{l.id} · {l.borrower}</>,
            sub: `Current period ends ${fmtDate(current.end)} — apply once closed`,
            amount: current.amount, amountLbl: 'accruing',
            duechip: { label: dEnd === 0 ? 'Closes today' : `Closes in ${dEnd}d`, cls: 'due-soon' },
            sort: dEnd,
          });
        }
      }
    });
  }

  // 2) Upcoming maturities (active loans within 60 days of redemption).
  const maturityAlerts = activeLoans
    .map(l => ({ ...l, days: daysFromAsOf(l.expectedRedemption, ASOF_DATE) }))
    .filter(l => l.days != null && l.days <= 60)
    .map(l => ({
      kind: 'maturity', sev: l.days <= 14 ? 'overdue' : 'soon', loanId: l.id,
      title: l.days < 0 ? 'Past expected redemption' : 'Approaching maturity',
      tag: 'Maturity', glyph: '↻',
      meta: <>{l.id} · {l.borrower}</>,
      sub: `Redeems ${fmtDate(l.expectedRedemption)} · ${fmtGBP(l.grossLoan, { abbreviate: true })} gross`,
      maturityDays: l.days,
      sort: l.days,
    }));

  // 3) Custom alerts set on deals (e.g. at completion).
  const customAlerts = (window.CredXAlerts ? window.CredXAlerts.active() : []).map(a => {
    const loan = LOANS.find(l => l.id === a.loanId);
    const days = a.dueDate ? daysFromAsOf(a.dueDate, ASOF_DATE) : null;
    const sev = days != null && days < 0 ? 'overdue' : (days != null && days <= 7 ? 'soon' : 'info');
    return {
      kind: 'custom', sev, loanId: a.loanId || null,
      title: a.title, tag: 'Custom', glyph: '!',
      meta: a.loanId ? <>{a.loanId}{loan ? ' · ' + loan.borrower : ''}</> : 'General reminder',
      sub: a.note || (a.dueDate ? `Due ${fmtDate(a.dueDate)}` : ''),
      duechip: a.dueDate ? relDue(days) : null,
      action: { label: 'Dismiss', ghost: true, run: (e) => { e.stopPropagation(); window.CredXAlerts.dismiss(a.id); } },
      sort: days != null ? days : 500,
    };
  });

  // 4) Relationship follow-ups set on a CRM record.
  const crmAlerts = (window.CredXCRM ? window.CredXCRM.followUps() : []).map(f => {
    const days = daysFromAsOf(f.due, ASOF_DATE);
    const sev = days != null && days < 0 ? 'overdue' : (days != null && days <= 7 ? 'soon' : 'info');
    return {
      kind: 'crm', sev, loanId: null, crmId: f.id,
      title: f.what, tag: window.CredXCRM.typeShort(f.type), glyph: '☏',
      meta: f.org, sub: f.due ? 'Follow-up due ' + fmtDate(f.due) : '',
      duechip: f.due ? relDue(days) : null,
      action: { label: 'Done', ghost: true, run: (e) => { e.stopPropagation(); window.CredXCRM.clearNextAction(f.id); } },
      sort: days != null ? days : 500,
    };
  });

  const groups = { interest: interestAlerts, maturity: maturityAlerts, custom: customAlerts, crm: crmAlerts };
  const counts = {
    all: interestAlerts.length + maturityAlerts.length + customAlerts.length + crmAlerts.length,
    interest: interestAlerts.length, maturity: maturityAlerts.length,
    custom: customAlerts.length, crm: crmAlerts.length,
  };
  const overdueCount = [...interestAlerts, ...maturityAlerts, ...customAlerts, ...crmAlerts].filter(a => a.sev === 'overdue').length;

  let list = filter === 'all'
    ? [...interestAlerts, ...maturityAlerts, ...customAlerts, ...crmAlerts]
    : groups[filter];
  list = list.slice().sort((a, b) => (SEV_ORDER[a.sev] - SEV_ORDER[b.sev]) || (a.sort - b.sort));

  const pills = [
    { id: 'all', label: 'All', n: counts.all },
    { id: 'interest', label: 'Interest periods', n: counts.interest },
    { id: 'maturity', label: 'Maturities', n: counts.maturity },
    { id: 'custom', label: 'Custom', n: counts.custom },
    { id: 'crm', label: 'Relationships', n: counts.crm },
  ];

  const saveDraft = () => {
    if (!draft.title.trim()) return;
    window.CredXAlerts.add({ loanId: draft.loanId, title: draft.title, dueDate: draft.dueDate || null, note: draft.note, setAt: 'manual' });
    setDraft({ loanId: '', title: '', dueDate: '', note: '' });
    setComposing(false);
    setFilter('custom');
  };

  const summaryBits = [];
  if (counts.interest) summaryBits.push(`${counts.interest} interest period${counts.interest > 1 ? 's' : ''} to apply`);
  if (counts.maturity) summaryBits.push(`${counts.maturity} upcoming maturit${counts.maturity > 1 ? 'ies' : 'y'}`);
  if (counts.custom) summaryBits.push(`${counts.custom} custom`);
  if (counts.crm) summaryBits.push(`${counts.crm} relationship follow-up${counts.crm > 1 ? 's' : ''}`);

  return (
    <div className="view">
      <header className="view-header">
        <div>
          <div className="eyebrow">Servicing</div>
          <h1>Alerts</h1>
          <div className="view-sub">
            {counts.all === 0
              ? `Nothing needs attention · As at ${fmtDate(ASOF_DATE)}`
              : `${summaryBits.join(' · ')} · As at ${fmtDate(ASOF_DATE)}`}
          </div>
        </div>
      </header>
      <Card className="span-3 alerts-card">
      <div className="alerts-head">
        <div className="alerts-pills">
          {pills.map(p => (
            <button key={p.id}
                    className={`alerts-pill${filter === p.id ? ' is-active' : ''}`}
                    onClick={() => setFilter(p.id)}>
              {p.label}
              <span className={`pill-n${p.id === 'all' && overdueCount > 0 ? ' n-alarm' : ''}`}>
                {p.id === 'all' && overdueCount > 0 ? overdueCount + '!' : p.n}
              </span>
            </button>
          ))}
        </div>
        <div className="alerts-spacer"/>
        <button className="alerts-new-btn" onClick={() => setComposing(c => !c)}>
          <span style={{ fontSize: '15px', lineHeight: 1 }}>+</span> New alert
        </button>
      </div>

      {composing && (
        <div className="alert-composer">
          <div>
            <label>Deal</label>
            <select value={draft.loanId} onChange={e => setDraft({ ...draft, loanId: e.target.value })}>
              <option value="">General (no deal)</option>
              {LOANS.filter(l => l.status !== 'Dead').map(l => (
                <option key={l.id} value={l.id}>{l.id} · {l.borrower}</option>
              ))}
            </select>
          </div>
          <div>
            <label>Alert</label>
            <input type="text" placeholder="e.g. Chase signed personal guarantee"
                   value={draft.title} onChange={e => setDraft({ ...draft, title: e.target.value })}/>
          </div>
          <div>
            <label>Remind on</label>
            <input type="date" value={draft.dueDate} onChange={e => setDraft({ ...draft, dueDate: e.target.value })}/>
          </div>
          <div className="ac-row2">
            <input type="text" placeholder="Note (optional)"
                   value={draft.note} onChange={e => setDraft({ ...draft, note: e.target.value })}/>
            <Btn variant="ghost" onClick={() => { setComposing(false); }}>Cancel</Btn>
            <Btn variant="primary" onClick={saveDraft}>Save alert</Btn>
          </div>
        </div>
      )}

      {list.length === 0 ? (
        <div className="empty-state alerts-allclear">
          <div className="empty-state-icon">✓</div>
          <div>No {filter === 'all' ? '' : filter + ' '}alerts right now. You're all caught up.</div>
        </div>
      ) : (
        <div className="alerts-list">
          {list.map((a, i) => (
            <div key={a.kind + i} className={`alert-item sev-${a.sev}`}
                 onClick={() => a.loanId ? openLoan(a.loanId) : (a.kind === 'crm' && navigate('crm'))}>
              <div className={`alert-glyph g-${a.kind}`}>{a.glyph}</div>
              <div className="alert-body">
                <div className="alert-title-row">
                  <span className="alert-title">{a.title}</span>
                  <span className={`alert-tag${a.kind === 'interest' ? ' t-interest' : ''}`}>{a.tag}</span>
                </div>
                <div className="alert-meta">{a.meta}{a.sub ? <> — {a.sub}</> : ''}</div>
              </div>
              <div className="alert-right">
                {a.amount != null && (
                  <div className="alert-amount">
                    <div className="num">{fmtGBP(a.amount, { decimals: 0 })}</div>
                    <div className="lbl">{a.amountLbl}</div>
                  </div>
                )}
                {a.kind === 'maturity'
                  ? <MaturityChip days={a.maturityDays}/>
                  : a.duechip && <span className={`alert-duechip ${a.duechip.cls}`}>{a.duechip.label}</span>}
                {a.action && (
                  <button className={`alert-act-btn${a.action.ghost ? ' ghost' : ''}`} onClick={a.action.run}>
                    {a.action.label}
                  </button>
                )}
              </div>
            </div>
          ))}
        </div>
      )}
      </Card>
    </div>
  );
}

  <script type="text/babel" data-src="view_loans_inv.jsx">
// CredX - Loan Register view
function LoansView({ data, openLoan, openWizard, highlightId }) {
  const { LOANS, ALLOCATIONS, ASOF_DATE } = data;

  // facilities are investor-facing (tracked in the CredX Investor Portal) but
  // their servicing data stays reachable here via the Live / Redeemed filters.
  const [status, setStatus] = React.useState('Pipeline');
  const [sort, setSort] = React.useState({ key: 'completion', dir: 'desc' });
  const [svcVer, setSvcVer] = React.useState(0);

    ? window.CredXServicing.subscribe(() => setSvcVer(v => v + 1)) : undefined, []);

  const counts = {
    all: LOANS.length,
    Active: LOANS.filter(l => l.status === 'Active').length,
    Funding: LOANS.filter(l => l.status === 'Funding').length,
    Pipeline: LOANS.filter(l => l.status === 'Pipeline').length,
    Redeemed: LOANS.filter(l => l.status === 'Redeemed').length,
    Dead: LOANS.filter(l => l.status === 'Dead').length
  };

  const filtered = React.useMemo(() => {
    let rows = LOANS.slice();
    if (status !== 'all') rows = rows.filter(l => l.status === status);
    if (q) {
      const t = q.toLowerCase();
      rows = rows.filter(l => l.id.toLowerCase().includes(t) || l.borrower.toLowerCase().includes(t));
    }
    rows.sort((a, b) => {
      const av = a[sort.key], bv = b[sort.key];
      if (av == null) return 1; if (bv == null) return -1;
      const cmp = av > bv ? 1 : av < bv ? -1 : 0;
      return sort.dir === 'asc' ? cmp : -cmp;
    });
    return rows.map(l => ({
      ...l, _key: l.id,
      daysToMaturity: daysFromAsOf(l.expectedRedemption, ASOF_DATE),
      investorCount: ALLOCATIONS.filter(a => a.loanId === l.id).length,
      accrued: (l.status === 'Active' && window.computeLoanAccrual)
        ? window.computeLoanAccrual(l, ASOF_DATE).accruedInterest : null
    }));
  }, [LOANS, ALLOCATIONS, q, status, sort, ASOF_DATE, svcVer]);

  // aggregate panel
  const totals = React.useMemo(() => filtered.reduce((acc, l) => ({
    gross: acc.gross + (l.grossLoan || 0),
    net: acc.net + (l.netLoan || 0),

    { key: 'expectedRedemption', label: 'Redeems', width: 110, render: (r) => (
        <div className="cell-stack"><div>{fmtDateShort(r.expectedRedemption)}</div>
        {r.status === 'Active' && <MaturityChip days={r.daysToMaturity}/>}</div>
      )},
    { key: 'grossLoan', label: 'Gross', width: 110, align: 'right', render: (r) => (
        <span className="num">{fmtGBP(r.grossLoan)}</span>) },
    { key: 'accrued', label: 'Interest accrued', width: 120, align: 'right', render: (r) => (
        r.accrued != null
          ? <span className="num accrued-num" title="Interest accrued to date · accruing daily">{fmtGBP(r.accrued, { decimals: 0 })}</span>
          : <span className="num muted">—</span>) },
    { key: 'borrowerRate', label: 'Borrower', width: 90, align: 'right', render: (r) => (
        <span className="num">{fmtPct(r.borrowerRate, 1)}</span>) },
    { key: 'investorRate', label: 'Investor', width: 90, align: 'right', render: (r) => (
        <span className="num muted">{fmtPct(r.investorRate, 1)}</span>) },
    { key: 'credxMargin', label: 'Margin', width: 90, align: 'right', render: (r) => (
        <span className="num accent">{fmtPct(r.credxMargin, 1)}</span>) },
    { key: 'totalCredxEarnings', label: 'CredX £', width: 110, align: 'right', render: (r) => (
        <span className="num strong">{fmtGBP(r.totalCredxEarnings)}</span>) },
    { key: 'investorCount', label: 'Inv.', width: 56, align: 'center', render: (r) => (
        <span className="chip">{r.investorCount}</span>) },
    { key: 'status', label: 'Status', width: 110, render: (r) => <StatusBadge status={r.status}/> }
  ];

  return (
    <div className="view">
      <header className="view-header">
        <div>
          <div className="eyebrow">Loan register · Origination</div>
          <h1>Pipeline & funding</h1>
          <div className="view-sub">Deals in origination &amp; funding. Live &amp; redeemed facilities are tracked in the Investor Portal.</div>
        </div>
        <div className="view-actions">
          <Btn variant="ghost" icon="↓">Export CSV</Btn>
          <Btn variant="primary" icon="+" onClick={openWizard}>New loan</Btn>
        </div>
      </header>

      <div style={{
        display: 'flex', gap: 12, alignItems: 'flex-start',
        padding: '12px 16px', marginBottom: 16,
        background: 'var(--teal-50)', border: '1px solid var(--teal-600)',
        borderRadius: 10, color: 'var(--ink-2)', fontSize: 13, lineHeight: 1.55
      }}>
        <span style={{ color: 'var(--teal-600)', fontWeight: 700, fontSize: 15, flexShrink: 0, marginTop: 1 }}>↪</span>
        <div>
          <strong style={{ color: 'var(--ink)' }}>Pipeline &amp; funding deals are originated and managed here.</strong>{' '}
          A deal moves <em>Pipeline → Funding</em> once it&apos;s pushed to platform and raising capital, then{' '}
          <em>live</em> on completion. Live &amp; redeemed facilities become investor-facing and are tracked in the{' '}
          <strong style={{ color: 'var(--teal-600)' }}>CredX Investor Portal</strong> — their servicing, allocation and investor

          <button onClick={() => setStatus('Active')} style={{ background: 'none', border: 0, padding: 0, font: 'inherit', color: 'var(--teal-600)', fontWeight: 600, cursor: 'pointer', textDecoration: 'underline' }}>Live</button>{' and '}

      <div className="agg-row">
        <div className="agg-card">
          <div className="agg-label">Filtered gross</div>
          <div className="agg-val">{fmtGBP(totals.gross)}</div>

        <div className="agg-card">

        <FilterPills value={status} onChange={setStatus}

            { value: 'Funding', label: 'Funding', count: counts.Funding },
            { value: 'Active', label: 'Live', count: counts.Active },
            { value: 'Redeemed', label: 'Redeemed', count: counts.Redeemed },
            { value: 'Dead', label: 'Dead', count: counts.Dead },
            { value: 'all', label: 'All', count: counts.all }
          ]}/>
        <div className="toolbar-spacer"/>
        <select className="select" value={sort.key + '_' + sort.dir}
                onChange={(e) => { const [k,d] = e.target.value.split('_'); setSort({ key: k, dir: d }); }}>
          <option value="completion_desc">Sort: Newest completion</option>
          <option value="completion_asc">Sort: Oldest completion</option>
          <option value="expectedRedemption_asc">Sort: Next maturity</option>
          <option value="grossLoan_desc">Sort: Largest gross</option>
          <option value="totalCredxEarnings_desc">Sort: Highest CredX £</option>
        </select>
      </Toolbar>

      <DataTable columns={columns} rows={filtered} onRowClick={(r) => openLoan(r.id)} dense
                 empty={status === 'Redeemed'
                   ? 'No redeemed facilities in the origination book — redeemed facilities are tracked in the Investor Portal.'
                   : status === 'Active'
                   ? 'No live facilities match this search. Live facilities are investor-facing in the Investor Portal; their servicing data is shown here.'
                   : status === 'Funding'
                   ? 'No deals in funding. Deals appear here once pushed to platform and raising capital, before completion.'
                   : 'No loans match.'}
                 rowClass={(r) => r.id === highlightId ? 'row-new' : ''}/>
    </div>
  );
}

function InvestorsView({ data, openInvestor }) {
  const { INVESTORS, ALLOCATIONS } = data;
  const [q, setQ] = React.useState('');

  // deployment per investor (active)
  const enriched = React.useMemo(() => {
    const dep = {};
    for (const a of ALLOCATIONS.filter(x => x.status === 'Active')) {
      dep[a.investorRef] = (dep[a.investorRef] || 0) + a.amount;
    }
    return INVESTORS.map(i => ({
      ...i, _key: i.ref,
      deployed: dep[i.ref] || 0,
      utilisation: i.totalInvested > 0 ? (dep[i.ref] || 0) / i.totalInvested : 0
    })).filter(i => !q || i.name.toLowerCase().includes(q.toLowerCase()) || i.ref.toLowerCase().includes(q.toLowerCase()))

  return (

        <div>
          <div className="eyebrow">Investor register</div>

        </div>

      <div className="agg-row">

        </div>
        <div className="agg-card">

          <div className="agg-val accent">{fmtGBP(totals.deployed)}</div>

      <Toolbar>
        <SearchBox value={q} onChange={setQ} placeholder="Search investor name or ref…"/>
      </Toolbar>

      <DataTable columns={columns} rows={enriched} onRowClick={(r) => openInvestor(r.ref)} stickyLast/>
    </div>
  );
}

// CredX - Allocations view

// Add an investor allocation to a loan. Writes to the shared bridge, which
// drives the backend allocation views AND the investor portal's funding bar.
function AddAllocationModal({ data, presetLoanId, onAdd, onClose }) {
  const { LOANS, INVESTORS, ALLOCATIONS, ASOF_DATE } = data;
  // Allocatable loans: anything not redeemed/dead (pre-completion or active top-ups).
  const loanList = LOANS.filter(l => l.status !== 'Redeemed' && l.status !== 'Dead');
  const [loanId, setLoanId] = React.useState(presetLoanId || (loanList[0] && loanList[0].id) || '');
  const [investorRef, setInvestorRef] = React.useState('');
  const [amountStr, setAmountStr] = React.useState('');
  const [rateStr, setRateStr] = React.useState('');

  const loan = LOANS.find(l => l.id === loanId);
  // Prefill rate from the loan's investor rate whenever the loan changes.
  React.useEffect(() => {
    if (loan) setRateStr(String((loan.investorRate * 100).toFixed(2)).replace(/\.00$/, ''));
  }, [loanId]);

  React.useEffect(() => {
    const onKey = (e) => { if (e.key === 'Escape') onClose(); };
    document.addEventListener('keydown', onKey);
    return () => document.removeEventListener('keydown', onKey);
  }, [onClose]);

  const amount = parseFloat(amountStr) || 0;
  const rate = (parseFloat(rateStr) || 0) / 100;
  const target = loan ? (loan.fundingRequirement || loan.grossLoan) : 0;
  const already = ALLOCATIONS.filter(a => a.loanId === loanId).reduce((s, a) => s + (a.amount || 0), 0);
  const remaining = Math.max(0, target - already);
  const pctExisting = target > 0 ? Math.min(1, already / target) : 0;
  const pctAdd = target > 0 ? Math.min(1 - pctExisting, amount / target) : 0;
  const over = amount > remaining + 0.5;

  const term = loan ? loan.termMonths : 0;
  const monthlyInterest = amount * rate / 12;
  const totalInterest = monthlyInterest * term;
  const totalRepayment = amount + totalInterest;
  const preComplete = loan ? loanPreCompletion(loan) : false;

  const canSubmit = loan && investorRef && amount > 0 && rate > 0;

  const submit = () => {
    if (!canSubmit) return;
    onAdd({
      investorRef,
      loanId,
      amount,
      rate,
      termMonths: term,
      fundingDate: preComplete ? null : loan.completion,
      expectedRedemption: loan.expectedRedemption,
      monthlyInterest: Math.round(monthlyInterest * 100) / 100,
      totalInterest: Math.round(totalInterest * 100) / 100,
      totalRepayment: Math.round(totalRepayment * 100) / 100,
      status: preComplete ? 'Committed' : 'Active',
    });
    onClose();
  };

  return (
    <div className="cf-backdrop" onClick={onClose}>
      <div className="cf-modal cf-modal-wide" role="dialog" aria-modal="true" onClick={e => e.stopPropagation()}>
        <div className="cf-title">Add allocation</div>
        <div className="cf-msg">Commit an investor's capital to a loan. {preComplete
          ? 'This deal is pre-completion, so the allocation is recorded as a commitment and updates the deal\u2019s funding on the investor portal.'
          : 'This loan has completed; the allocation is recorded as funded.'}</div>

        <div className="aa-grid">
          <div className="aa-field">
            <label className="aa-label">Loan</label>
            <select className="wz-input" value={loanId} onChange={e => setLoanId(e.target.value)}>

            </div>
            <div className="aa-bar">

              <div className={'aa-bar-fill ' + (over ? 'over' : 'add')} style={{ width: (pctAdd * 100) + '%' }}/>
            </div>
            <div className="aa-foot">
              <span>{fmtGBP(already)} committed · {Math.round((pctExisting + pctAdd) * 100)}% with this allocation</span>
              {over
                ? <span className="warn">Exceeds remaining by {fmtGBP(amount - remaining)}</span>
                : <span>{fmtGBP(Math.max(0, remaining - amount))} remaining</span>}
            </div>
          </div>

            <div className="d"><span className="d-l">Monthly int.</span><span className="d-v">{fmtGBP(monthlyInterest, { decimals: 0 })}</span></div>

                  onClick={submit}>Add allocation</button>

      </div>
    </div>
  );
}

function AllocationsView({ data, openLoan, openInvestor, removeAllocation, addAllocation }) {
  const { ALLOCATIONS, LOANS, INVESTORS, ASOF_DATE } = data;
  const [q, setQ] = React.useState('');
  const [loanFilter, setLoanFilter] = React.useState('all');
  const [confirm, setConfirm] = React.useState(null);   // allocation row pending removal
  const [addOpen, setAddOpen] = React.useState(false);  // add-allocation modal

  const investorByRef = Object.fromEntries(INVESTORS.map(i => [i.ref, i]));
  const loanById = Object.fromEntries(LOANS.map(l => [l.id, l]));

  const rows = ALLOCATIONS
    .filter(a => loanFilter === 'all' || a.loanId === loanFilter)
    .filter(a => {
      if (!q) return true;
      const t = q.toLowerCase();
      const inv = investorByRef[a.investorRef]?.name || '';
      return a.loanId.toLowerCase().includes(t) ||
             a.investorRef.toLowerCase().includes(t) ||
             inv.toLowerCase().includes(t);
    })
    .map((a, i) => ({
      ...a, _key: a._id != null ? a._id : i,
      investor: investorByRef[a.investorRef]?.name || '-',
      loanBorrower: loanById[a.loanId]?.borrower || '-',
      loanStatus: loanById[a.loanId]?.status,
      preCompletion: loanPreCompletion(loanById[a.loanId]),
      daysToMaturity: daysFromAsOf(a.expectedRedemption, ASOF_DATE)
    }))
    .sort((a,b) => (a.daysToMaturity || 999) - (b.daysToMaturity || 999));

  const totals = rows.reduce((acc, r) => ({
    amount: acc.amount + r.amount,
    interest: acc.interest + r.totalInterest,
    repay: acc.repay + r.totalRepayment
  }), { amount: 0, interest: 0, repay: 0 });

  const columns = [
    { key: 'loanId', label: 'Loan', width: 100, render: (r) => (
        <button className="loan-link" onClick={(e) => { e.stopPropagation(); openLoan(r.loanId); }}>{r.loanId}</button>) },
    { key: 'loanBorrower', label: 'Borrower', render: (r) => (
        <div className="cell-stack"><div>{r.loanBorrower}</div>
        <div className="muted small">{r.termMonths}m · redeems {fmtDateShort(r.expectedRedemption)}</div></div>) },
    { key: 'investor', label: 'Investor', render: (r) => (
        <div className="cell-row">
          <Avatar name={r.investor} size={24}/>
          <div className="cell-stack"><div>{r.investor}</div><div className="muted small">{r.investorRef}</div></div>
        </div>) },
    { key: 'amount', label: 'Amount', width: 120, align: 'right', render: (r) => (
        <span className="num strong">{fmtGBP(r.amount)}</span>) },
    { key: 'rate', label: 'Rate', width: 70, align: 'right', render: (r) => fmtPct(r.rate, 1) },
    { key: 'monthlyInterest', label: 'Mthly Int.', width: 100, align: 'right',
      render: (r) => <span className="num muted">{fmtGBP(r.monthlyInterest, { decimals: 0 })}</span> },
    { key: 'totalInterest', label: 'Total Int.', width: 110, align: 'right',
      render: (r) => <span className="num">{fmtGBP(r.totalInterest)}</span> },
    { key: 'totalRepayment', label: 'Repayment', width: 120, align: 'right',
      render: (r) => <span className="num strong">{fmtGBP(r.totalRepayment)}</span> },
    { key: 'daysToMaturity', label: 'Maturity', width: 110, render: (r) => <MaturityChip days={r.daysToMaturity}/> },
    { key: 'status', label: 'Status', width: 100, render: (r) => <StatusBadge status={r.status}/> },
    { key: '_remove', label: '', width: 92, align: 'right', render: (r) => (
        r.preCompletion
          ? <button className="alloc-remove-btn" title="Pull this allocation before the loan completes"
                    onClick={(e) => { e.stopPropagation(); setConfirm(r); }}>Remove</button>
          : <span className="alloc-remove-lock" title="Loan has completed - allocation locked">Funded</span>) }
  ];

  const loanOptions = [{ value: 'all', label: 'All loans' }].concat(LOANS.map(l => ({ value: l.id, label: l.id })));

  return (
    <div className="view">
      <header className="view-header">
        <div>
          <div className="eyebrow">Investor allocations</div>
          <h1>Allocations</h1>
          <div className="view-sub">One row per investor per loan · pre-completion allocations can be removed</div>
        </div>
        <div className="view-actions">
          <Btn variant="ghost" icon="↓">Export CSV</Btn>
          <Btn variant="primary" icon="+" onClick={() => setAddOpen(true)}>New allocation</Btn>
        </div>
      </header>

      <div className="agg-row">
        <div className="agg-card">
          <div className="agg-label">Allocations</div>
          <div className="agg-val">{rows.length}</div>
        </div>
        <div className="agg-card">
          <div className="agg-label">Capital allocated</div>
          <div className="agg-val">{fmtGBP(totals.amount)}</div>
        </div>
        <div className="agg-card">
          <div className="agg-label">Investor interest</div>
          <div className="agg-val">{fmtGBP(totals.interest)}</div>
        </div>
        <div className="agg-card">
          <div className="agg-label">Total repayment</div>
          <div className="agg-val accent">{fmtGBP(totals.repay)}</div>
        </div>
      </div>

      <Toolbar>
        <SearchBox value={q} onChange={setQ} placeholder="Search investor, ref, or loan ID…"/>
        <select className="select" value={loanFilter} onChange={(e) => setLoanFilter(e.target.value)}>
          {loanOptions.map(o => <option key={o.value} value={o.value}>{o.label}</option>)}
        </select>
      </Toolbar>

      <DataTable columns={columns} rows={rows} dense/>

      {confirm && (
        <ConfirmModal
          title="Remove allocation"
          danger
          confirmLabel="Remove allocation"
          message={`Pull ${confirm.investor}'s ${fmtGBP(confirm.amount)} allocation from ${confirm.loanId}?`}
          detail={`${confirm.loanId} is pre-completion (${confirm.loanStatus}). This frees the investor's commitment and updates the deal's funding. It can be re-added before the loan draws down.`}
          onCancel={() => setConfirm(null)}
          onConfirm={() => { removeAllocation(confirm); setConfirm(null); }}/>
      )}
      {addOpen && (
        <AddAllocationModal
          data={data}
          presetLoanId={loanFilter !== 'all' ? loanFilter : undefined}
          onAdd={addAllocation}
          onClose={() => setAddOpen(false)}/>
      )}
    </div>
  );
}

  <script type="text/babel" data-src="view_reports.jsx">
// CredX - Maturity Tracker
function MaturityView({ data, openLoan }) {
  const { LOANS, ALLOCATIONS, ASOF_DATE } = data;

  const active = LOANS.filter(l => l.status === 'Active')
    .map(l => {
      const allocs = ALLOCATIONS.filter(a => a.loanId === l.id);
      const totalRepay = allocs.reduce((s,a) => s + a.totalRepayment, 0);
      return {
        ...l, _key: l.id,
        daysToMaturity: daysFromAsOf(l.expectedRedemption, ASOF_DATE),
        investorRepayment: totalRepay
      };
    }).sort((a,b) => a.daysToMaturity - b.daysToMaturity);

  const buckets = {
    critical: active.filter(l => l.daysToMaturity <= 7).length,
    soon: active.filter(l => l.daysToMaturity > 7 && l.daysToMaturity <= 30).length,
    medium: active.filter(l => l.daysToMaturity > 30 && l.daysToMaturity <= 90).length,
    far: active.filter(l => l.daysToMaturity > 90).length
  };

  // Timeline: 12 months from as-of
  const asOf = new Date(ASOF_DATE);
  const timelineStart = new Date(asOf); timelineStart.setDate(1);
  const months = [];
  for (let i = 0; i < 24; i++) {
    const m = new Date(timelineStart); m.setMonth(m.getMonth() + i);
    months.push(m);
  }
  const totalMs = months[months.length - 1] - months[0];

  const columns = [
    { key: 'id', label: 'Loan', width: 100, render: (r) => <span className="loan-id">{r.id}</span> },
    { key: 'borrower', label: 'Borrower', render: (r) => r.borrower },
    { key: 'completion', label: 'Completion', width: 110, render: (r) => fmtDateShort(r.completion) },
    { key: 'termMonths', label: 'Term', width: 60, align: 'center', render: (r) => `${r.termMonths}m` },
    { key: 'expectedRedemption', label: 'Redeems', width: 110, render: (r) => fmtDateShort(r.expectedRedemption) },
    { key: 'daysToMaturity', label: 'Days', width: 110, render: (r) => <MaturityChip days={r.daysToMaturity}/> },
    { key: 'grossLoan', label: 'Gross', width: 110, align: 'right', render: (r) => fmtGBP(r.grossLoan) },
    { key: 'investorRepayment', label: 'Inv. repayment', width: 130, align: 'right',
      render: (r) => <span className="num strong">{fmtGBP(r.investorRepayment)}</span> },
    { key: 'totalCredxEarnings', label: 'CredX £', width: 110, align: 'right',
      render: (r) => <span className="num accent">{fmtGBP(r.totalCredxEarnings)}</span> }
  ];

  return (
    <div className="view">
      <header className="view-header">
        <div>
          <div className="eyebrow">Maturity tracker</div>
          <h1>Maturities</h1>
          <div className="view-sub">All active loans ranked by days to redemption · As at {fmtDate(ASOF_DATE)}</div>
        </div>
      </header>

      <div className="kpi-grid kpi-grid-4">
        <KPI label="≤ 7 days" value={buckets.critical} accent={buckets.critical > 0 ? 'red' : null}
             sub="Critical / overdue"/>
        <KPI label="8 - 30 days" value={buckets.soon} sub="Maturing soon"/>
        <KPI label="31 - 90 days" value={buckets.medium} sub="Medium-term"/>
        <KPI label="90+ days" value={buckets.far} sub="Long-dated"/>
      </div>

      <Card title="24-month maturity timeline">
        <div className="timeline">
          <div className="timeline-axis">
            {months.map((m, i) => i % 3 === 0 && (
              <div key={i} className="timeline-tick" style={{ left: ((m - months[0]) / totalMs * 100) + '%' }}>
                <div className="tick-mark"/>
                <div className="tick-label">{m.toLocaleDateString('en-GB', { month: 'short', year: '2-digit' })}</div>
              </div>
            ))}
            <div className="timeline-today" style={{ left: ((asOf - months[0]) / totalMs * 100) + '%' }}>
              <span className="today-label">Today</span>
            </div>
          </div>
          <div className="timeline-loans">
            {active.map((l, i) => {
              const x = ((new Date(l.expectedRedemption) - months[0]) / totalMs * 100);
              const start = ((new Date(l.completion) - months[0]) / totalMs * 100);
              const w = Math.max(x - start, 1);
              let color = '#087B8E';
              if (l.daysToMaturity <= 7) color = '#D14536';
              else if (l.daysToMaturity <= 30) color = '#E2724E';
              return (
                <div key={l.id} className="timeline-row" onClick={() => openLoan(l.id)}>
                  <div className="timeline-row-label">
                    <span className="loan-id">{l.id}</span>
                    <span className="muted small">{l.borrower}</span>
                  </div>
                  <div className="timeline-bar" style={{ left: Math.max(start, 0) + '%', width: w + '%', background: color }}>
                    <span className="bar-pin" style={{ background: color }}/>
                  </div>
                  <div className="timeline-row-meta">
                    <MaturityChip days={l.daysToMaturity}/>
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      </Card>

      <Card title="Active loans ranked by maturity" padded={false}>
        <DataTable columns={columns} rows={active} onRowClick={(r) => openLoan(r.id)} dense/>
      </Card>
    </div>
  );
}

// CredX - Monthly Summary

  const maxGross = Math.max(...MONTHLY_2026.map(m => m.gross), 1);

  return (

          <Btn variant="ghost" icon="↓">Export</Btn>
        </div>
      </header>

      <div className="kpi-grid kpi-grid-4">
        <KPI label="Gross lending" value={fmtGBP(annual.gross, { abbreviate: true })}
             sub={`${annual.deals} deals`} accent="teal" big/>
        <KPI label="Net lending" value={fmtGBP(annual.net, { abbreviate: true })}/>
        <KPI label="Investor interest" value={fmtGBP(annual.invInt, { abbreviate: true })}/>
        <KPI label="CredX revenue" value={fmtGBP(annual.total, { abbreviate: true })} accent="gold" big
             sub={`Inc. ${fmtGBP(annual.fees, { abbreviate: true })} fees`}/>
      </div>

      <Card title={`Month-by-month · ${year}`} padded={false}>
        <table className="data-table dense-table monthly-table">
          <thead>
            <tr>
              <th>Month</th><th className="num-h">Deals</th><th className="num-h">Gross</th>
              <th>Volume</th>
              <th className="num-h">Net</th>
              <th className="num-h">Inv. Int.</th>
              <th className="num-h">CredX Int.</th>
              <th className="num-h">Fees</th>
              <th className="num-h">Total CredX</th>
              <th>Revenue</th>
            </tr>
          </thead>
          <tbody>
            {MONTHLY_2026.map((m,i) => (
              <tr key={i} className={m.deals === 0 ? 'row-empty' : ''}>
                <td><strong>{m.month}</strong></td>
                <td className="num">{m.deals}</td>
                <td className="num">{m.gross > 0 ? fmtGBP(m.gross) : '-'}</td>
                <td><div className="row-bar"><div className="row-bar-fill"
                    style={{ width: (m.gross/maxGross*100)+'%', background: '#087B8E' }}/></div></td>
                <td className="num muted">{m.net > 0 ? fmtGBP(m.net) : '-'}</td>
                <td className="num muted">{m.invInt > 0 ? fmtGBP(m.invInt) : '-'}</td>
                <td className="num muted">{m.credxInt > 0 ? fmtGBP(m.credxInt) : '-'}</td>
                <td className="num muted">{m.fees > 0 ? fmtGBP(m.fees) : '-'}</td>
                <td className="num strong accent">{m.total > 0 ? fmtGBP(m.total) : '-'}</td>
                <td><div className="row-bar"><div className="row-bar-fill"
                    style={{ width: (m.total/maxRev*100)+'%', background: '#1A1A1A' }}/></div></td>
              </tr>
            ))}
            <tr className="row-total">
              <td><strong>ANNUAL</strong></td>
              <td className="num"><strong>{annual.deals}</strong></td>
              <td className="num"><strong>{fmtGBP(annual.gross)}</strong></td>
              <td></td>
              <td className="num"><strong>{fmtGBP(annual.net)}</strong></td>
              <td className="num"><strong>{fmtGBP(annual.invInt)}</strong></td>
              <td className="num"><strong>{fmtGBP(annual.credxInt)}</strong></td>
              <td className="num"><strong>{fmtGBP(annual.fees)}</strong></td>
              <td className="num accent"><strong>{fmtGBP(annual.total)}</strong></td>
              <td></td>
            </tr>
          </tbody>
        </table>
      </Card>
    </div>
  );
}

        <Card title="Margin waterfall" className="span-2">
          <Waterfall items={[
            { label: 'Gross borrower interest', value: F.grossBorrowerInterest, kind: 'plus' },

            { label: 'Net CredX interest', value: F.totalCredxInterest, kind: 'sub' },
            { label: 'CredX fees', value: F.totalCredxFees, kind: 'plus' },
            { label: 'Total CredX revenue', value: F.totalCredxRevenue, kind: 'total' }
          ]}/>
        </Card>

        <Card title="CredX self-funded positions">
          <StatRow label="Capital committed (1221/000)" value={fmtGBP(F.credxSelfCapital)}/>
          <StatRow label="Internal interest earned" value={fmtGBP(F.credxInternalInterest)}/>
          <StatRow label="Total position recovery" value={fmtGBP(F.credxPositionRecovery)} accent/>

        <Card title="Default interest (accrued · ring-fenced)" className="span-3">

              <div className="default-val">{fmtGBP(F.defaultInterestAccrued)}</div>
            </div>

              <div className="muted small">Memo: total revenue + accrued default</div>
              <div className="default-val accent">{fmtGBP(F.totalCredxRevenue)}</div>
            </div>
          </div>
        </Card>
      </div>
    </div>
  );
}

function Waterfall({ items }) {
  const max = Math.max(...items.map(i => Math.abs(i.value)));
  return (
    <div className="waterfall">
      {items.map((it, i) => {
        const w = Math.abs(it.value) / max * 100;
        const colors = {
          plus: '#087B8E', minus: '#D14536', sub: '#6B7280', total: '#1A1A1A'
        };
        return (
          <div key={i} className={"wf-row wf-" + it.kind}>
            <div className="wf-label">{it.label}</div>
            <div className="wf-bar-wrap">
              <div className="wf-bar" style={{ width: w + '%', background: colors[it.kind] }}/>
            </div>
            <div className="wf-val">{it.value < 0 ? '-' : ''}{fmtGBP(Math.abs(it.value))}</div>
          </div>
        );
      })}
    </div>
  );
}
