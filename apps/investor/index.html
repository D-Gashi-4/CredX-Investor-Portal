  <!-- CredX wordmark, embedded as base64 PNG data URLs. Loaded BEFORE
       any component that renders the logo so the constants exist on
       window when first paint runs. Keeps the bundler scanner happy:
       there are no <img src="assets/..."> refs left in the codebase. -->
  <!-- CredX wordmark as vector paths, loaded BEFORE any component that
       renders the logo so the constants exist on window at first paint. -->
  <script src="src/credx-logo-svg.js"></script>

  <!-- Shared data bridge with the employee backend (CredX Platform.html).
       Plain script, loaded before the app so window.CredXBridge exists. -->
  <script src="src/credx-guide-doc.js"></script>
  <script src="src/credx-bridge.js"></script>

  <!-- Official Investor Statement generator — shared with the employee
       backend. Plain script; exposes window.buildInvestorStatementHTML,
       openInvestorStatement, downloadStatementData. -->
